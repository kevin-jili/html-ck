(function(){const L=[],o={log:console.log,warn:console.warn,error:console.error,info:console.info};const ft=()=>{const d=new Date();return d.toLocaleString('zh-CN',{hour12:0})+'.'+String(d.getMilliseconds()).padStart(3,'0')};['log','warn','error','info'].forEach(k=>{console[k]=function(...a){L.push('['+k.toUpperCase()+' '+ft()+'] '+a.map(x=>typeof x=='object'?JSON.stringify(x):x).join(' '));o[k].apply(console,a)}});onerror=(m,s,l,c,e)=>{L.push('[ERR '+ft()+'] '+m+'@'+s+':'+l+':'+c+'\n'+(e&&e.stack));return 1};addEventListener('unhandledrejection',e=>{const r=e.reason;L.push('[REJ '+ft()+'] '+(r&&r.message||r)+'\n'+(r&&r.stack))});

window.__il=function(u,act,extra){L.push('[ICON '+ft()+'] '+act+' | '+u+' | '+(extra||''))};
window.__gl=()=>L.join('\n\n')})();
function ilog(u,a,e){try{window.__il(u,a,e)}catch(_){}}
/* 日志文件名：游戏平台日志_20261014_15:03:43.txt */
function fname(){const d=new Date(),p=function(x){return String(x).padStart(2,'0')};
 return '游戏平台日志_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.txt'}

 return 'jili-game_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.html'}
/* ===== 图标持久化层：IndexedDB 优先 → CacheStorage 降级 ===== */
/* key 用归一化路径，换 Pages/raw 地址形式也能命中同一份缓存 */
function ikey(u){const g=gp(u);return g?(g.us+'/'+g.rp+'@'+g.br+'/'+g.pa):u}
const DBN='jili-icons',DBS='ic';let _db=null,_idbBad=0;
function idb(){return new Promise(function(res){
 if(_db){res(_db);return}
 if(_idbBad){res(null);return}
 try{
  const q=indexedDB.open(DBN,1);
  q.onupgradeneeded=function(){const d=q.result;if(!d.objectStoreNames.contains(DBS))d.createObjectStore(DBS)};

  q.onerror=function(){_idbBad=1;ilog('','IndexedDB','不可用→降级CacheStorage');res(null)};
 }catch(e){_idbBad=1;ilog('','IndexedDB','异常→降级CacheStorage');res(null)}
})}
function idbGet(k){return idb().then(function(d){if(!d)return null;return new Promise(function(res){
 try{const t=d.transaction(DBS,'readonly'),r=t.objectStore(DBS).get(k);
  r.onsuccess=function(){res(r.result||null)};r.onerror=function(){res(null)}}catch(e){res(null)}})})}

 try{const t=d.transaction(DBS,'readwrite');t.objectStore(DBS).put(v,k);t.oncomplete=function(){res(1)};t.onerror=function(){res(0)}}catch(e){res(0)}})})}
/* 统一读：先 IndexedDB，没有再 CacheStorage */
function loadIcon(u0){const k=ikey(u0);
 return idbGet(k).then(function(rec){
  if(rec&&rec.blob){ilog(u0,'本地图(IDB)','命中 '+(rec.blob.size/1024).toFixed(0)+'KB '+(rec.day||''));return rec}
  return gc(u0).then(function(b){if(b){ilog(u0,'本地图(Cache)','命中 '+(b.size/1024).toFixed(0)+'KB');return{blob:b,etag:'',lm:'',day:''} }
   return null})})}
/* 统一写：两级都写 */
function saveIcon2(u0,b,et,lm){const k=ikey(u0),rec={blob:b,etag:et||'',lm:lm||'',day:today(),size:b.size};
 return idbSet(k,rec).then(function(v){return pc(u0,b,et,lm).then(function(w){return{idb:v?1:0,cache:w?1:0}})})}
function today(){const d=new Date(),p=function(x){return String(x).padStart(2,'0')};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())}
/* ===== 图标复用池：已成功加载的图标节点直接复用，不重复竞速 ===== */

/* ===== 日志按钮：连点3次才抓日志，1-2次只提示 ===== */
(function(){const btn=document.getElementById('logBtn');let n=0,tm=null,ht=null,dlT=null;

  h.classList.add('show');clearTimeout(ht);ht=setTimeout(function(){h.classList.remove('show')},3000)}

  d=document.createElement('div');d.id='logDl';d.className='log-dl';d.textContent='下载日志为TXT';

const CN='gi-v1';async function gc(k){try{const c=await caches.open(CN),r=await c.match(k);if(r&&r.ok)return await r.blob()}catch(e){return null}}async function pc(k,b,e2,l){try{const c=await caches.open(CN),h=new Headers({'Content-Type':b.type||'image/jpeg'});if(e2)h.set('ETag',e2);if(l)h.set('Last-Modified',l);await c.put(k,new Response(b,{headers:h}));return 1}catch(e){return 0}}/* ===== 7源镜像（学揭棋引擎）：raw / pages 双向派生 ===== */
function gp(u){try{const U=new URL(u,location.href),h=U.hostname,ps=U.pathname.split('/').filter(function(p){return p});let us='',rp='',br='main',pa='';
 if(h==='raw.githubusercontent.com'){if(ps.length>=4){us=ps[0];rp=ps[1];br=ps[2];pa=ps.slice(3).join('/')}}
 else if(/\.github\.io$/.test(h)){us=h.replace(/\.github\.io$/,'');if(ps.length>=2){rp=ps[0];pa=ps.slice(1).join('/')}}
 else return null;
 if(!us||!rp||!pa)return null;return{us:us,rp:rp,br:br,pa:pa}}catch(e){return null}}
function rawOf(u){const p=gp(u);return p?('https://raw.githubusercontent.com/'+p.us+'/'+p.rp+'/'+p.br+'/'+p.pa):u}
function mirrors(u){const p=gp(u);if(!p)return[u];const raw=rawOf(u),g='https://cdn.jsdelivr.net/gh/'+p.us+'/'+p.rp+'@'+p.br+'/'+p.pa,f='https://fastly.jsdelivr.net/gh/'+p.us+'/'+p.rp+'@'+p.br+'/'+p.pa,pg='https://'+p.us+'.github.io/'+p.rp+'/'+p.pa;
 return[g,pg,raw,f,'https://gh-proxy.com/'+raw,'https://ghfast.top/'+raw,'https://hk.gh-proxy.org/'+raw]}
/* 并发竞速：7源同时发img，谁先解码成功用谁（不依赖CORS） */
function raceImg(srcs,u,cb){let fin=0,win=null;
 function batch(list,tag){let ok=0,bad=0;
  list.forEach(function(su,i){const im=new Image();let dn=0;
   im.onload=function(){if(dn)return;dn=1;ok++;if(fin)return;fin=1;win=su;
    ilog(su,'竞速胜出('+tag+'#'+(i+1)+')',(im.naturalWidth||0)+'x'+(im.naturalHeight||0));cb(su)};
   im.onerror=function(){if(dn)return;dn=1;bad++;ilog(su,tag+'源#'+(i+1)+'失败','onerror')};

 if(bk.length)setTimeout(function(){if(fin)return;ilog(u,'主源未胜出','启用'+(bk.length)+'个备用代理');batch(bk,'备')},6000);

/* raw 唯一更新源校验（保证拿到最新图） */
async function up(u,onNew){if(!u)return;const ru=rawOf(u);try{let e='',l='';try{const c=await caches.open(CN),r=await c.match(u);if(r){e=r.headers.get('ETag')||'';l=r.headers.get('Last-Modified')||''}}catch(_){}

 const b=await r.blob();saveIcon2(u,b,r.headers.get('ETag')||'',r.headers.get('Last-Modified')||'');
