var Cache = {
  db:null, name:'jieqi_engine_cache', store:'files',
  open(){
    if(this.db) return Promise.resolve(this.db);
    var self=this;
    return new Promise(function(res,rej){
      if(!window.indexedDB){ rej(new Error('浏览器不支持 IndexedDB')); return; }
      var req;
      try{ req = indexedDB.open(self.name, 1); }
      catch(e){ rej(e); return; }
      req.onupgradeneeded = function(){ var db=req.result; if(!db.objectStoreNames.contains(self.store)) db.createObjectStore(self.store); };
      req.onsuccess = function(){ self.db=req.result; res(self.db); };
      req.onerror = function(){ rej(req.error||new Error('IndexedDB 打开失败')); };
      setTimeout(function(){ if(!self.db) rej(new Error('IndexedDB 超时')); }, 8000);
    });
  },
  async get(key){
    try{
      var db = await this.open();
      return await new Promise(function(res,rej){
        var tx=db.transaction(['files'],'readonly');
        var r=tx.objectStore('files').get(key);
        r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
      });
    }catch(e){ return null; }
  },
  async put(key, val){
    try{
      var db = await this.open();
      return await new Promise(function(res,rej){
        var tx=db.transaction(['files'],'readwrite');
        tx.objectStore('files').put(val, key);
        tx.oncomplete=function(){ res(true); }; tx.onerror=function(){ rej(tx.error); };
      });
    }catch(e){ log('W','写入缓存失败',{key:key,msg:e.message}); return false; }
  },
  async clear(){
    try{
      var db = await this.open();
      return await new Promise(function(res,rej){
        var tx=db.transaction(['files'],'readwrite');
        tx.objectStore('files').clear();
        tx.oncomplete=function(){ res(true); }; tx.onerror=function(){ rej(tx.error); };
      });
    }catch(e){ return false; }
  }
};

async function sha256(buf){
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      var d = await crypto.subtle.digest('SHA-256', buf);
      var a = new Uint8Array(d), h='';
      for(var i=0;i<a.length;i++) h += ('0'+a[i].toString(16)).slice(-2);
      return h;
    }
  }catch(e){}
  return null;
}

async function fetchStream(url, ctl, onChunk){
  var opt = { cache:'no-store' };
  if(ctl) opt.signal = ctl.signal;
  var r = await fetch(url, opt);
  if(!r.ok) throw new Error('HTTP'+r.status);
  var len = parseInt(r.headers.get('content-length')||'0', 10);
  if(r.body && r.body.getReader){
    var rd = r.body.getReader(), parts=[], got=0;
    for(;;){
      var d = await rd.read();
      if(d.done) break;
      parts.push(d.value); got += d.value.length;
      if(onChunk) onChunk(got, len);
    }
    return await (new Blob(parts)).arrayBuffer();
  }
  var b = await r.arrayBuffer();
  if(onChunk) onChunk(b.byteLength, len || b.byteLength);
  return b;
}

function raceFile(file, sources, onProg){
  return new Promise(function(resolve, reject){
    var settled=false, ctls=[], failed=0, progState=[];
    sources.forEach(function(src, i){
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      ctls.push(ctl);
      progState[i] = { got:0, len:0 };
      (async function(){
        var buf;
        try{
          buf = await fetchStream(src.url + file, ctl, function(got, len){
            progState[i].got = got; progState[i].len = len;
          });
          if(!buf || buf.byteLength===0) throw new Error('空响应');
        }catch(e){
          failed++;
          if(!settled) log('D','下载源失败', { file:file, source:src.label, msg:String(e&&e.message||e).slice(0,70) });
          if(failed>=sources.length && !settled){
            settled=true;
            reject(new Error('全部 '+sources.length+' 个源均下载失败'));
          }
          return;
        }
        if(settled) return;              
        settled = true;
        
        for(var j=0;j<ctls.length;j++){ if(j!==i && ctls[j]){ try{ ctls[j].abort(); }catch(e){} } }
        log('I','赛马获胜', { file:file, source:src.label, bytes:buf.byteLength });
        resolve({ buf:buf, source:src });
      })();
    });
    
    if(onProg){
      var t = setInterval(function(){
        if(settled){ clearInterval(t); return; }
        var best=null, bi=-1;
        for(var k=0;k<progState.length;k++){
          var p=progState[k];
          if(p.got>0 && (!best || p.got>best.got)){ best=p; bi=k; }
        }
        if(best) onProg(best.got, best.len, sources[bi]);
      }, 200);
      setTimeout(function(){ clearInterval(t); }, 120000);
    }
  });
}

"    w.addEventListener('messageerror', function(){ rec.err='messageerror'; WW.errs.push(rec); });",

var ENGINE = {
  worker:null, ready:null, sourceLabel:'-', fromCache:false,
  searching:false, token:0, queue:Promise.resolve(), lines:[],
  variant:'st', threads:1, hash:32, hashSet:false,
  handshakeDone:false, lastError:null,
  info:{ depth:0, score:null, nodes:0, hashfull:0, nps:0 },

  /* 线程数策略（v3.0 起）：
     ① 用户手动指定 → 直接用
     ② 上次成功跑通过的值 → 直接用（避免每次都去撞注定失败的高档位）
     ③ 否则 = CPU 核心数（设备多少核就用多少核，不再砍半封顶 4）
     上限 32，下限 1。 */

  /* 线程数策略（v3.4.0 起，已简化）：
     实测两台设备（E3-1230v3 4核8线程 / K90 真8核）各档对比，
     「用满核心数」在两台机器上都是 nps 最高档，因此不再做任何探测，
     直接 = CPU 核心数。设置页「记住线程数」开关打开时才用用户设的值。 */

  cores(){
    var c = navigator.hardwareConcurrency || 1;
    return Math.max(1, Math.min(64, c|0));
  },
  threadsRemember(){
    try{ return localStorage.getItem('jieqi-threads-remember') === '1'; }catch(e){ return false; }
  },
  pickThreads(){
    
    if(typeof SESSION_THREADS === 'number' && SESSION_THREADS >= 1 && SESSION_THREADS <= this.cores())
      return SESSION_THREADS;
    if(this.threadsRemember()){
      var v = null;
      try{ v = parseInt(localStorage.getItem('jieqi-threads'), 10); }catch(e){}
      if(v && v >= 1 && v <= this.cores()) return v;
    }
    return this.cores();
  },
  /* 握手成功后不再写任何线程记录（v3.4 起无「上次成功」概念） */

  rememberThreads(t){ /* 保留空实现，避免调用点报错 */
 },

  /* 建议 Hash = 线程数 × 32MB（多线程共享一张置换表，线程越多越要大，
     否则多个线程抢同一块小表，冲突率飙升，深度反而下降） */

  suggestedHash(){
    var t = (this.variant === 'mt') ? (this.threads || 1) : 1;
    return Math.max(16, Math.min(1024, t * 32));
  },
  currentHash(){ return this.hash || 32; },
  /* 按难度设置 Hash，失败自动减半重试 */

  async setHash(mb){
    mb = Math.max(1, Math.min(2048, mb|0));
    var tries = [mb, Math.floor(mb/2), Math.floor(mb/4), 16, 1];
    for(var i=0;i<tries.length;i++){
      var v = tries[i];
      if(v < 1) continue;
      try{
        this.send('setoption name Hash value ' + v);
        await this.cmdWait('isready', 'readyok', 15000);
        this.hash = v;
        log('I','设置Hash', { mb:v });
        return v;
      }catch(e){
        log('W','设置Hash失败，减半重试', { mb:v, msg:e.message });
      }
    }
    this.hash = 16;
    return 16;
  },
  
  parseInfo(line){
    if(line.indexOf('info') !== 0) return null;
    var d = /\bdepth (\d+)/.exec(line);
    var n = /\bnodes (\d+)/.exec(line);
    var h = /\bhashfull (\d+)/.exec(line);
    var p = /\bnps (\d+)/.exec(line);
    var o = { depth: d ? parseInt(d[1],10) : this.info.depth,
              nodes: n ? parseInt(n[1],10) : this.info.nodes,
              hashfull: h ? parseInt(h[1],10) : this.info.hashfull,
              nps: p ? parseInt(p[1],10) : this.info.nps,
              score: this.info.score, mate:null, side:this.infoSide };
    var cp = /\bscore cp (-?\d+)/.exec(line);
    var mt = /\bscore mate (-?\d+)/.exec(line);
    if(cp) o.score = parseInt(cp[1],10);
    else if(mt){ o.mate = parseInt(mt[1],10); o.score = mt[1] > 0 ? 99999 : -99999; }
    if(/\blowerbound\b/.test(line) || /\bupperbound\b/.test(line)) o.score = this.info.score;
    this.info = o;
    return o;
  },

  boot(jsText, wasmBuffer, onProgress, opt){
    opt = opt || {};
    if(opt.poolSize == null && opt.threads && opt.threads !== 'skip'){
      opt.poolSize = this.poolSizeFor(opt.threads);
    }
    var self=this;
    /* 关键：进入新一次 boot 前，先彻底销毁上一个 Worker。
       否则旧 Worker 的 pthread 子线程还活着，共享内存被占，
       新 Worker 再申请线程就会失败 —— 表现为「高档位永远超时」。 */

    if(self.worker){
      try{ self.worker.terminate(); }catch(e){}
      self.worker = null;
    }
    self.probeCreated = 0; self.probeSummary = null; self.poolInfo = null;
    return new Promise(function(resolve, reject){
      var wurl = URL.createObjectURL(new Blob([ENGINE_WORKER_SRC], {type:'text/javascript'}));
      var w;
      try{ w = new Worker(wurl); }catch(e){ reject(new Error('Worker 创建失败: '+e.message)); return; }
      /* settled = Promise 已 resolve/reject；readyGot = 已收到 wasm ready。
         早期版本在收到 ready 时就把 settled 置 true，导致后面握手失败时
         fail() 直接 return —— Promise 永远不 settle，界面无限「正在加载引擎…」，
         且没有任何报错落地（Edge 上正是被这个坑死）。两者必须分开。 */

      var settled=false, readyGot=false;
      function fail(msg){
        if(settled) return;
        settled=true; clearTimeout(tmo);
        /* 必须销毁：pthread 子 Worker 若不终止会残留并占用共享内存，
           后续换线程数重试时可能因此拿不到新线程（僵尸线程）。 */

        try{ w.terminate(); }catch(e){}
        if(self.worker===w){ self.worker=null; }
        self.handshakeDone=false;
        reject(new Error(msg));
      }
      w.onmessage = function(ev){
        var m=ev.data;
        if(m.type==='line'){
          try{ if(self.parseInfo(m.line)) maybePaintScore(); }catch(e){}
          if(m.line.indexOf('bestmove')===0) self.searching=false;
          var ls=self.lines.slice();
          for(var i=0;i<ls.length;i++){ try{ ls[i](m.line); }catch(e){ log('E','引擎行回调异常',{msg:e.message}); } }
        } else if(m.type==='probe'){
          /* 子 Worker 探针：诊断「为什么开不到 N 线程」的关键数据 */

          try{
            var k = m.kind, d = m.data || {};
            if(k === 'worker-created'){
              self.probeCreated = (self.probeCreated||0) + 1;   
            }else if(k === 'worker-throw'){
              log('E','子Worker创建抛错', { url:d.url, err:d.err });
            }else if(k === 'worker-error'){
              log('E','子Worker运行出错', { url:d.url, err:d.err });
            }else if(k === 'uncaught'){
              log('E','Worker未捕获异常', { msg:d.msg });
            }else if(k === 'unhandled'){
              log('E','Worker未处理拒绝', { msg:d.msg });
            }else if(k === 'base'){
              self.probeBase = d.base;
              log('I','引擎资源基准路径', d);
            }else if(k === 'pool'){
              self.poolInfo = d;
              
              if(self.variant === 'mt') log('I','预建线程池', d);
            }else if(k === 'summary'){
              self.probeSummary = d;
              log('I','Worker探针汇总', { 已创建子Worker:d.created, urls:d.urls,
                                         错误:d.errs });
            }
          }catch(e){}
        } else if(m.type==='stderr'){
          log('W','引擎stderr',{ line:m.line });
        } else if(m.type==='error'){
          log('E','引擎启动失败', { error:m.error });
          try{
            try{ w.terminate(); }catch(e){}
            if(self.worker===w){ self.worker=null; }
            self.ready = null;
            self.handshakeDone = false;
            log('W','引擎已复位，下次搜索将重新启动', {});
          }catch(e){}
          fail(m.error||'引擎启动失败');
        } else if(m.type==='ready'){
          if(readyGot) return;
          readyGot=true;                    /* 只防止重复处理，不代表成功 */

          self.worker=w;
          (async function(){
            var step='初始化';
            try{
              step='uci 握手';
              await self.cmdWait('uci','uciok',20000);
              log('I','握手通过 · uci', { variant:self.variant });

              step='设置 MultiPV';
              self.send('setoption name MultiPV value 1');

              /* 单次尝试：线程数由 opt.threads 指定（或自动）。
                 失败即整体失败 —— 因为 setoption Threads=N 一旦触发子 Worker 创建失败，
                 该 Worker 内部状态已损坏，在同一个 Worker 上改小线程数也救不回来。
                 重试必须由外层用【全新 Worker】来做（见 _bootMT）。 */

              self.threads = (self.variant === 'mt')
                ? ((opt.threads === 'skip' || opt.threads == null) ? self.pickThreads() : (opt.threads|0))
                : 1;
              if(self.variant === 'mt'){
                if(opt.threads === 'skip'){
                  self.threads = 1;
                  log('W','跳过 Threads 设置（以引擎默认线程数运行）', { variant:self.variant });
                }else{
                  step='设置 Threads=' + self.threads;
                  self.send('setoption name Threads value ' + self.threads);
                  /* 失败就是失败：实测失败时永远不返回，等 25 秒纯属浪费（v3 起 4 秒） */

                  await self.cmdWait('isready','readyok',4000);
                  log('I','握手通过 · Threads', { threads:self.threads });
                }
              }

              /* Hash 下限：多线程下至少用「线程数 × 32MB」，避免抢表。
                 难度档位给的 Hash 若更大则沿用档位值。 */

              var hMin = (self.variant === 'mt') ? self.suggestedHash() : 16;
              step='设置 Hash=' + Math.max(hMin, self.currentHash()) + 'MB';
              await self.setHash(Math.max(hMin, self.currentHash()));
              log('I','握手通过 · Hash', { hash:self.hash });

              settled=true; clearTimeout(tmo);
              self.handshakeDone=true;
              self.rememberThreads(self.threads);
              log('I','引擎就绪', { variant:self.variant, threads:self.threads, hash:self.hash,
                                   source:self.sourceLabel, fromCache:self.fromCache });
              try{ UI.refreshVer(); }catch(e){}
              resolve();
            }catch(e){
              log('E','握手失败', { 卡在:step, variant:self.variant, threads:self.threads,
                                   已创建子Worker:self.probeCreated||0,
                                   探针:self.probeSummary||null, msg:e.message });
              fail('UCI握手失败（卡在「'+step+'」）：' + e.message);
            }
          })();
        }
      };
      w.onerror = function(ev){ log('E','Worker异常',{message:ev.message}); fail('Worker 异常: '+ev.message); };
      var tmo = setTimeout(function(){ fail('引擎启动超时（60秒）'); }, 60000);
      
      try{
        var copy = wasmBuffer.slice(0);
        w.postMessage({ type:'boot', jsText:jsText, wasm:copy, baseUrl:opt.baseUrl||'', poolSize:opt.poolSize||0 }, [copy]);
      }catch(e){
        w.postMessage({ type:'boot', jsText:jsText, wasm:wasmBuffer.slice(0), baseUrl:opt.baseUrl||'', poolSize:opt.poolSize||0 });
      }
    });
  },

  /* 多线程启动：逐级降低线程数，每级都用【全新 Worker】。
     序列例如 8核 → 4 → 2 → 1 → skip（完全不设 Threads）。
     实测 setoption Threads=N 失败后该 Worker 即损坏，必须重建；
     最后一步「不设 Threads」让引擎保持默认线程数，兼容性最好。 */

  async _bootMT(jsText, wasm, prog, baseUrl){
    if(!baseUrl) baseUrl = this.engineBaseUrl();     /* 兜底，避免任何调用点漏传 */

    var wantT = this.pickThreads();
    /* v3.4 起不再逐档探测：实测「用满核心数」在两台设备（4核8线程 PC /
       真8核手机）上都是 nps 最高档，直接用核心数即可。
       预建池已按「核心数×2+2」预留，正常一次成功。
       仍保留降档兜底：万一该档起不来（极端内核 / 内存不足），
       依次退到 核心数一半 → 2 → 1 → skip（完全不设 Threads）。 */

    var seq = [], cand = [wantT, Math.floor(wantT/2), 2, 1];
    for(var i=0;i<cand.length;i++){ var t=cand[i]; if(t>=1 && seq.indexOf(t)<0) seq.push(t); }
    seq.push('skip');
    var lastErr = '';
    for(var k=0;k<seq.length && k<5;k++){
      var cur = seq[k];
      try{
        await this.boot(jsText, wasm, prog, { threads:cur, baseUrl:baseUrl||'',
                                              poolSize: this.poolSizeFor(cur) });
        if(cur !== wantT) log('W','多线程线程数已降级', { 期望:wantT, 实际:(cur==='skip'?1:cur) });
        return;
      }catch(e){
        lastErr = e.message;
        log('W','多线程启动失败，降低线程数重试', {
          尝试:(cur==='skip'?'不设Threads':cur), 下一个:(seq[k+1]==='skip'?'不设Threads':seq[k+1]),
          msg:e.message });
        this.worker = null; this.handshakeDone = false;
        prog('多线程启动失败，正在降低线程数重试…');
      }
    }
    throw new Error('多线程各档均失败（' + seq.join('/') + '）：' + lastErr);
  },

  /* 预建线程池大小。
     实测引擎每个搜索线程约对应 2 个 Worker（含辅助线程），
     故按「核心数 × 2 + 2」预留，保证用满核心数时全部走预建通道
     （预建通道已验证可用；动态新建的 Worker 在 Chromium 上会卡死）。
     上限 34，避免低端设备预建过多 Worker 导致启动缓慢或内存吃紧。 */

  poolSizeFor(threads){
    return Math.max(4, Math.min(34, this.cores() * 2 + 2));
  },

  /* 引擎文件所在目录的绝对 URL —— 供 pthread 子 Worker 加载 wasm/js 用。
     这是「能否开到 2 线程以上」的关键：子 Worker 是 blob: URL，
     若不显式给出基准路径，它会去 fetch blob:https://host/pikajieqi.wasm 而静默失败。 */

  engineBaseUrl(){
    try{
      var u = new URL(REL, location.href).href;
      if(u && u.charAt(u.length-1) !== '/') u += '/';
      return u;
    }catch(e){}
    try{
      var h = location.href;
      return h.substring(0, h.lastIndexOf('/')+1);
    }catch(e){ return ''; }
  },

  /* 网络下载 + 落盘 + 启动。启动失败且当前是多线程时，自动降级单线程重试一次。 */

  _degraded:false,
  async _loadFromNet(prog, t0){
    var self=this;
    var V = variantOf();
    self.variant = variantKey();

    prog('正在从 '+SOURCE_COUNT+' 个源并发下载引擎脚本（' + V.tag + '）…');
    var rJs = await raceFile(V.js.file, ENGINE_SOURCES, function(got,len,src){
      prog('下载引擎脚本 ' + Math.round(got/1024) + 'KB · ' + src.label);
    });
    var jsText = new TextDecoder('utf-8').decode(rJs.buf);
    if(jsText.indexOf('PikaJieQi')<0) throw new Error('引擎脚本内容异常（'+rJs.source.label+'）');
    var hJs = await sha256(rJs.buf);
    if(hJs && hJs !== V.js.sha){
      log('W','引擎脚本哈希不匹配', { got:hex8(hJs), source:rJs.source.label });
    }

    prog('正在从 '+SOURCE_COUNT+' 个源并发下载引擎核心（' + V.tag + '）…');
    var rW = await raceFile(V.wasm.file, ENGINE_SOURCES, function(got,len,src){
      prog('下载引擎核心 ' + Math.round(got/1024) + 'KB · ' + src.label);
    });
    var hW = await sha256(rW.buf);
    if(hW !== V.wasm.sha){
      throw new Error('引擎核心校验失败（'+hex8(hW)+'），已放弃该来源');
    }

    self.sourceLabel = rJs.source.label + ' / ' + rW.source.label;

    prog('校验通过，正在写入本地缓存…');
    try{
      await Cache.put(ck(V.js.file), rJs.buf);
      await Cache.put(ck(V.wasm.file), rW.buf);
      log('I','引擎已缓存', { variant:self.variant, js:rJs.buf.byteLength,
                              wasm:rW.buf.byteLength, source:self.sourceLabel });
    }catch(e){ log('W','缓存写入失败',{msg:e.message}); }

    /* 再启动引擎。
       两级重试：① 真实同源 URL（子 Worker 兼容性最好）
                ② blob URL（兜底，某些环境无同源文件时可用）
       两者都失败且当前是多线程 → 自动降级单线程。 */

    prog('正在编译引擎…');
    try{
      var BU = self.engineBaseUrl();
      if(self.variant === 'mt') await self._bootMT(jsText, rW.buf, prog, BU);
      else await self.boot(jsText, rW.buf, prog, { baseUrl:BU });
    }catch(e){
      self.lastError = e.message;
      if(self.variant === 'mt' && !FORCE_ST && !self._degraded){
        self._degraded = true;
        log('W','多线程启动失败，自动降级单线程', { 原因:e.message });
        
        FORCE_ST = true;
        self.ready = null; self.worker = null; self.handshakeDone = false;
        self.variant = 'st'; self.threads = 1;
        prog('多线程启动失败，已自动改用单线程…');
        return await self._loadFromNet(prog, t0);
      }
      throw e;
    }
  },

  preload(onProgress){
    if(this.ready) return this.ready;
    var self=this;
    this.ready = (async function(){
      var t0=Date.now();
      function prog(t){ try{ onProgress && onProgress(t); }catch(e){} }

      var V = variantOf();
      self.variant = variantKey();
      self.hash = HASH_OF(G.level || 'normal');
      var firstVariant = self.variant;
      self.lastError = null;
      self.simdBlocked = false;

      /* 预检：不支持 SIMD 就不下载，直接告知换浏览器 */
      if(!simdSupported()){
        self.simdBlocked = true;
        self.lastError = '浏览器内核不支持 WebAssembly SIMD';
        log('E','SIMD 预检失败，已阻止下载', { kernel:kernelTag() });
        if(!_simdWarned){
          _simdWarned = true;
          infoBox('浏览器内核不支持 WebAssembly SIMD\n\n当前浏览器 ' + kernelTag() +
            ' 版本过旧，无法运行本游戏引擎。\n请升级到 Chrome / Edge 91+ 或 Firefox 89+ 后重试，或改用系统自带浏览器打开。');
        }
        throw new Error(self.lastError);
      }

      try{
        var cjs = await Cache.get(ck(V.js.file));
        var cwasm = await Cache.get(ck(V.wasm.file));
        if(cjs && cwasm && cjs.byteLength>1000 && cwasm.byteLength>100000){
          // 复制一份，避免后续操作影响缓存数据
          var h = await sha256(cwasm);
          if(h === V.wasm.sha){
            self.fromCache = true;
            self.sourceLabel = '本地缓存';
            prog('使用本地缓存（' + V.tag + '），校验通过…');
            var txt = new TextDecoder('utf-8').decode(cjs);
            try{
              /* 必须传 baseUrl：否则 locateFile 拿不到基准路径，
                 动态新建的 pthread 子 Worker 会去 fetch blob:https://host/xxx.wasm 而失败，
                 表现为「Threads>2 就卡死」。缓存分支此前漏传，正是用户遇到的情况。 */

              var CBU = self.engineBaseUrl();
              if(self.variant === 'mt') await self._bootMT(txt, cwasm.slice(0), prog, CBU);
              else await self.boot(txt, cwasm.slice(0), prog, { baseUrl:CBU });
              log('I','引擎来自缓存', { variant:self.variant, ms:Date.now()-t0 });
              return;
            }catch(e){
              self.lastError = e.message;
              log('E','缓存引擎启动失败', { variant:self.variant, msg:e.message });

              /* 环境类失败（内核不支持 SIMD 等）清了也是白清，反而丢掉好缓存；
                 只有疑似文件损坏才清，让下次重新下载。 */
              var envFail = /simd|s128|Invalid value type|CompileError|LinkError/i.test(e.message||'');
              if(!envFail){ try{ await Cache.clear(); }catch(_){} }
              else log('W','环境类失败，保留缓存', { msg:e.message });
              if(firstVariant === 'mt' && !FORCE_ST && !self._degraded){
                log('W','多线程启动失败，自动降级单线程', { 原因:e.message });
                self._degraded = true;
                /* 不写 localStorage：降级只对本次会话有效，
                   下次打开仍会重新检测并尝试多线程 */

                FORCE_ST = true;
                self.variant = 'st'; self.threads = 1;
                prog('多线程启动失败，已自动改用单线程…');
                return await self._loadFromNet(prog, t0);
              }
              self.ready = null;
              throw e;
            }
          }
          log('W','缓存校验失败，重新下载', { got:hex8(h) });
          await Cache.clear();
        }
      }catch(e){ log('W','缓存读取失败',{msg:e.message}); }

      /* 2) 走网络下载并启动（内部自带 多线程→单线程 降级） */

      await self._loadFromNet(prog, t0);
    })().catch(function(e){
      self.lastError = e.message;
      self.ready=null; self.worker=null;
      log('E','引擎加载失败', { msg:e.message });
      throw e;
    });
    return this.ready;
  },

  send(cmd){ if(!this.worker) throw new Error('引擎未就绪'); this.worker.postMessage({ type:'command', command:cmd }); },
  onLine(fn){ this.lines.push(fn); var self=this; return function(){ var i=self.lines.indexOf(fn); if(i>=0) self.lines.splice(i,1); }; },
  waitFor(pred, ms){
    var self=this;
    return new Promise(function(res){
      var timer=setTimeout(function(){ off(); res(null); }, ms||20000);
      var off=self.onLine(function(line){ if(pred(line)){ clearTimeout(timer); off(); res(line); } });
    });
  },
  cmdWait(cmd, expect, ms){
    var p=this.waitFor(function(l){ return l.indexOf(expect)===0; }, ms||15000);
    this.send(cmd);
    return p.then(function(l){ if(!l) throw new Error('等待 '+expect+' 超时'); return l; });
  },
  stop(){ this.token++; if(this.searching && this.worker){ try{ this.send('stop'); }catch(e){} } },
  search(fen, opt){
    var self=this;
    var run=function(){ return self.searchNow(fen, opt||{}); };
    var next=this.queue.then(run, run);
    this.queue=next.then(function(){}, function(){});
    return next;
  },
  async searchNow(fen, opt){
    await this.preload();
    var my=++this.token;
    if(this.searching){ await this.waitFor(function(l){ return l.indexOf('bestmove')===0; }, 5000); this.searching=false; }
    if(this.token!==my) return { best:null, ok:false, aborted:true };
    this.send('setoption name MultiPV value 1');
    this.send('position fen '+fen);
    var self=this, best=null;
    /* 评分是「本次搜索的走子方」视角。落子后 st.turn 会换边，
       若不在这里记下，显示时按新走子方换算就会把优劣说反。 */
    var sideFen = (fen||'').split(/\s+/)[1];
    this.infoSide = (sideFen === 'b') ? 'black' : 'red';
    this.searching=true;
    var p=this.waitFor(function(l){ return l.indexOf('bestmove')===0; }, (opt.movetime||0)+25000);
    this.send(opt.movetime ? ('go movetime '+Math.round(opt.movetime)) : ('go depth '+(opt.depth||1)));
    var line=await p;
    this.searching=false;
    var pm=null;
    if(line){ var parts=line.split(/\s+/); best=(parts[1]&&parts[1]!=='(none)')?parts[1]:null;
      /* 引擎 bestmove 行末的 ponder 是「它预测你会走的那步」，深搜免费附带，白拿不花钱 */
      pm=(parts[2]==='ponder'&&parts[3])?parts[3]:null; }
    var inf = this.info || {};
    return { best:best, ok:(this.token===my && !!best), aborted:(this.token!==my),
             score:(inf.score==null?null:inf.score), mate:(inf.mate==null?null:inf.mate), side:this.infoSide,
             ponder:pm };
  }
};

var _optLockAt = 0, _OPT_COOL = 400;
function optRow(items, cur, onPick){
  var box = el('div');
  var nodes = [];
  items.forEach(function(it){
    var o = el('div','opt'+(it.key===cur?' sel':''));
    if(it.icon) o.appendChild(el('span','ic',it.icon));
    var tx = el('span','t',it.label);
    o.appendChild(tx);
    if(it.desc) o.appendChild(el('span','d2',it.desc));
    o.onclick = function(){
      if(it.key === cur) return;
      var n = Date.now();
      if(n - _optLockAt < _OPT_COOL) return;
      _optLockAt = n;
      cur = it.key;
      nodes.forEach(function(x){ x.o.classList.remove('sel'); });
      o.classList.add('sel');
      Snd.tap();
      onPick(it.key);
    };
    nodes.push({o:o, it:it});
    box.appendChild(o);
  });
  return box;
}

/* ===== 全游戏唯一的返回键：浮层 #btnBackTop =====
   以前每个页面各自在顶栏里 new 一枚 ‹（netbar 的 .bk、topbar 的 .bk），
   加上主页的「← 返回游戏大厅」，全游戏有 3 枚返回键，样式与行为各写各的。
   现在只留 #dock 上这一枚：主页自己有大按钮（CSS 把浮层那枚藏掉），
   其余页面由各 render* 进来时调 setBack() 登记「点下去做什么」，按钮本身不重建、不消失。 */
var BACK = { fn:null, confirm:false, msg:'确定返回？' };
function setBack(fn, needConfirm, msg){
  BACK.fn = fn || null;
  BACK.confirm = !!needConfirm;
  BACK.msg = msg || '确定返回？';
}
function doBack(){
  if(!BACK.fn) return;
  Snd.tap();
  /* 只有对局页带确认（进度会丢），其余页面点一下直接回。 */
  if(BACK.confirm) confirmBox(BACK.msg, BACK.fn);
  else BACK.fn();
}

/* 三个设置页（人机 / 联机 / 联机测试）共用的顶栏，也是全站唯一的顶栏构造函数。
   注意：本文件里曾经有两份 netBar 定义（旧的那份参数少一个 opt），
   函数声明提升会让后一份覆盖前一份，改旧那份等于没改——已删除，现在只此一份。
   顶栏里【不放任何按钮】：左 38px 占位 + 居中标题 + 右 38px 占位，
   返回与设置都是 #dock 上的浮层按钮（#btnBackTop / #btnSet），全游戏各一枚，切页不消失。
   backFn 只是登记到浮层返回键上（不带确认，点了就直接回）。 */
function netBar(title, backFn, opt){
  opt = opt || {};
  setBack(backFn || renderHome, false);
  var bar = el('div','netbar');
  bar.appendChild(el('div','ph'));
  bar.appendChild(el('div','tt', title));
  bar.appendChild(el('div','ph'));
  app.appendChild(bar);
  return bar;
}

function pickEngineMove(state, color, best){
  var from=-1, to=-1;
  if(best){ from = Rules.uciToIdx(best.slice(0,2)); to = Rules.uciToIdx(best.slice(2,4)); }
  var legal = (from>=0) ? Rules.legalMoves(state, from) : [];
  if(from>=0 && to>=0 && legal.indexOf(to)>=0) return { from:from, to:to, fallback:false };
  var all = Rules.allLegal(state, color);
  if(!all.length) return null;
  var mv = all[randInt(all.length)];
  return { from:mv.from, to:mv.to, fallback:true };
}

function fmtScore(mine, mate){
  if(mate){
    /* 引擎给的 mate 单位是 ply（半回合，一方走一步算 1），且必为奇数：
       我杀时 mate=1/3/5 分别对应我还要走 1/2/3 步；被杀时 mate=-2/-4 对应对方还要走 1/2 步。
       所以显示成"还要走几步"要除以 2 再向上取整，才跟"三步杀"的说话习惯一致。
       mate 为 0 时上面的 if(mate) 就是假，压根进不到这儿，所以 steps 最小为 1，
       不会出现"0步"。下面那行 return 同理不可达：mate 存在时 score 必为 ±99999，
       mine 不可能为 0。留着只为万一引擎吐出异常组合时不至于崩。 */
    var steps = Math.ceil(Math.abs(mate) / 2);
    if(mine > 0) return { txt: '我绝杀 · ' + steps + '步', cls:'#4fd47a' };
    if(mine < 0) return { txt: '被绝杀 · ' + steps + '步', cls:'#e85444' };
    return { txt:'绝杀', cls:'#e85444' };
  }
  var a = Math.abs(mine|0);
  if(a <= 50) return { txt:'势均力敌', cls:'#e8c88a' };
  var win = mine > 0;
  var k = Math.min(1, a/1500);
  var cls = win ? ('hsl(142,62%,' + Math.round(40 + k*22) + '%)')
                : ('hsl(4,74%,'  + Math.round(44 + k*20) + '%)');
  if(a >= 2000) return { txt: win ? '我胜势' : 'AI胜势', cls:cls };
  var word = a >= 990 ? (win ? '我大优' : 'AI大优') : (win ? '我优势' : 'AI优势');
  return { txt: word + ' ' + a, cls:cls };
}

var CAP_PC_SIZE = 20;

/* 最近四步走子记录。
   纵线号：红方从自己的右手边往左数（一二…九），黑方同理从它自己的右手边数。
   本文件里 col 0 在数组左侧、红方在 row 0：红方自己的右手边就是 col 8，所以红纵线号 = 9-col；
   黑方在 row 9、它自己的右手边是 col 0，所以黑纵线号 = col+1。
   红汉字、黑阿拉伯是传统写法（炮二平五 / 炮2平5）。
   暗子按【走子当时】的走法记：暗着时走的是格位兵种（Rules.HOME），翻开后是什么不影响这一步的记法。 */
var MV_CN_NUM = ['一','二','三','四','五','六','七','八','九'];
var MV_AR_NUM = ['1','2','3','4','5','6','7','8','9'];

function mvFile(color, c){ return color==='red' ? (9-c) : (c+1); }
function mvNum(color, n){
  if(n<1) n=1; if(n>9) n=9;
  return color==='red' ? MV_CN_NUM[n-1] : MV_AR_NUM[n-1];
}

function moveToChinese(board, from, to, color){
  if(!board) return '';
  var r0=(from/9)|0, c0=from%9, r1=(to/9)|0, c1=to%9;
  var p = board[from];
  if(!p) return '';
  var role = p.faceDown ? Rules.HOME[from] : p.role;
  var cn = (Rules.ROLE_CN[role]||{})[color] || '?';
  /* 同名子挤在同一纵线时加「前/后」（红方越靠近对方越"前"，黑方反之）。
     三步兵那种 ≥3 枚的情况，从前往后数一/二/三… */
  var same = [];
  for(var i=0;i<90;i++){
    var q=board[i]; if(!q||q.color!==color) continue;
    if((i%9)!==c0) continue;
    var er = q.faceDown ? Rules.HOME[i] : q.role;
    if(er!==role) continue;
    same.push((i/9)|0);
  }
  var pre='';
  if(same.length>=2){
    same.sort(function(a,b){ return color==='red' ? b-a : a-b; });   /* 前 → 后 */
    var k = same.indexOf(r0); if(k<0) k=0;
    pre = (same.length===2) ? (k===0?'前':'后') : (MV_CN_NUM[k]||String(k+1));
  }
  var verb, tail;
  if(r1===r0){ verb='平'; tail=mvNum(color, mvFile(color,c1)); }
  else if(c1===c0){
    var adv0 = color==='red' ? (r1-r0) : (r0-r1);
    verb = adv0>0 ? '进' : '退';
    tail = mvNum(color, Math.abs(r1-r0));
  } else {
    var adv1 = color==='red' ? (r1-r0) : (r0-r1);
    verb = adv1>0 ? '进' : '退';
    tail = mvNum(color, mvFile(color,c1));
  }
  return pre + cn + mvNum(color, mvFile(color,c0)) + verb + tail;
}

/* board 必须传【走子之前】的棋盘快照——走完之后 from 那格已经空了，读不到兵种。 */
function pushMoveLog(board, from, to, color){
  if(!G.mvLog) G.mvLog=[];
  var txt = moveToChinese(board, from, to, color);
  if(!txt) return;
  G.mvLog.push({ color:color, txt:txt });
  try{ log('I','记谱', { color:color, txt:txt }); }catch(e){}
}

function updateMoves(){
  var box=document.getElementById('moves4'); if(!box) return;
  if(!G.mvLog) G.mvLog=[];
  /* 悔棋 / 新局都会让 G.history 变短，日志按它的长度截断即可，不用在每处重置点各写一遍。 */
  var hn = (G.history&&G.history.length) || 0;
  while(G.mvLog.length > hn) G.mvLog.pop();
  box.innerHTML='';
  var list = G.mvLog.slice(-4);          /* 只留最近四步 */
  /* 联机模式不走 doMove/applyAi，日志恒为空；此时整块收掉，别白占一行高度。 */
  box.style.display = list.length ? 'flex' : 'none';
  if(list.length===0) return;
  list.forEach(function(m){
    box.appendChild(el('span','mv ' + (m.color==='red'?'red':'blk'), m.txt));
  });
}

function updateCaps(){
  try{ updateScoreBar(); }catch(e){}
  try{ updateMoves(); }catch(e){}
  var box=document.getElementById('caps'); if(!box) return;
  box.innerHTML='';
  var view = G.viewState || G.state; if(!view) return;
  var up = G.flip ? 'red' : 'black';
  var order = [up, Rules.other(up)];
  order.forEach(function(col){
    var grp=el('div','grp');
    grp.appendChild(el('span','lb ' + (col==='red'?'red':'blk'), col==='red'?'红失':'黑失'));
    /* 顺序就是被吃的先后：captures 是 Rules.applyMove 里 push 进去的，原样遍历即可。 */
    var _all = view.captures||[], list=[];
    for(var _i=0;_i<_all.length;_i++){ if(_all[_i] && _all[_i].owner===col) list.push({ c:_all[_i], i:_i }); }
    if(list.length===0){ grp.appendChild(el('span','none','—')); }
    else list.forEach(function(it){
      var c = it.c;
      var cn = (c.role && Rules.ROLE_CN[c.role]) ? Rules.ROLE_CN[c.role][col] : null;
      var cv=document.createElement('canvas');
      cv.className='cpc';
      cv.title = (col==='red'?'红':'黑') + '方·' + (c.wasFaceDown?'暗着':'明着') + '被吃' + (cn?('·'+cn):'·身份未知');
      if(c.wasFaceDown && col===G.humanColor){
        cv.classList.add('unk');
        cv.title += (c.role ? '（点击修改）' : '（点击填写）');
        cv.addEventListener('click', function(ev){
          ev.stopPropagation();
          /* 3B：失子区也受改子键管辖，熄灭时点不动，提示先点亮。
             它是单击入口，不走棋盘那套连点计数，所以单独判一次。 */
          if(!EDIT_ARM){ log('T','失子区拦:改子未开'); toast('先点亮底栏「改子」才能修改'); return; }
          openCaptureEditor(it.i);
          Snd.tap();
        });
      }
      grp.appendChild(cv);
      /* 明着被吃 → 画一枚缩小版明子（米底＋兵种字＋红/黑描边）。
         暗着被吃 → 画缩小版暗子（灰底双环），但把中间的「?」换成真实兵种字；
         你自己那枚暗子被吃时 viewFor 返回 role:null，程序确实不知道那格藏的什么，仍是「?」。
         所以一眼分得清：灰底＝暗着被吃，米底＝明着被吃；左右顺序＝被吃先后。 */
      drawPieceIcon(cv, { color:col, role:(c.role||'soldier'), faceDown:!!c.wasFaceDown, _fcn:cn }, CAP_PC_SIZE);
    });
    box.appendChild(grp);
  });
}

/* 通用弹窗：btns = [{txt, pri, fn}]，按数组顺序从左到右排列。
   confirmBox / askBox / infoBox 都由此派生，避免三份几乎相同的建窗代码。 */

function modalBox(msg, btns){
  var mask=el('div','mask');
  var m=el('div','modal');
  m.appendChild(el('h3','',msg));
  var row=el('div','row');
  (btns||[]).forEach(function(b){
    var btn=el('button','btn'+(b.pri?' pri':''), b.txt);
    btn.onclick=function(){ mask.remove(); b.fn && b.fn(); };
    row.appendChild(btn);
  });
  m.appendChild(row); mask.appendChild(m);
  document.body.appendChild(mask);
  return mask;
}

/* 改子：仅人机模式，唯一通路是【DBLCLICK_MS 内连点同一格 EDIT_TAPS 下】。
   兵种按钮复用 Board.drawPiece 画到小 canvas 上，与棋盘上的棋子外观完全一致；
   红/黑互斥，当前所属方亮灯且不可点。将/帅不可改。
   弹窗只能点右上角 ✕ 关闭（点遮罩不关），改完不自动关，可连改多个。

   诊断打点：入口 / 每条 return / 弹窗入口都记一条 T 码，
   下次日志能一眼看出点击是「没进来」还是「进来后被哪条拦掉」。 */
function boardTapAt(px, py){
  if(!G.state) { log('T','btap 无棋局'); return; }
  var idx0 = Board.pick(px, py);
  log('T','btap入', { x:Math.round(px), y:Math.round(py), i:idx0, md:G.mode });
  /* 连点改子。放在 loading / turn / thinking 三项拦截【之前】——
     4A 要求「AI 思考中 / 非我方回合 / 加载中也能改」，那三项拦截会把这些情况全挡掉
     （实测 turn=black 时直接 toast「还没到你的回合」）。

     两下制：DBLCLICK_MS 是【一串连点的总窗口】，从第一下起算，不是每两下之间的间隔。
     两下制的误弹由 EDIT_ARM 这道总闸兜住——只有底栏「改子」键点亮时才计数；
     熄灭态下直接清零计数并放行，点多少下都只是普通点击。 */
  if(G.mode==='pve' && idx0>=0){
    if(!EDIT_ARM){
      /* 熄灭态：不进计数，且把上一串的残留清掉，避免「灭着点一下→点亮→再点一下」凑成两下 */
      if(Board.lastEditIdx!==-1 || Board.lastEditN!==0){
        Board.lastEditIdx = -1; Board.lastEditT = 0; Board.lastEditN = 0;
      }
    } else {
    var now0 = Date.now();
    /* 同一格且距【这一串的第一下】未超窗 → 累加次数；换格或超时 → 重新起算。 */
    if(idx0 === Board.lastEditIdx && now0 - Board.lastEditT < DBLCLICK_MS){
      Board.lastEditN++;
      if(Board.lastEditN >= EDIT_TAPS){
        /* gap 与 n 都必须先取再清零，否则 gap 恒等于 now0、n 恒等于 0 */
        var gap0 = now0 - Board.lastEditT, n0 = Board.lastEditN;
        Board.lastEditIdx = -1; Board.lastEditT = 0; Board.lastEditN = 0;
        log('T','btap连点弹窗', { i:idx0, uci:Rules.idxToUci(idx0), n:n0, gap:gap0 });
        openPieceEditor(idx0);
        return;
      }
      log('T','btap连点累计', { i:idx0, n:Board.lastEditN });
    } else {
      Board.lastEditIdx = idx0; Board.lastEditT = now0; Board.lastEditN = 1;
      log('T','btap记首点', { i:idx0 });
    }
    }
  }
  if(G.loading){ log('T','btap拦:loading'); toast('引擎加载中，请稍候'); return; }
  if(G.mode==='pvp' && G.phase!=='playing'){
    log('T','btap拦:pvp未开局');
    if(G.oppGone) toast('对手已离场');
    else if(!ON.on) toast('尚未进入房间');
    else toast('双方都点「准备」后才能开始');
    return;
  }
  if(isOver(G.state.over)){ log('T','btap拦:已结束'); return; }
  var myColor = G.mode==='pve' ? G.humanColor : G.netColor;
  if(G.state.turn !== myColor) { log('T','btap拦:非我方回合', { t:G.state.turn }); toast('还没到你的回合'); return; }
  if(G.thinking){ log('T','btap拦:AI思考中'); return; }
  var idx = idx0;
  if(idx<0){ log('T','btap拦:点在外'); return; }
  var p = G.state.board[idx];
  if(G.sel!==null && G.moves.indexOf(idx)>=0){
    var mf = G.sel;
    log('T','btap走子', { f:mf, t:idx });
    doMove(mf, idx);
    /* 走子成功即清零连点计数。
       不清零的话：「点 A 选中 → 点 B 走子」时 lastEditIdx 已被记成 B（计 1 下），
       接着再选中 B 这枚刚走过去的子，只需再两下就凑满三下、误弹改子窗。 */
    Board.lastEditIdx = -1; Board.lastEditT = 0; Board.lastEditN = 0;
    if(G.mode==='pvp') netSend({t:'move', from:mf, to:idx});
    return;
  }
  /* 改子判定已在函数开头完成（连点同一格），此处不再重复处理。 */
  if(p && p.color===myColor){
    if(G.sel === idx){ G.sel=null; G.moves=[]; Board.draw(); return; }
    G.sel = idx;
    G.moves = Rules.legalMoves(G.state, idx);
    log('D','选中棋子', { idx:idx, uci:Rules.idxToUci(idx), moves:G.moves.length });
    Snd.tap();
    Board.draw();
  } else {
    G.sel=null; G.moves=[]; Board.draw();
  }
}
function onBoardClick(ev){
  if(!Board.cv) return;
  /* 万一到落子这一步尺寸还是 0（容器没布局完、或重算一直没成功），
     先就地补一次，否则点哪都落不了子。 */
  if(!(Board.W>0 && Board.cell>0)){ try{ Board.resize(); Board.draw(); }catch(e){} }
  /* 触摸已自行判定并消费，忽略随后合成的 click，否则同一次点按会被处理两遍
     （走子后又把落点棋子选中） */
  if(Board.lastTap && Date.now() - Board.lastTap < 600) return;
  var rect = Board.cv.getBoundingClientRect();
  boardTapAt(ev.clientX - rect.left, ev.clientY - rect.top);
}
/* 触摸自判定：不再依赖浏览器合成 click。
   iOS 上合成 click 有约 300ms 延迟，且一旦 touchmove 被 preventDefault 就根本不合成
   （此前 SwipeGuard 全局拦截，手指横移 15px 即吞掉点击，表现为「点了不走子」）。
   这里按下→抬起位移不超过 TAP_SLOP 即判定为点击，并即时给出按下高亮。 */
var TAP_SLOP = 24;
/* 连点改子（原 1A 长按方案已废弃）。
   为什么弃用长按：真机实测长按会触发浏览器自带的长按菜单（选中/复制/搜索），
   与改子弹窗打架，用户无法完成改子；连点则完全不触发该菜单。
   三下制（EDIT_TAPS=3）：两下制时用户正常走子频繁被误判成改子而弹窗，
   同一格连点三下在真实走子流程里几乎凑不出来，误弹基本消失。

   500ms 是【一串连点的总窗口】——从第一下起算，两下必须都落在里面，
   不是「每两下之间」能各占 500ms（那样一串能拖到 1 秒，太松）。 */
var DBLCLICK_MS = 500;
var EDIT_TAPS   = 2;
/* 改子模式总闸。底栏「改子」键平时熄灭，点亮后连点才生效；
   熄灭态下棋盘上点多少次都不进连点计数、也不弹窗（失子区同理）。
   之所以要这道闸：连点判定放在 loading/turn/thinking 三项拦截之前（4A 要求
   AI 思考中也能改），少了它，等 AI 或随手点棋盘就容易误弹出改子窗。
   用模块级变量而非挂在 G 上：新局会重建 G，挂上去会被重置，
   而按钮本身不随新局重建，会出现「键亮着但闸已关」的不一致。 */
var EDIT_ARM = false;
/* 按钮同样补一层触摸自判定：浏览器在手指位移超过自身容差时就不合成 click
   （实测 dx≥22 即被吞），点按会整段丢失。这里在 touchend 后等一小会儿，
   若浏览器确实没派发 click，再主动补一次，绝不会重复触发。 */
(function bindTapFallback(){
  var pend=null;
  document.addEventListener('touchstart', function(e){
    if(!e.touches || e.touches.length!==1){ pend=null; return; }
    var t=e.target, el=null;
    while(t && t!==document){ if(t.tagName==='BUTTON'){ el=t; break; } t=t.parentNode; }
    pend = el ? { el:el, x:e.touches[0].clientX, y:e.touches[0].clientY } : null;
  }, {passive:true, capture:true});
  document.addEventListener('touchmove', function(e){
    if(!pend || !e.touches || !e.touches.length) return;
    var t=e.touches[0];
    if(Math.abs(t.clientX-pend.x) > TAP_SLOP || Math.abs(t.clientY-pend.y) > TAP_SLOP) pend=null;
  }, {passive:true, capture:true});
  document.addEventListener('touchend', function(){
    if(!pend) return;
    var el=pend.el, fired=false;
    pend=null;
    var once=function(){ fired=true; };
    el.addEventListener('click', once, {capture:true, once:true});
    setTimeout(function(){
      try{ el.removeEventListener('click', once, true); }catch(_){}
      if(!fired && document.contains(el)){ try{ el.click(); }catch(_){} }
    }, 320);
  }, {passive:true, capture:true});
})();
function bindBoardTap(cv){
  var sx=0, sy=0, down=false, moved=false;
  function at(e){
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    var r = cv.getBoundingClientRect();
    return [t.clientX - r.left, t.clientY - r.top];
  }
  /* 诊断打点（1A）：按下 / 抬起 / 抖动取消 各记一条 T 码。
     下次日志若只看见 down 没有 up，说明事件被浏览器手势（如 touch-action 引发的
     平移/缩放）吞掉了——这正是 Firefox 上「连点没反应」的怀疑方向。 */
  function onDown(e){
    if(e.touches && e.touches.length>1) { down=false; log('T','按下 多指，忽略'); return; }
    var p0 = at(e); sx=p0[0]; sy=p0[1]; down=true; moved=false;
    log('T','按下', { x:Math.round(sx), y:Math.round(sy) });
    var idx = Board.pick(p0[0], p0[1]);
    if(idx>=0 && idx!==Board.pressIdx){ Board.pressIdx=idx; Board.draw(); }
  }
  function onMove(e){
    if(!down) return;
    var p = at(e);
    if(Math.abs(p[0]-sx) > TAP_SLOP || Math.abs(p[1]-sy) > TAP_SLOP){
      if(!moved) log('T','抬起前位移超标', { dx:Math.round(p[0]-sx), dy:Math.round(p[1]-sy) });
      moved = true;
      if(Board.pressIdx>=0){ Board.pressIdx=-1; Board.draw(); }
    }
  }
  function onUp(e){
    if(!down){ log('T','抬起 但无按下'); return; }
    down=false;
    var wasMoved = moved;
    if(Board.pressIdx>=0){ Board.pressIdx=-1; Board.draw(); }
    var pf = at(e);
    if(wasMoved){ log('T','抬起 已判为滑动'); return; }
    if(Math.abs(pf[0]-sx) > TAP_SLOP || Math.abs(pf[1]-sy) > TAP_SLOP){ log('T','抬起 位移超标'); return; }
    log('T','抬起 判为点击', { x:Math.round(pf[0]), y:Math.round(pf[1]) });
    Board.lastTap = Date.now();
    boardTapAt(pf[0], pf[1]);
  }
  cv.addEventListener('touchstart', onDown, {passive:true});
  cv.addEventListener('touchmove', onMove, {passive:true});
  cv.addEventListener('touchend', onUp, {passive:true});
  cv.addEventListener('touchcancel', function(){ down=false; log('T','触摸被系统取消'); if(Board.pressIdx>=0){ Board.pressIdx=-1; Board.draw(); } }, {passive:true});
  if(window.PointerEvent){
    cv.addEventListener('pointerdown', function(e){ if(e.pointerType==='mouse'){ onDown(e); } }, {passive:true});
    cv.addEventListener('pointerup', function(e){ if(e.pointerType==='mouse'){ onUp(e); } }, {passive:true});
  }
}

/* ===== 改子：人机模式下连点棋子（或空格）两次弹出 ===== */
var EDIT_ROLES = ['chariot','horse','cannon','elephant','advisor','soldier'];
function drawPieceIcon(cv, p, size){
  var dpr = window.devicePixelRatio||1;
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr);
  cv.style.width=size+'px'; cv.style.height=size+'px';
  var cx=cv.getContext('2d');
  cx.setTransform(dpr,0,0,dpr,0,0);
  /* 直接复用棋盘棋子的绘制代码：只把坐标函数换成「永远居中」，不改动 Board 自身状态 */
  Board.drawPiece.call({ ctx:cx, cell:size, xy:function(){ return [size/2, size/2]; } }, 0, p);
}
function bindEditDrag(box, mask){
  var ox=0, oy=0, on=false, sx=0, sy=0, minX=0, maxX=0, minY=0, maxY=0;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function apply(){ box.style.transform = (ox||oy) ? ('translate('+ox+'px,'+oy+'px)') : ''; }
  function start(cx, cy){
    var r = box.getBoundingClientRect(), m = mask.getBoundingClientRect(), M = 18;
    var bx = r.left - ox, by = r.top - oy;              /* 未位移时的原位 */
    minX = (m.left + M) - bx;   maxX = (m.right  - M) - (bx + r.width);
    minY = (m.top  + M) - by;   maxY = (m.bottom - M) - (by + r.height);
    /* 弹窗比可视区还大时（极小屏）夹不住，干脆锁死为 0，免得算出一个反向区间 */
    if(minX > maxX){ minX = maxX = 0; }
    if(minY > maxY){ minY = maxY = 0; }
    sx = cx; sy = cy; on = true; box.classList.add('dragging');
  }
  function move(cx, cy){
    if(!on) return;
    ox = clamp(ox + (cx - sx), minX, maxX);
    oy = clamp(oy + (cy - sy), minY, maxY);
    /* 基准跟着「夹完的实际值」走：贴边后往回拖不会攒下隐形位移（否则表现为「卡住拖不动」） */
    sx = cx; sy = cy;
    apply();
  }
  function end(){ if(!on) return; on = false; box.classList.remove('dragging'); }
  function ok(t){ return !!t && !!t.closest && !t.closest('button'); }
  if(window.PointerEvent){
    box.addEventListener('pointerdown', function(e){
      if(!ok(e.target)) return;
      start(e.clientX, e.clientY);
      try{ box.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault();
    });
    box.addEventListener('pointermove', function(e){
      if(!on) return;
      move(e.clientX, e.clientY); e.preventDefault();
    });
    box.addEventListener('pointerup', end);
    box.addEventListener('pointercancel', end);
  } else {
    box.addEventListener('touchstart', function(e){
      if(!ok(e.target) || !e.touches.length) return;
      var t = e.touches[0]; start(t.clientX, t.clientY);
    }, { passive:true });
    box.addEventListener('touchmove', function(e){
      if(!on || !e.touches.length) return;
      var t = e.touches[0]; move(t.clientX, t.clientY); e.preventDefault();
    }, { passive:false });
    box.addEventListener('touchend', end);
    box.addEventListener('touchcancel', end);
    box.addEventListener('mousedown', function(e){
      if(!ok(e.target)) return;
      start(e.clientX, e.clientY); e.preventDefault();
    });
    window.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    window.addEventListener('mouseup', end);
  }
}

function findHiddenRoleIdx(color, role, excludeIdx){
  var b = G.state && G.state.board; if(!b) return -1;
  for(var i=0;i<b.length;i++){
    if(i===excludeIdx) continue;
    var q = b[i];
    if(q && q.faceDown && q.color===color && q.role===role) return i;
  }
  return -1;
}
/* 弹窗还开着时的刷新入口：applyEdit 改完（含守恒置换）要把它调一遍，
   「暗 N」才会跟着变。关闭时置空，避免对着已销毁的 DOM 调 sync。 */
var editSyncFn = null;
function openPieceEditor(idx, onClose){
  function fireClose(){ if(typeof onClose==='function'){ var f=onClose; onClose=null; f(); } }
  if(G.mode!=='pve' || !G.state){ log('T','弹窗拦:非人机或无棋局', { i:idx }); fireClose(); return; }
  var p = G.state.board[idx];
  if(p && p.role==='general'){ log('T','弹窗拦:将帅不可改', { i:idx }); toast('将（帅）不能修改'); fireClose(); return; }
  log('T','弹窗打开', { i:idx, uci:Rules.idxToUci(idx), c:p?p.color:'空' });
  var color = p ? p.color : G.humanColor;
  /* 明暗状态：跟着这枚子本来的 faceDown 走（3A：空格新增时 p 为 null，默认明子）。
     0.0.1 起「暗」按钮已删，isDark 在弹窗期间不再变化——暗子仍是暗子、明子仍是明子。 */
  var isDark = !!(p && p.faceDown);
  /* 0.0.1（1A）：兵种键的高亮态。
     baseRole = 这枚子【本来】的兵种，是"熄灭"要退回的落点：
       · 明子（含刚被机器翻开的）→ 它自己的 role，打开即自带高亮；
       · 暗子 / 空格 → null，打开时 6 个键全暗。
     selRole = 当前高亮哪个（null = 全暗、还没选）。初始 = baseRole。 */
  var baseRole = (p && !p.faceDown) ? p.role : null;
  var selRole  = baseRole;
  var old = document.querySelector('.editbox');
  if(old && old.parentNode) old.parentNode.remove();      /* 连开时先收掉上一个，避免遮罩叠加 */
  var host = document.getElementById('stage') || document.body;
  var mask = el('div','mask clear');   /* clear：背景不加暗，见 .mask.clear 注释 */
  var box = el('div','editbox');
  /* 右上角 ✕：弹窗【唯一】的关闭方式。
     为什么取消「点框外关闭」：日志实测 19 次弹窗打开、applyEdit 成功 0 次、无 JS 报错，
     弹窗存活最短仅 110ms——手指第二下落点正打在遮罩上，弹窗秒关，表现成「改不了」。
     现在点遮罩不反应，只有 ✕ 能关，弹窗想待多久待多久。 */
  var xbtn = el('button','edx','✕');
  xbtn.setAttribute('type','button');
  xbtn.setAttribute('aria-label','关闭');
  box.appendChild(xbtn);
  /* 归属色 + 明暗 + uci 写进标题（2A）：默认色取的是棋子真实颜色，代码本没错，
     用户看不到「我到底点中了谁」才是「点红子弹出黑方」的真正困惑来源。
     明暗会随「暗」开关变，所以标题存引用，交给 sync() 统一改写。 */
  var titleEl = el('div','tip','');
  box.appendChild(titleEl);
  var r1 = el('div','edrow'), btns=[];
  EDIT_ROLES.forEach(function(role){
    var btn = el('button','pbtn');
    var cv = document.createElement('canvas');
    btn.appendChild(cv);
btn.appendChild(el('span','pnum',''));
    btn.setAttribute('data-role', role);
    btns.push(btn); r1.appendChild(btn);
  });
  box.appendChild(r1);
  var r2 = el('div','swrow'), sw={};
  ['red','black'].forEach(function(c){
    var btn = el('button','swbtn');
    btn.appendChild(el('i','led'));
    btn.appendChild(el('span','', c==='red'?'红':'黑'));
    sw[c]=btn; r2.appendChild(btn);
  });
  /* 0.0.1：删掉「暗」按钮，第二行只留红 / 黑。
     明暗不再由一个开关表达，而是由【兵种键高亮不高亮】表达：
     · 这枚子是明子 → 打开时它本来的兵种就自带高亮（如机器翻出来是车，车就是亮的）；
     · 这枚子是暗子 → 打开时 6 个键全暗（谁也没选），点哪个哪个亮。
     这样一眼就能分清：有键亮着 = 这枚子是什么（或要改成什么），全暗 = 还是暗子。
     「暗」按钮原本还有个副作用——它是个写操作（点一下立刻把 isDark 置 true），
     在「点兵种只切高亮、✕ 才提交」的新交互下会和兵种键打架，所以一并清掉。 */
  box.appendChild(r2);
  var tipEl = el('div','tip','');
  box.appendChild(tipEl);
  mask.appendChild(box);
  host.appendChild(mask);
bindEditDrag(box, mask);
  /* 0.0.2（1A）：该兵种还剩几枚【没有公开身份】的（且不含本格自身）。
     poolRemain 的口径是「总数 − 已公开」，已公开含三类：盘上明子、明着被吃的、
     以及你在填暗子窗里告知过的暗子。暗着被吃且没告知的，身份从未公开，仍算在剩余里。
     本格若是暗子且正好是这个兵种，它自己就在这份剩余里，要减掉——
     这样显示的数字与守恒置换实际能换到的枚数一致（两者都指「别的」暗子）。 */
  function remainOf(rr){
    var n = Rules.poolRemain(G.state, color, rr);
    var cur0 = G.state && G.state.board[idx];
    if(cur0 && cur0.faceDown && cur0.color===color && cur0.role===rr) n -= 1;
    return n<0 ? 0 : n;
  }
  /* 三个开关 + 标题 + 底部提示的统一刷新点。凡是会改变外观的状态都走这里，
     避免「改了状态忘了重画」这类只改一半的 bug。 */
  function sync(){
    ['red','black'].forEach(function(k){
      var on = (k===color);
      sw[k].classList.toggle('on', on);   /* 灯亮 + 醒目边框 */
      sw[k].disabled = on;                /* 当前所属方不可再点，点另一方才切换 */
    });
    var cur0 = G.state && G.state.board[idx];
    var cnSel = selRole ? ((Rules.ROLE_CN[selRole]||{})[color] || selRole) : null;
    titleEl.textContent = (cur0?'修改此子 · ':'新增棋子 · ')
      + (color==='red' ? '红方' : '黑方') + (isDark ? '暗子' : '明子') + ' · ' + Rules.idxToUci(idx)
      + (cnSel ? ' · 选定：' + cnSel : (isDark ? ' · 未选定' : ''));
    /* 2A：兵种图标一律画成明子样式。棋盘上的暗子本来就是灰底「?」，
       弹窗里再全画「?」，选兵种时就完全看不出自己点的是车还是马了。
       明暗改由【高亮】表达：selRole 那枚加 .on（金底金边），其余保持暗底。 */
    btns.forEach(function(btn){
      var rr = btn.getAttribute('data-role');
      btn.classList.toggle('on', selRole === rr);
      /* 0.0.2（2A）：已无剩余的兵种置灰。当前高亮的那一枚不置灰——
         点它是「熄灭」回到原样，属于撤销而不是新增，必须留着能点。 */
      var rem0 = remainOf(rr);
      btn.classList.toggle('off', rem0 <= 0 && selRole !== rr);
      drawPieceIcon(btn.querySelector('canvas'), { color:color, role:rr, faceDown:false }, 38);
      var pn = btn.querySelector('.pnum');
      /* 0.0.2（1A）：「暗 N」改按【真实剩余未公开】显示，不再数「盘上还盖着几格」。
         为什么原口径是错的：程序开局 shuffle 一次发牌，每格藏什么当场定死；
         只要用过改子，盘上暗子的身份与"公开过什么"就必然分叉。实测：
           一匹马【暗着】被吃且未告知 + 另一格翻开成马
             旧口径（数暗格） = 0   ← 剩下 14 个暗子里一枚马都没有，于是显示 0
             poolRemain      = 1   ← 总数 2 只公开了 1 匹，被吃那匹身份没公开，还剩 1
         用户看到 0 却照样能点马、还能改出第三个车，根子就在这个口径。 */
      if(pn) pn.textContent = '暗' + rem0;
    });
    tipEl.textContent = isDark
      ? '暗子：6 个键全暗 = 还没定；点哪个哪个亮 = 定为它；再点一下熄灭。点 ✕ 才写入（按住空白处可拖开）'
      : '亮着的键 = 现在的兵种；点别的键改选，再点一下熄灭即撤回原样。点 ✕ 才写入（按住空白处可拖开）';
  }
  ['red','black'].forEach(function(c){
    sw[c].addEventListener('click', function(e){
      e.stopPropagation();
      if(c===color) return;
      color = c;      /* 4A：切阵营不动明暗——红方暗車点「黑」= 黑方暗車，实测照样能吃红子 */
      sync(); Snd.tap();
    });
  });
  /* 0.0.1（1A）：点兵种【只切高亮】，不落盘；真正写入等点 ✕。
     为什么必须改成这样：实测（真实发牌 + findHiddenRoleIdx）
       初始 5:暗兵 10:暗兵 40:暗车 → 点车 → 改回兵
       结果 5:暗车 10:明兵 40:暗兵   ← idx5 的暗兵被换成暗车、idx40 的暗车被换成暗兵
     守恒置换每生效一次就动一枚【别的】暗子，改错再改回会触发两次置换，
     身份在两个格子之间漂移——你是拿对面平台当权威的，那格真身是兵却被记成车。
     ✕ 时按最终高亮提交，全程最多 1 次置换（原样则 0 次），漂移没了。
     代价：点兵种后棋盘不会立刻变，要 ✕ 才看得到结果。 */
  btns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var rr = btn.getAttribute('data-role');
      /* 0.0.2（2A）：这个兵种已经没有剩余（身份全公开），还去改就会超数——
         守恒置换找不到暗子可换，会走兜底分支让该兵种 +1，场上就冒出第三个车。
         这里直接拦下并说明原因。当前高亮的那枚放行（点它=熄灭撤销）。 */
      if(remainOf(rr) <= 0 && selRole !== rr){
        var cnrr = ((Rules.ROLE_CN||{})[rr]||{})[color] || rr;
        toast(cnrr + '已全部公开，改不出来了');
        log('T','改子窗:拦·无剩余', { i:idx, role:rr });
        return;
      }
      /* 再点同一个 = 熄灭。熄灭回到【原样】：
         明子 → 回到它本来的兵种（取消马就恢复成车高亮，正是要的效果）；
         暗子 → 回到全暗（base 为 null）。 */
      selRole = (selRole === rr) ? baseRole : rr;
      log('T','改子窗:选兵种', { i:idx, role:selRole===null?null:selRole, 熄灭:selRole===null });
      sync(); Snd.tap();
    });
  });
  /* ✕ 是唯一关闭入口；遮罩不再响应点击（点空白/其他区域一律不关）。
     只删遮罩【自己】：mask 的父节点是 #stage（见上面 host 的取值），
     写 mask.parentNode.remove() 会把整个 #stage 连同棋盘、菜单一起删掉，表现为「点 ✕ 整个游戏没了」。
     实测对照（同环境 A/B，本地同源伺服 + 真引擎）：原文点 ✕ 后 #stage 消失、canvas 归 0、body 只剩 SCRIPT；
     改成 mask.remove() 后 #stage 与 canvas 均保留，改子结果照常生效。
     别照抄上面 old.parentNode.remove() 的句式——那里 old 是弹窗本体，父节点才是遮罩，比这里差一级。 */
  xbtn.addEventListener('click', function(e){
    e.stopPropagation();
    /* 0.0.1（1A）：✕ 才是真正的提交点，按最终高亮写一次。
       三种情况不写，避免制造无意义的 history 存档（悔棋会多悔一步）：
       · selRole 为 null —— 暗子且一个都没选，等于「不改」；
       · 空格且也没选 —— 同上；
       · 选出来的跟原来完全一致（含点错又熄灭、回到原样）—— 一处不动。
       最后这条尤其重要：applyEdit 会原样重写 board[idx] 这个对象，
       暗子会被顺手改写成 faceDown:false 变成明子（实测场景 D）。 */
    var cur1 = G.state && G.state.board[idx];
    var changed = (selRole !== null) && (
      !cur1 || cur1.role !== selRole || cur1.color !== color
    );
    if(changed){
      applyEdit(idx, color, selRole, isDark);
    }else{
      log('T','弹窗关闭:未改动', { i:idx, sel:selRole, role:cur1?cur1.role:null });
    }
editSyncFn = null;
    mask.remove();
    log('T','弹窗关闭:点X', { i:idx, uci:Rules.idxToUci(idx), 提交:changed });
    Snd.tap();
    fireClose();
  });
editSyncFn = sync;
  sync();
}
function openCaptureEditor(capIdx, onClose){
  /* 与 openPieceEditor 同款的一次性回调：包成「只触发一次」，
     且下面每个提前 return 都必须触发它，否则调用方在等回调、AI 就卡住不走下一步。 */
  function fireClose(){ if(typeof onClose==='function'){ var f=onClose; onClose=null; f(); } }
  if(G.mode!=='pve' || !G.state){ fireClose(); return; }
  var cp = G.state.captures[capIdx];
  if(!cp || !cp.wasFaceDown){
    log('T','填暗子窗拦:非暗着被吃', { i:capIdx }); fireClose(); return;
  }
  /* 首次打开时把本程序开局随机发的原始身份另存一份，
     熄灭（改错了）时靠它退回未告知状态，不会把用户填错的兵种留在记录里。 */
  if(cp.origRole===undefined) cp.origRole = cp.role;
  var color = cp.owner;
  log('T','填暗子窗打开', { i:capIdx, c:color, told:!!cp.told, role:cp.role });
  var old = document.querySelector('.editbox');
  if(old && old.parentNode) old.parentNode.remove();      /* 连开时先收掉上一个，避免遮罩叠加 */
  var host = document.getElementById('stage') || document.body;
  var mask = el('div','mask clear');   /* clear：背景不加暗，看得见棋盘 */
  var box = el('div','editbox');
  var xbtn = el('button','edx','✕');
  xbtn.setAttribute('type','button');
  xbtn.setAttribute('aria-label','关闭');
  box.appendChild(xbtn);
  var titleEl = el('div','tip','');
  box.appendChild(titleEl);
  var r1 = el('div','edrow'), btns=[];
  EDIT_ROLES.forEach(function(role){
    var btn = el('button','pbtn');
    var cv = document.createElement('canvas');
    btn.appendChild(cv);
    btn.appendChild(el('span','pnum',''));
    btn.setAttribute('data-role', role);
    btns.push(btn); r1.appendChild(btn);
  });
  box.appendChild(r1);
  var tipEl = el('div','tip','');
  box.appendChild(tipEl);
  mask.appendChild(box);
  host.appendChild(mask);
  bindEditDrag(box, mask);        /* 必须在入 DOM 之后再绑，getBoundingClientRect 才有值 */
  function sync(){
    var cur = G.state.captures[capIdx];
    var filled = !!(cur && cur.told);
    titleEl.textContent = '填写被吃的暗子 · ' + (color==='red' ? '红方' : '黑方')
      + ' · 第' + (capIdx+1) + '枚'
      + (filled ? ' · 已填：' + ((Rules.ROLE_CN[cur.role]||{})[color] || cur.role) : ' · 尚未填写');
    btns.forEach(function(btn){
      var rr = btn.getAttribute('data-role');
      var on = filled && cur.role===rr;
      btn.classList.toggle('on', on);          /* 高亮＝已选中；再点一下即熄灭 */
      drawPieceIcon(btn.querySelector('canvas'), { color:color, role:rr, faceDown:false }, 38);
      var pn = btn.querySelector('.pnum');
      if(pn) pn.textContent = '剩' + Rules.poolRemain(G.state, color, rr);
    });
    tipEl.textContent = filled
      ? '下方「剩N」＝该兵种还没露身份的枚数；再点同一个＝熄灭（退回「?」）；点 ✕ 保持现在的填写'
      : '点一个兵种＝告诉程序它是什么，下方「剩N」会减 1；不知道就点 ✕，保持「?」（按住空白处可拖开）';
  }
  btns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var rr = btn.getAttribute('data-role');
      var cur = G.state.captures[capIdx]; if(!cur) return;
      if(cur.told && cur.role===rr){
        /* 熄灭＝改错了：退回未告知，失子区画回「?」，
           且不再当作明子告诉 AI（poolField 只认 told 的，见那里）。 */
        cur.role = (cur.origRole!==undefined ? cur.origRole : rr);
        cur.told = false;
        log('T','填暗子:熄灭', { i:capIdx });
      }else{
        cur.role = rr; cur.told = true;
        log('T','填暗子:已填', { i:capIdx, role:rr });
      }
      /* viewFor 决定这枚显示真实字还是「?」，poolField 决定「告诉 AI」后暗子池少一枚，
         两者都要按新口径重算，所以 viewState 必须重建、失子区必须重画。 */
      G.viewState = Rules.viewFor(G.state, G.humanColor);
      updateCaps();
      sync(); Snd.tap();
    });
  });
  xbtn.addEventListener('click', function(e){
    e.stopPropagation();
    var cur = G.state.captures[capIdx];
    mask.remove();      /* 只删遮罩自己；写 parentNode.remove() 会把整个 #stage 删掉 */
    log('T','填暗子窗关闭:点X', { i:capIdx, told:cur?!!cur.told:null, role:cur?cur.role:null });
    Snd.tap();
    fireClose();
  });
  sync();
}
function applyEdit(idx, color, role, faceDown){
  var prev = G.state.board[idx];
  var oldRole = prev ? prev.role : null;
  var oldColor = prev ? prev.color : null;
  G.history.push(Rules.clone(G.state));                    /* 存档，改坏了可悔棋 */
  G.state.board[idx] = { color:color, role:role, faceDown:!!faceDown };
  var swapIdx = -1, note = '';
  if(!prev){
    note = '空格新增子，未做守恒';
  } else if(oldRole && oldRole !== role){
    if(oldColor && oldColor !== color){
      note = '改了归属色，未做守恒';
    } else {
      var cnNew = (Rules.ROLE_CN[role] && Rules.ROLE_CN[role][color]) || role;
      var cnOld = (Rules.ROLE_CN[oldRole] && Rules.ROLE_CN[oldRole][color]) || oldRole;
      swapIdx = findHiddenRoleIdx(color, role, idx);
      if(swapIdx >= 0){
        G.state.board[swapIdx] = { color:color, role:oldRole, faceDown:true };
        note = '已把暗子 ' + Rules.idxToUci(swapIdx) + ' 换成' + cnOld + '，' + cnNew + '数量不变';
      } else {
        note = '暗子中已无' + cnNew + '可换，' + cnNew + '数量已增加';
      }
    }
  }
  G.sel=null; G.moves=[];
  G.viewState = Rules.viewFor(G.state, G.humanColor);
  Board.draw(); updateStatus();
  log('I','改子', { uci:Rules.idxToUci(idx), color:color, role:role, faceDown:!!faceDown,
    oldRole:oldRole, swap: swapIdx>=0 ? (Rules.idxToUci(swapIdx)+'→'+oldRole) : null });
  /* 改完【不关窗】：用户要「改好 → 点 ✕ → 接着改别的子」。
     自动关窗会让人看不见结果，且下一个子的连点要重新起算。
     .mask 是铺满屏幕的 72% 黑遮罩，但已取消点框外关闭，弹窗会一直等你点 ✕。 */
  var cn = (Rules.ROLE_CN[role] && Rules.ROLE_CN[role][color]) || role;
  /* 0.0.1：applyEdit 现在只在点 ✕ 时被调用一次（唯一调用点见 openPieceEditor 的 xbtn），
     所以这句不再是「改完不关窗、还能接着改」的提示，改成「已写入」。
     editSyncFn 那行也用不上了（弹窗正要关），但保留无害：万一以后又从别处调它，
     「暗 N」仍会跟着置换刷新。 */
  toast('已写入 ' + (color === 'red' ? '红' : '黑') + (faceDown ? '暗' : '') + cn
    + (faceDown ? '，走一步后翻开' : '') + (note ? '；' + note : ''));
  if(editSyncFn) editSyncFn();
}
function doMove(from, to){
  var legal = Rules.legalMoves(G.state, from);
  if(legal.indexOf(to)<0){ log('W','非法走法被拒绝',{from:from,to:to}); toast('非法走法'); return; }
  G.history.push(Rules.clone(G.state));
  var _preBoard = G.history[G.history.length-1].board;   /* 走子前的快照，记谱要用 */
  pushMoveLog(_preBoard, from, to, G.state.turn);
  var res = Rules.applyMove(G.state, from, to);
  G.state = res.state;
  G.sel=null; G.moves=[];
  G.viewState = Rules.viewFor(G.state, G.humanColor);
  log('I','玩家走子', { uci:Rules.idxToUci(from)+Rules.idxToUci(to), from:from, to:to,
    revealed:res.evt.revealed, captured:res.evt.captured });
  feedbackMove(res.evt);
  Board.draw(); updateStatus();
  if(isGameOver()) return;
  if(G.mode==='pve'){
    if(G.askEdit && res.evt.revealed){
      setTimeout(function(){ openPieceEditor(to, function(){ setTimeout(aiTurn, 260); }); }, 300);
    } else setTimeout(aiTurn, 260);
  }
}

function isOver(o){
  return !!o && (o.result==='checkmate'||o.result==='stalemate'||o.result==='draw80'||o.result==='drawMax'||o.result==='resign');
}
function isGameOver(){
  var o=G.state.over; if(!o) return false;
  if(isOver(o)){
    log('I','对局结束', o);
    setTimeout(function(){ showResult(o); }, 200);
    return true;
  }
  return false;
}
function showResult(o){
  var txt = (o.result==='draw80') ? '和棋（连续80步无吃子）'
    : (o.result==='drawMax') ? '和棋（达到200回合上限）'
    : (o.winner==='red'?'红方胜':'黑方胜') + '（' + (o.result==='checkmate'?'将死':o.result==='stalemate'?'困毙':'认输') + '）';
  var mine = G.mode==='pve' ? G.humanColor : G.netColor;
  var note='';
  if(o.winner){ note = (o.winner===mine) ? ' 你赢了' : ' 你输了'; }
  if(!o.winner){ Snd.draw(); }
  else if(o.winner===mine){ Snd.win(); }
  else { Snd.lose(); }
  if(G.mode==='pvp'){
    infoBox(txt + note + '\n重新开始请退出房间再进');
    return;
  }
  confirmBox(txt + note, function(){
    G.state=Rules.newGame(); G.sel=null; G.moves=[]; G.ponder=null; G.history=[];
    G.viewState=Rules.viewFor(G.state,G.humanColor);
    Board.draw(); updateStatus();
    if(G.aiColor==='red') setTimeout(aiTurn,300);
  });
}

function doUndo(){
  if(G.mode!=='pve'||!G.state){ return; }
  var canUndo=false;
  for(var i=G.history.length-1;i>=0;i--){ if(G.history[i].turn===G.humanColor){ canUndo=true; break; } }
  if(!canUndo){ toast('没有可悔的棋'); return; }
  var aborted = !!G.thinking;
  if(aborted){ G.gen++; ENGINE.stop(); log('I','悔棋：中断AI思考', { gen:G.gen }); }
  // 回退到"轮到我走"的最近一个局面（撤销 AI 一步 + 自己一步）
  var target=null;
  while(G.history.length){
    var h=G.history.pop();
    if(h.turn===G.humanColor){ target=h; break; }
  }
  if(!target){ toast('没有可悔的棋'); return; }
  ENGINE.stop();
  G.thinking=false;
  G.state=target; G.sel=null; G.moves=[]; G.ponder=null;
  G.viewState=Rules.viewFor(G.state,G.humanColor);
  log('I','悔棋', { backToPly:G.state.ply, aborted:aborted });
  Snd.undo();
  Board.draw(); updateStatus(); toast(aborted?'已中断AI思考并悔棋':'已悔棋');
}

function doHint(){
  if(G.mode!=='pve') return;
  if(G.state.turn!==G.humanColor){ toast('等AI走完'); return; }
  G.thinking=true; updateStatus();
var myGen = G.gen;
  var fen = Rules.toFen(G.state, G.humanColor);
  /* 缺將的 FEN 会把 wasm 打死（memory access out of bounds），发之前先拦一道。 */
  if(!Rules.hasBothKings(G.state)){
    G.thinking=false;
    log('W','缺將，不发引擎', { fen:fen });
    toast('局面异常（缺將），无法给出建议'); updateStatus(); return;
  }
  ENGINE.search(fen, { movetime:1500 }).then(function(r){
    G.thinking=false;
    if(G.gen!==myGen){ updateStatus(); return; }
    if(r.best){
      var from=Rules.uciToIdx(r.best.slice(0,2)), to=Rules.uciToIdx(r.best.slice(2,4));
      if(from>=0&&to>=0){
        G.sel=from; G.moves=Rules.legalMoves(G.state,from);
        Board.draw();
        toast('建议：'+Rules.idxToUci(from)+'→'+Rules.idxToUci(to), 2500);
        log('I','AI提示', { best:r.best });
      }
    } else toast('引擎未给出建议');
    updateStatus();
  }).catch(function(e){ G.thinking=false; log('E','提示失败',{msg:e.message}); toast('提示失败'); updateStatus(); });
}

async function startPve(){
  clearApp();
  G.mode='pve';
  /* 新局必须先把上一局仍在跑的思考作废掉（含后台思考），否则它的结果回来时会整步落在
     新棋盘上，表现为「明明是我先走，AI 却先走了一步」。
     实测日志：100700 发起思考 → 102314 开新局 → 105704 旧结果落地成 AI 首着。
     做法与 doUndo 里「悔棋中断 AI」同一套：递增世代号 + 发 stop，结果回来判世代不符即丢弃。 */
  var _wasThinking = !!G.thinking;
  G.gen = (G.gen|0) + 1;
  try{ ENGINE.stop(); }catch(e){}
  G.thinking=false; G.lastPonder=null;
  if(_wasThinking) log('I','新局·作废旧思考', { gen:G.gen });
  G.humanColor = G.humanColor||'red';
  G.aiColor = Rules.other(G.humanColor);
  G.flip = (G.humanColor==='black');
  G.state = Rules.newGame();
  G.sel=null; G.moves=[]; G.thinking=false; G.ponder=null;
  G.history=[]; G.viewState=Rules.viewFor(G.state, G.humanColor);
  G.loading='准备中…';
  renderGame();
  Board.resize(); Board.draw();
  updateStatus();
  var t0 = Date.now();
  function loadMsg(txt){
    pveLoading(txt + ' · 已用时 ' + ((Date.now()-t0)/1000).toFixed(0) + ' 秒');
  }
  try{
    await ENGINE.preload(loadMsg);
    G.loading = null;
    log('I','开始人机对局', { level:G.level, human:G.humanColor, engineSource:ENGINE.sourceLabel, fromCache:ENGINE.fromCache });
    updateStatus();
    if(G.aiColor==='red') setTimeout(aiTurn, 350);
  }catch(e){
    G.loading = null;
    try{ updateScoreBar(); }catch(e2){}
    log('E','启动人机失败',{msg:e.message});
    if(ENGINE.simdBlocked) return;   /* 已弹过 SIMD 专属提示，不再套一层"加载失败" */
    /* 左「返回」右「重试」：askBox 的按钮顺序就是 [noTxt, yesTxt]，直接复用即可 */

    askBox('引擎加载失败：' + e.message + '\n已用时 ' + ((Date.now()-t0)/1000).toFixed(1) + ' 秒',
      '重试', function(){
        ENGINE.ready=null; ENGINE.worker=null; ENGINE.lastError=null; startPve();
      }, '返回', renderHome);
  }
}

async function aiTurn(){
  if(G.mode!=='pve'||!G.state) return;
  if(G.state.turn!==G.aiColor) return;
  if(isOver(G.state.over)) return;
  G.thinking=true; updateStatus();
  var myGen = G.gen;
  var lv = LEVELS[G.level];
  if(ENGINE.hashFor !== G.level){
    /* 取「难度档位」与「线程建议值」的较大者。
       多线程共享一张置换表，表太小会让线程互相抢表、深度反降；
       不能因为换难度就把已按线程数调大的 Hash 又调小。 */

    await ENGINE.setHash(Math.max(HASH_OF(G.level), ENGINE.suggestedHash()));
    ENGINE.hashFor = G.level;
    if(G.gen!==myGen){ log('I','AI思考作废·setHash后', { gen:G.gen, myGen:myGen }); G.thinking=false; updateStatus(); return; }
  }
  var fen = Rules.toFen(G.state, G.aiColor);
  log('I','AI思考', { fen:fen, level:G.level, opt: (lv.depth?('depth '+lv.depth):('movetime '+lv.movetime)) });
  if(!Rules.hasBothKings(G.state)){
    log('W','缺將，跳过引擎搜索', { fen:fen });
    var mv0 = pickEngineMove(G.state, G.aiColor, null);
    G.thinking=false;
    if(mv0) applyAi(mv0.from, mv0.to, true); else updateStatus();
    return;
  }

  var usedPonder=false, oldP=null, pr=null;
  if(G.ponder){
    oldP=G.ponder; G.ponder=null;
    if(oldP.fen === fen){ usedPonder=true; log('I','后台思考命中', { fen:fen }); }
    else log('I','后台思考未命中，停止', { ponderFen:oldP.fen, nowFen:fen });
    oldP.stop=true; ENGINE.stop();
    /* 关键：必须等旧搜索真正退出再发新搜索。
       mt 下若不等，新搜索会排在旧搜索后面排队，实测未命中卡 45 秒 */
    try{ pr = await oldP.promise; }catch(e){ pr=null; }
    if(G.gen!==myGen){ log('I','AI思考作废·等旧后台后', { gen:G.gen, myGen:myGen }); G.thinking=false; updateStatus(); return; }
  }

  var r;
  try{
    if(usedPonder) r = pr;
    else r = await ENGINE.search(fen, lv.depth?{depth:lv.depth}:{movetime:lv.movetime});
  }catch(e){ log('E','AI搜索异常',{msg:e.message}); r=null; }

  if(usedPonder && r && r.aborted){
    log('I','后台思考命中·aborted系主动停止，结果有效', { best:r.best });
    r.aborted = false;
  }
  if(G.gen!==myGen){
    log('I','AI思考作废·结果丢弃', { gen:G.gen, myGen:myGen, aborted:!!(r&&r.aborted) });
    G.thinking=false; updateStatus(); return;
  }
  if(r && r.aborted){
    log('W','AI搜索被中断，重搜一次', { gen:G.gen, myGen:myGen });
    try{
      r = await ENGINE.search(fen, lv.depth?{depth:lv.depth}:{movetime:lv.movetime});
    }catch(e){ log('E','AI重搜异常', { msg:e.message }); r=null; }
    if(G.gen!==myGen){
      log('I','AI思考作废·重搜后', { gen:G.gen, myGen:myGen });
      G.thinking=false; updateStatus(); return;
    }
  }
  G.thinking=false;
  /* 解析 + 非法兜底走公共函数（与机器人两条链路同一套逻辑） */

  var mv = pickEngineMove(G.state, G.aiColor, r && r.best);
  if(!mv){ updateStatus(); return; }
  if(!r || !r.best) log('W','引擎无结果，使用兜底走法', { mv:mv });
  else if(mv.fallback) log('W','引擎走法非法，兜底', { best:r.best });
  G.lastPonder = (r && r.ponder) || null;
  applyAi(mv.from, mv.to, mv.fallback);
}

function applyAi(from, to, fallback){
  G.history.push(Rules.clone(G.state));
  var _preBoard = G.history[G.history.length-1].board;   /* 走子前的快照，记谱要用 */
  pushMoveLog(_preBoard, from, to, G.state.turn);
  var res=Rules.applyMove(G.state, from, to);
  G.state=res.state;
  G.viewState=Rules.viewFor(G.state,G.humanColor);
  log('I','AI走子', { uci:Rules.idxToUci(from)+Rules.idxToUci(to), revealed:res.evt.revealed,
    captured:res.evt.captured, fallback:fallback });
  feedbackMove(res.evt);
  Board.draw(); updateStatus();
  if(isGameOver()) return;
  
  /* 注意：G.state.over 恒为对象（{result:null,winner:null}），直接取反永远是 false，
     后台思考会永远启动不了 —— 必须用 isOver() 判断 */
  function goPonder(){
    if(LEVELS[G.level].ponder && !isOver(G.state.over)) startPonder();
  }
  var _steps = [];
  if(G.askEdit && res.evt.revealed){
    _steps.push(function(next){ setTimeout(function(){ openPieceEditor(to, next); }, 300); });
  }
  var _cap = res.evt.captured;
  if(G.askEdit && _cap && _cap.owner===G.humanColor && _cap.wasFaceDown){
    var _ci = G.state.captures.length - 1;   /* applyMove 刚 push 进去的那条就是它 */
    _steps.push(function(next){ setTimeout(function(){ openCaptureEditor(_ci, next); }, 300); });
  }
  if(_steps.length){ runEditSteps(_steps, goPonder); return; }
  goPonder();
}

function runEditSteps(steps, done){
  var i = 0;
  (function next(){
    if(i >= steps.length){ if(typeof done==='function') done(); return; }
    var s = steps[i++];
    s(next);
  })();
}

/* 后台思考：把你思考的时间白送给 AI。
   预测着法直接用引擎上次 bestmove 免费附带的 ponder 字段，省掉原来那次 400ms 浅搜。
   单线程 wasm 在 Worker 内同步搜索、中途 stop 无效（实测 6 秒发 stop、78 秒才回），
   所以单核切成 3 秒一段的循环：每段结束都是检查点，你走子后最多等 3 秒就能接管；
   深度封顶 38 层（256MB 实测 30 秒到 38 层）。
   多线程 stop 实测 1ms 生效，可直接 go depth 40。 */
async function startPonder(){
  try{
    var myGen = G.gen;
    /* 预测着法优先用引擎上次 bestmove 免费附带的 ponder（省一次 400ms 浅搜）；
       但它可能缺失（PV 太短）或在我方规则下不合法，这两种情况都退回浅搜，保证后台思考必定启动 */
    var pm = G.lastPonder;
    /* 缺將时后台思考也别启动：它发的 FEN 同样会把 wasm 打死，且崩在后台更难发现。 */
    if(!Rules.hasBothKings(G.state)){ log('W','缺將，后台思考不启动', {}); return; }
    var f = pm?Rules.uciToIdx(pm.slice(0,2)):-1, t = pm?Rules.uciToIdx(pm.slice(2,4)):-1;
    if(!pm || f<0 || t<0 || Rules.legalMoves(G.state,f).indexOf(t)<0){
      var pr = await ENGINE.search(Rules.toFen(G.state, G.humanColor), { movetime:400 });
      if(G.gen!==myGen){ log('I','后台思考作废·浅搜后', { gen:G.gen, myGen:myGen }); return; }
      pm = pr && pr.best;
      f = pm?Rules.uciToIdx(pm.slice(0,2)):-1; t = pm?Rules.uciToIdx(pm.slice(2,4)):-1;
    }
    if(!pm || f<0 || t<0 || Rules.legalMoves(G.state,f).indexOf(t)<0) return;
    var fenP = Rules.toFen(Rules.applyMove(G.state,f,t).state, G.aiColor);
    log('I','启动后台思考', { predict:pm, fen:fenP });
    var h = { fen:fenP, stop:false };
    G.ponder = h;
    h.promise = ponderSeg(fenP, h);
  }catch(e){ log('W','后台思考启动失败',{msg:e.message}); }
}
/* 单核分片后台思考：每段 3 秒，段间检查「你已走子」或「够深了」 */
async function ponderSeg(fenP, h){
  var r=null;
  for(var k=0;k<12;k++){
    r = await ENGINE.search(fenP, { movetime:3000 });
    if(!G.ponder || G.ponder!==h || h.stop) break;
    if((ENGINE.info.depth||0) >= 38) break;
  }
  return r;
}

window.UI = UI;
/* 调试出口：诊断日志可直接读它，真机排查时也能在控制台看内部状态 */
window.__JQ = { G:G, ENGINE:ENGINE, Rules:Rules, Board:Board, LEVELS:LEVELS, ST:ST, Snd:Snd,
  doMove:doMove, doUndo:doUndo, doHint:doHint, aiTurn:aiTurn, renderPveSetup:renderPveSetup, showMenu:showMenu };
UI.init();
})();
