<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14100c">
<title>中国象棋 · 揭棋</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#14100c;color:#f2e8da;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;overscroll-behavior-x:contain;overscroll-behavior-y:contain;
  touch-action:pan-y;-webkit-text-size-adjust:100%;position:fixed;inset:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:pan-y;overscroll-behavior-x:contain}
button{font-family:inherit;font-size:15px;border:none;outline:none;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* ---------- 沉浸模式：隐藏顶栏底栏，棋盘撑满 ---------- */
#app.immersive .topbar{display:none}
#app.immersive .bottombar{display:none}
#app.immersive .status{padding:2px 10px;font-size:12px;min-height:20px}
#app.immersive .caps{display:none}
#app.immersive .boardwrap{padding:2px}

/* ---------- 悬浮球 ---------- */
#fs-dot{position:fixed;right:10px;width:52px;height:52px;border-radius:50%;
  border:1.5px solid rgba(232,176,114,.72);background:rgba(232,176,114,.55);color:#2b1a06;
  font-size:13px;font-weight:800;letter-spacing:0;line-height:1.12;z-index:9900;
  display:none;flex-direction:column;align-items:center;justify-content:center;opacity:.88;
  transition:opacity .5s ease,transform .16s ease,background .2s;cursor:pointer;
  -webkit-tap-highlight-color:transparent;padding:0;touch-action:none;
  box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 2px rgba(255,255,255,.35)}
#fs-dot.show{display:flex}
#fs-dot span{display:block;line-height:1.12;white-space:nowrap}
#fs-dot.dim{opacity:.28}
#fs-dot.drag{transform:scale(1.08);opacity:1}
#fs-dot.exit{background:rgba(226,84,68,.72);border-color:rgba(255,168,155,.8);color:#fff}

/* ---------- 通用 ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;
  background:#1e1812;border-bottom:1px solid #3a2e22}
.topbar h1{font-size:16px;margin:0;font-weight:600;letter-spacing:1px}
.topbar .sp{flex:1}
.mid{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bottombar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:#1e1812;border-top:1px solid #3a2e22}
.btn{background:#3c2f22;color:#f2e8da;border:1px solid #55432f;border-radius:8px;padding:9px 12px;flex:1 1 auto;min-width:64px}
.btn:active{background:#55432f}
.btn.pri{background:#a8642a;border-color:#c8813c;color:#fff;font-weight:600}
.btn.pri:active{background:#c8813c}
.btn:disabled{opacity:.4}
.btn.sm{padding:7px 10px;font-size:13px}

/* ---------- 主页 ---------- */
.page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;min-height:0;overflow-y:auto}
.logo{font-size:30px;font-weight:700;letter-spacing:6px;color:#e8b872;margin-bottom:4px}
.sub{font-size:13px;color:#9c8a76;margin-bottom:22px;text-align:center;line-height:1.7}
.big{width:100%;max-width:280px;padding:20px;font-size:19px;font-weight:600;border-radius:14px;
  background:linear-gradient(160deg,#4a3722,#2e2318);border:1px solid #6b5233;color:#f5e3c8}
.big:active{background:#5c4529}
.big .d{display:block;font-size:12px;font-weight:400;color:#a8947a;margin-top:6px}

/* ---------- 设置 ---------- */
.card{width:100%;max-width:320px;background:#231b14;border:1px solid #3d3022;border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:14px;color:#e8b872;font-weight:600}
.opt{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;background:#2c2318;margin-bottom:6px;
  border:1px solid transparent}
.opt.sel{background:#4a3520;border-color:#a8642a}
.opt .t{font-size:14px}
.opt .d2{font-size:11px;color:#9c8a76;margin-left:auto}
.row{display:flex;gap:8px}
.row .btn{flex:1}

/* ---------- 棋盘 ---------- */
.boardwrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:6px;min-height:0}
canvas{display:block;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.5);touch-action:manipulation}
.status{flex:0 0 auto;text-align:center;padding:5px 10px;font-size:13px;color:#d9c4a3;background:#1a1410;min-height:26px}
.status b{color:#e8b872}
.caps{flex:0 0 auto;display:flex;gap:10px;padding:4px 10px;font-size:11px;color:#9c8a76;align-items:center;flex-wrap:wrap;background:#1a1410}
.caps .grp{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.pc{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  font-size:11px;border:1px solid #6b5233;background:#e8d5b0;color:#8b1a1a;line-height:1}
.pc.bk{color:#1a1a1a}
.pc.dk{background:#4a4038;color:#c9b8a0;border-color:#6a5c50}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{width:100%;max-width:320px;background:#231b14;border:1px solid #55432f;border-radius:14px;padding:18px}
.modal h3{margin:0 0 12px;font-size:16px;color:#e8b872}
.modal input{width:100%;padding:11px;font-size:16px;border-radius:8px;border:1px solid #55432f;background:#1a1410;color:#f2e8da;
  font-family:inherit;letter-spacing:2px;text-transform:uppercase;text-align:center}
.modal .row{margin-top:12px}
.msg{font-size:13px;color:#c9b8a0;line-height:1.6;margin:10px 0;min-height:20px;word-break:break-all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:14%;background:rgba(30,24,18,.96);border:1px solid #6b5233;
  padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;max-width:80%;text-align:center;white-space:pre-line;line-height:1.5}

/* ---------- 齿轮 ---------- */
.gear{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;width:34px;height:34px;
  border-radius:50%;background:#3c2f22;border:1px solid #55432f;color:#e8b872;font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0;z-index:30;flex:0 0 auto}
.gear:active{background:#55432f}
.topbar .gear{position:static;width:32px;height:32px;font-size:16px;margin-left:4px}

/* ---------- 设置抽屉 ---------- */
.dmask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.dmask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:86%;max-width:340px;background:#1e1812;
  border-left:1px solid #55432f;z-index:61;transform:translateX(100%);transition:transform .24s ease;
  display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:translateX(0)}
.dhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  border-bottom:1px solid #3a2e22}
.dhead h3{margin:0;font-size:16px;color:#e8b872;flex:1;font-weight:600}
.dbody{flex:1 1 auto;overflow-y:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.dgrp{margin-bottom:16px}
.dgrp h4{margin:0 0 8px;font-size:13px;color:#c9a870;font-weight:600;letter-spacing:1px}
.dit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#2c2318;margin-bottom:7px}
.dit .tt{flex:1;min-width:0}
.dit .tt b{display:block;font-size:14px;font-weight:600;color:#f2e8da}
.dit .tt span{display:block;font-size:11px;color:#9c8a76;margin-top:2px;line-height:1.45}
.sw{flex:0 0 46px;width:46px;height:26px;border-radius:13px;background:#4a3c2c;position:relative;
  transition:background .2s;border:1px solid #5d4a35}
.sw.on{background:#a8642a;border-color:#c8813c}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#e8d5b0;transition:transform .2s}
.sw.on::after{transform:translateX(20px)}
.sw.dis{opacity:.35}
.drng{flex:0 0 120px;display:flex;align-items:center;gap:8px}
.drng input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:#55432f;outline:none}
.drng input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
  background:#c8813c;cursor:pointer}
.drng input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#c8813c;border:none;cursor:pointer}
.drng i{flex:0 0 40px;font-style:normal;font-size:12px;color:#c9a870;text-align:right}
.dact{width:100%;text-align:left;padding:11px 12px;border-radius:10px;background:#2c2318;
  border:1px solid #55432f;color:#f2e8da;font-size:14px;margin-bottom:7px}
.dact:active{background:#3d3022}
.dact small{display:block;color:#9c8a76;font-size:11px;margin-top:3px;line-height:1.45}
.dfoot{flex:0 0 auto;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #3a2e22}
.dfoot .btn{font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* =========================================================================
   中国象棋 · 揭棋  —— 单文件版
   引擎：PikaJieQi (Pikafish jieqi_old 分支 WASM, GPL-3.0-or-later)
   ========================================================================= */

/* ---------------------------- 日志系统 ---------------------------- */
var LOG = [];
var LOGMAX = 4000;
function nowStr(){ var d=new Date(); function p(n){return n<10?'0'+n:''+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0'); }
function log(level, msg, data){
  try{
    var e = { t: nowStr(), lv: level, m: msg };
    if(data !== undefined){ try{ e.d = (typeof data === 'string') ? data : JSON.parse(JSON.stringify(data)); }catch(_){ e.d = String(data); } }
    LOG.push(e);
    if(LOG.length > LOGMAX) LOG.shift();
    var txt = '['+e.t+']['+level+'] '+msg + (e.d!==undefined?(' :: '+(typeof e.d==='string'?e.d:JSON.stringify(e.d))):'');
    if(level==='E') console.error(txt); else if(level==='W') console.warn(txt); else console.log(txt);
  }catch(_){}
}
function logEnv(){
  log('I','环境信息', { ua:navigator.userAgent, screen:screen.width+'x'+screen.height,
    dpr:window.devicePixelRatio||1, vp:innerWidth+'x'+innerHeight, lang:navigator.language,
    app:APP_VERSION, protocol:location.protocol, href:location.href.slice(0,120) });
}
window.addEventListener('error', function(ev){ log('E','未捕获错误', { msg:ev.message, src:ev.filename, line:ev.lineno, col:ev.colno, stack: ev.error && ev.error.stack }); });
window.addEventListener('unhandledrejection', function(ev){ log('E','未处理Promise拒绝', { reason: String(ev.reason), stack: ev.reason && ev.reason.stack }); });

/* ---------------------------- 音效（Web Audio 实时合成，无音频文件） ---------------------------- */
var Snd = {
  ctx:null, master:null, noiseBuf:null,
  unlock: function(){
    try{
      if(!this.ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = (ST.volume/100) * 0.9;
        this.master.connect(this.ctx.destination);
      }
      if(this.ctx.state === 'suspended') this.ctx.resume();
    }catch(e){ log('W','音频初始化失败',{msg:e.message}); }
  },
  setVolume: function(){ try{ if(this.master) this.master.gain.value = (ST.volume/100)*0.9; }catch(e){} },
  tone: function(o){
    if(!ST.sound || !this.ctx) return;
    try{
      var t0 = this.ctx.currentTime + (o.delay||0);
      var osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f, t0);
      if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2), t0+o.dur);
      var peak = (o.gain==null ? 0.25 : o.gain);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0+Math.min(0.02, o.dur*0.25));
      g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
      var node = osc;
      if(o.lp){ var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; node.connect(f); node=f; }
      node.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0+o.dur+0.05);
    }catch(e){}
  },
  noise: function(o){
    if(!ST.sound || !this.ctx) return;
    try{
      var t0 = this.ctx.currentTime + (o.delay||0);
      var len = Math.max(1, Math.floor(this.ctx.sampleRate * o.dur));
      if(!this.noiseBuf || this.noiseBuf.length < len){
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        var dd = this.noiseBuf.getChannelData(0);
        for(var i=0;i<len;i++) dd[i] = Math.random()*2-1;
      }
      var src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
      var f = this.ctx.createBiquadFilter(); f.type = o.hp ? 'highpass' : 'lowpass';
      f.frequency.value = o.freq || 1000;
      var g = this.ctx.createGain();
      g.gain.setValueAtTime(o.gain==null?0.3:o.gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t0); src.stop(t0+o.dur+0.02);
    }catch(e){}
  },
  /* --- 具体音效 --- */
  tap:    function(){ this.unlock(); this.tone({f:1180,f2:900,dur:0.05,type:'sine',gain:0.12}); },
  move:   function(){ this.unlock(); this.noise({dur:0.055,freq:1800,hp:true,gain:0.34}); this.tone({f:220,f2:110,dur:0.1,type:'sine',gain:0.30}); },
  reveal: function(){ this.unlock();
            this.noise({dur:0.07,freq:3000,hp:true,gain:0.20});
            this.tone({f:1046,dur:0.20,type:'triangle',gain:0.24});
            this.tone({f:1568,dur:0.26,type:'sine',gain:0.16,delay:0.05}); },
  capture:function(){ this.unlock();
            this.noise({dur:0.09,freq:900,gain:0.30});
            this.tone({f:180,f2:90,dur:0.16,type:'sawtooth',gain:0.20,lp:1200}); },
  check:  function(){ this.unlock();
            this.tone({f:880,dur:0.10,type:'square',gain:0.16});
            this.tone({f:1174,dur:0.14,type:'square',gain:0.14,delay:0.11}); },
  undo:   function(){ this.unlock(); this.tone({f:700,f2:380,dur:0.12,type:'triangle',gain:0.16}); },
  connect:function(){ this.unlock();
            this.tone({f:523,dur:0.10,type:'triangle',gain:0.20});
            this.tone({f:784,dur:0.14,type:'triangle',gain:0.20,delay:0.11}); },
  win:    function(){ this.unlock();
            [523,659,784,1046].forEach(function(f,i){ Snd.tone({f:f,dur:0.22,type:'triangle',gain:0.22,delay:i*0.13}); }); },
  lose:   function(){ this.unlock();
            this.tone({f:392,dur:0.26,type:'sawtooth',gain:0.18,lp:900});
            this.tone({f:294,dur:0.34,type:'sawtooth',gain:0.16,delay:0.20,lp:800}); },
  draw:   function(){ this.unlock(); this.tone({f:440,dur:0.20,type:'square',gain:0.14}); }
};

/* ---------------------------- 震动 ---------------------------- */
var Hap = {
  ok: (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function'),
  fire: function(pattern){
    if(!ST.vibrate || !this.ok) return;
    try{
      var k = 0.35 + 1.3*(ST.vibIntensity/100);
      navigator.vibrate(pattern.map(function(d){ return Math.max(8, Math.round(d*k)); }));
    }catch(e){}
  },
  tap:      function(){ this.fire([10]); },
  move:     function(){ this.fire([16]); },
  reveal:   function(){ this.fire([28]); },
  capture:  function(){ this.fire([40]); },
  check:    function(){ this.fire([30,40,30]); },
  undo:     function(){ this.fire([26]); },
  connect:  function(){ this.fire([30,40,30]); },
  win:      function(){ this.fire([70,60,70,60,150]); },
  lose:     function(){ this.fire([150,90,150]); }
};

/* ---------------------------- 设置（持久化） ---------------------------- */
var SETTINGS_DEFAULTS = { sound:true, volume:100, vibrate:true, vibIntensity:100, hapticsOnMove:true, fsDot:true };
var ST = {};
for(var _k in SETTINGS_DEFAULTS) ST[_k] = SETTINGS_DEFAULTS[_k];
var PREF_KEY = 'jieqi-prefs-v1';
function savePrefs(){
  try{
    var o={}; Object.keys(SETTINGS_DEFAULTS).forEach(function(k){ o[k]=ST[k]; });
    localStorage.setItem(PREF_KEY, JSON.stringify(o));
  }catch(e){}
}
function loadPrefs(){
  try{
    var s2 = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    Object.keys(SETTINGS_DEFAULTS).forEach(function(k){ if(s2[k] !== undefined) ST[k] = s2[k]; });
  }catch(e){}
}
function resetPrefs(){
  Object.keys(SETTINGS_DEFAULTS).forEach(function(k){ ST[k] = SETTINGS_DEFAULTS[k]; });
  savePrefs(); Snd.setVolume(); log('I','设置已恢复默认');
}
loadPrefs();

var LOG_MODE_KEY = 'jieqi-log-mode-v1';
function logModeGet(){
  try{ var v = localStorage.getItem(LOG_MODE_KEY); if(v==='brief'||v==='full') return v; }catch(e){}
  return 'brief';
}
function logModeSet(m){ try{ localStorage.setItem(LOG_MODE_KEY, m); }catch(e){} }
function logModeName(m){ return m==='brief' ? '极简' : '完整'; }

function envLines(){
  var L=[];
  L.push('版本: ' + APP_VERSION + '   引擎: ' + ENGINE_VERSION + '   导出: ' + nowStr());
  L.push('页面: ' + location.href.slice(0,160));
  L.push('协议: ' + location.protocol + '   在线: ' + navigator.onLine);
  L.push('UA: ' + navigator.userAgent);
  L.push('语言: ' + navigator.language + '   时区: ' + (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return '?'; } })());
  L.push('屏幕: ' + screen.width + 'x' + screen.height + '   DPR: ' + (window.devicePixelRatio||1) +
         '   视口: ' + innerWidth + 'x' + innerHeight + '   比例: ' + (innerHeight/innerWidth).toFixed(3));
  L.push('核心: ' + (navigator.hardwareConcurrency || '未知') + '   内存: ' + (navigator.deviceMemory || '未知') + 'GB');
  L.push('震动API: ' + (typeof navigator.vibrate === 'function' ? '支持' : '不支持（iPhone 无此接口）'));
  L.push('音频: ' + (Snd.ctx ? ('已初始化 ' + Snd.ctx.state) : '未初始化'));
  L.push('全屏: ' + (FS_LOG || '本次未触发') + '   沉浸中: ' + (fsIsImmersive() ? '是' : '否') + '   原生全屏: ' + (fsIsOn() ? '是' : '否'));
  L.push('返回锁: ' + (Guard.locked ? '已锁（对局中）' : '未锁'));
  L.push('引擎状态: ' + (ENGINE.worker ? '已就绪' : '未加载') + '   来源: ' + (ENGINE.sourceLabel||'-') +
         (ENGINE.fromCache ? '（本地缓存）' : '（网络下载）'));
  L.push('对局: 模式=' + (G.mode||'-') + ' 难度=' + (G.level||'-') + ' 房间=' + (G.room||'-') +
         ' 步数=' + (G.state ? G.state.ply : '-'));
  L.push('设置: ' + Object.keys(SETTINGS_DEFAULTS).map(function(k){ return k+'='+ST[k]; }).join('  '));
  return L;
}

/* 极简：环境 + 错误信息，最短 */
function logBrief(){
  var L = ['===== 中国象棋·揭棋 诊断日志（极简版） ====='];
  L = L.concat(envLines());
  L.push('');
  L.push('--- 错误 / 警告 ---');
  var bad = LOG.filter(function(e){ return e.lv==='E' || e.lv==='W'; });
  if(!bad.length) L.push('（无）');
  bad.forEach(function(e){
    L.push('[' + e.t + '][' + e.lv + '] ' + e.m + (e.d!==undefined ? (' :: ' + (typeof e.d==='string'?e.d:JSON.stringify(e.d))) : ''));
  });
  L.push('');
  L.push('--- 关键操作 ---');
  var act = LOG.filter(function(e){ return e.lv==='I'; });
  act.slice(-40).forEach(function(e){
    L.push('[' + e.t + '] ' + e.m + (e.d!==undefined ? (' :: ' + (typeof e.d==='string'?e.d:JSON.stringify(e.d))) : ''));
  });
  L.push('');
  L.push('（共 ' + LOG.length + ' 条记录，此处显示错误警告 ' + bad.length + ' 条 + 最近操作 ' + Math.min(40,act.length) + ' 条）');
  return L.join('\n');
}

/* 完整：全部条目 */
function logFull(){
  var L = ['===== 中国象棋·揭棋 诊断日志（完整版） ====='];
  L = L.concat(envLines());
  if(G.state){
    try{ L.push('当前FEN: ' + Rules.toFen(G.state, null)); }catch(e){ L.push('当前FEN: <生成失败>'); }
    try{
      var b='';
      for(var r=9;r>=0;r--){
        for(var c=0;c<9;c++){
          var pc=G.state.board[r*9+c];
          b += !pc ? '.' : (pc.faceDown ? (pc.color==='red'?'X':'x') : Rules.ROLE_CH[pc.role][0][pc.color==='red'?'toUpperCase':'toLowerCase']());
        }
        b += '\n';
      }
      L.push('棋盘:\n' + b);
    }catch(e){}
  }
  L.push('');
  L.push('--- 全部记录（' + LOG.length + ' 条）---');
  for(var i=0;i<LOG.length;i++){
    var e=LOG[i];
    L.push('[' + e.t + '][' + e.lv + '] ' + e.m + (e.d!==undefined ? ('\n      ' + (typeof e.d==='string'?e.d:JSON.stringify(e.d))) : ''));
  }
  return L.join('\n');
}
function logText(m){ return (m==='full') ? logFull() : logBrief(); }

/* 复制：优先 Clipboard API，回退 execCommand */
function copyText(text){
  return new Promise(function(resolve){
    var done = function(ok){ resolve(!!ok); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
    } else fallback();
    function fallback(){
      try{
        var ta=document.createElement('textarea');
        ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta); done(ok);
      }catch(e){ done(false); }
    }
  });
}

function fetchTimeout(url, ms){

function randInt(n){ if(window.crypto && crypto.getRandomValues){ var a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; } return Math.floor(Math.random()*n); }
function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=randInt(i+1); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }

/* =========================================================================
   揭棋规则内核
   棋盘 90 格，idx = r*9 + c，r=0 为红方底线，r=9 为黑方底线
   ========================================================================= */
var Rules = (function(){
  var ROLE_CH = { chariot:'R', advisor:'A', cannon:'C', soldier:'P', horse:'N', elephant:'B', general:'K' };
  var CH_ROLE = { R:'chariot', A:'advisor', C:'cannon', P:'soldier', N:'horse', B:'elephant', K:'general' };
  var POOL_ORDER = ['chariot','advisor','cannon','soldier','horse','elephant']; // R A C P N B
  var ROLE_CN = {
    chariot:{red:'車',black:'車'}, horse:{red:'馬',black:'馬'}, elephant:{red:'相',black:'象'},
    advisor:{red:'仕',black:'士'}, general:{red:'帥',black:'將'}, cannon:{red:'炮',black:'砲'}, soldier:{red:'兵',black:'卒'}
  };

  // 各格位的"初始棋种"——决定该位置暗子的走法
  var HOME = new Array(90).fill(null);
  (function(){
    var back = ['chariot','horse','elephant','advisor','general','advisor','elephant','horse','chariot'];
    for(var c=0;c<9;c++){ HOME[c] = back[c]; HOME[81+c] = back[c]; }
    HOME[2*9+1]='cannon'; HOME[2*9+7]='cannon';
    HOME[7*9+1]='cannon'; HOME[7*9+7]='cannon';
    [0,2,4,6,8].forEach(function(c){ HOME[3*9+c]='soldier'; HOME[6*9+c]='soldier'; });
  })();

  var RED_SLOTS  = [0,1,2,3,5,6,7,8, 19,25, 27,29,31,33,35];
  var BLACK_SLOTS= [81,82,83,84,86,87,88,89, 64,70, 54,56,58,60,62];
  var RED_START  = ['chariot','chariot','horse','horse','elephant','elephant','advisor','advisor','cannon','cannon','soldier','soldier','soldier','soldier','soldier'];
  var BLACK_START= RED_START.slice();

  function newGame(){
    var b = new Array(90).fill(null);
    var rs = shuffle(RED_START.slice()), bs = shuffle(BLACK_START.slice());
    for(var i=0;i<15;i++){
      b[RED_SLOTS[i]]   = { color:'red',   role: rs[i], faceDown:true };
      b[BLACK_SLOTS[i]] = { color:'black', role: bs[i], faceDown:true };
    }
    b[4]  = { color:'red',   role:'general', faceDown:false };
    b[85] = { color:'black', role:'general', faceDown:false };
    return { board:b, turn:'red', captures:[], noCap:0, ply:0, over:null, lastMove:null };
  }
  function clone(s){
    var b=new Array(90);
    for(var i=0;i<90;i++) b[i] = s.board[i] ? { color:s.board[i].color, role:s.board[i].role, faceDown:s.board[i].faceDown } : null;
    return { board:b, turn:s.turn, captures:s.captures.map(function(c){return {owner:c.owner,role:c.role,wasFaceDown:c.wasFaceDown};}),
             noCap:s.noCap, ply:s.ply, over:s.over, lastMove:s.lastMove };
  }
  function effRole(p, idx){ return p.faceDown ? HOME[idx] : p.role; }
  function inPalace(r,c,color){ if(c<3||c>5) return false; return color==='red' ? (r>=0&&r<=2) : (r>=7&&r<=9); }
  function other(c){ return c==='red' ? 'black' : 'red'; }

  function genRaw(s, from, out){
    var p = s.board[from]; if(!p) return out;
    var r0=(from/9)|0, c0=from%9;
    var role = effRole(p, from);
    var red = p.color==='red';
    var B = s.board;
    function push(r,c){
      if(r<0||r>9||c<0||c>8) return;
      var j=r*9+c, q=B[j];
      if(q && q.color===p.color) return;
      out.push(j);
    }
    function walk(dirs, cannon){
      for(var k=0;k<dirs.length;k++){
        var dr=dirs[k][0], dc=dirs[k][1];
        var r=r0+dr, c=c0+dc, screen=false;
        while(r>=0&&r<=9&&c>=0&&c<=8){
          var j=r*9+c, q=B[j];
          if(cannon){
            if(!screen){
              if(!q){ out.push(j); }
              else { screen=true; }
            } else {
              if(q){ if(q.color!==p.color) out.push(j); break; }
            }
          } else {
            if(!q){ out.push(j); }
            else { if(q.color!==p.color) out.push(j); break; }
          }
          r+=dr; c+=dc;
        }
      }
    }
    var D4=[[1,0],[-1,0],[0,1],[0,-1]];
    if(role==='chariot'){ walk(D4,false); }
    else if(role==='cannon'){ walk(D4,true); }
    else if(role==='general'){
      // 九宫内一格
      var cand=[[r0+1,c0],[r0-1,c0],[r0,c0+1],[r0,c0-1]];
      for(var i=0;i<cand.length;i++){
        var r=cand[i][0],c=cand[i][1];
        if(!inPalace(r,c,p.color)) continue;
        var j=r*9+c, q=B[j];
        if(q && q.color===p.color) continue;
        out.push(j);
      }
    }
    else if(role==='advisor'){
      var av=[[r0+1,c0+1],[r0+1,c0-1],[r0-1,c0+1],[r0-1,c0-1]];
      for(var i2=0;i2<av.length;i2++){
        var r2=av[i2][0], c2=av[i2][1];
        if(r2<0||r2>9||c2<0||c2>8) continue;
        if(p.faceDown && !inPalace(r2,c2,p.color)) continue; // 暗士限九宫
        var j2=r2*9+c2, q2=B[j2];
        if(q2 && q2.color===p.color) continue;
        out.push(j2);
      }
    }
    else if(role==='elephant'){
      var ev=[[r0+2,c0+2],[r0+2,c0-2],[r0-2,c0+2],[r0-2,c0-2]];
      for(var i3=0;i3<ev.length;i3++){
        var r3=ev[i3][0], c3=ev[i3][1];
        if(r3<0||r3>9||c3<0||c3>8) continue;
        if(B[((r0+r3)/2|0)*9 + ((c0+c3)/2|0)]) continue;      // 塞象眼
        if(p.faceDown && !(p.color==='red' ? r3<=4 : r3>=5)) continue; // 暗象不过河
        var j3=r3*9+c3, q3=B[j3];
        if(q3 && q3.color===p.color) continue;
        out.push(j3);
      }
    }
    else if(role==='horse'){
      var hv=[[r0+2,c0+1],[r0+2,c0-1],[r0-2,c0+1],[r0-2,c0-1],[r0+1,c0+2],[r0+1,c0-2],[r0-1,c0+2],[r0-1,c0-2]];
      for(var i4=0;i4<hv.length;i4++){
        var r4=hv[i4][0], c4=hv[i4][1];
        if(r4<0||r4>9||c4<0||c4>8) continue;
        var legR = (Math.abs(r4-r0)===2) ? r0 + (r4>r0?1:-1) : r0;
        var legC = (Math.abs(r4-r0)===2) ? c0 : c0 + (c4>c0?1:-1);
        if(B[legR*9+legC]) continue; // 蹩马腿
        var j4=r4*9+c4, q4=B[j4];
        if(q4 && q4.color===p.color) continue;
        out.push(j4);
      }
    }
    else if(role==='soldier'){
      var fwd = red ? r0+1 : r0-1;
      push(fwd, c0);
      var crossed = red ? (r0>=5) : (r0<=4);
      if(crossed){ push(r0, c0+1); push(r0, c0-1); }
    }
    return out;
  }

  function findGeneral(s, color){
    for(var i=0;i<90;i++){ var p=s.board[i]; if(p && p.color===color && p.role==='general') return i; }
    return -1;
  }
  function kingsFace(s){
    var kr=findGeneral(s,'red'), kb=findGeneral(s,'black');
    if(kr<0||kb<0) return false;
    var cr=kr%9, cb=kb%9;
    if(cr!==cb) return false;
    var r1=Math.min((kr/9|0),(kb/9|0))+1, r2=Math.max((kr/9|0),(kb/9|0));
    for(var r=r1;r<r2;r++){ if(s.board[r*9+cr]) return false; }
    return true;
  }
  function attacked(s, idx, byColor){
    var r=(idx/9)|0, c=idx%9, B=s.board;
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var k=0;k<4;k++){
      var dr=dirs[k][0], dc=dirs[k][1];
      var rr=r+dr, cc=c+dc, first=false, dist=1;
      while(rr>=0&&rr<=9&&cc>=0&&cc<=8){
        var j=rr*9+cc, q=B[j];
        if(q){
          if(!first){
            first=true;
            if(q.color===byColor){
              var er=effRole(q,j);
              if(er==='chariot') return true;
              if(er==='general' && dist===1) return true;
            }
          } else {
            if(q.color===byColor && effRole(q,j)==='cannon') return true;
            break;
          }
        }
        rr+=dr; cc+=dc; dist++;
      }
    }
    // 马
    var hv=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for(var i=0;i<8;i++){
      var mr=r+hv[i][0], mc=c+hv[i][1];
      if(mr<0||mr>9||mc<0||mc>8) continue;
      var mj=mr*9+mc, mq=B[mj];
      if(!mq||mq.color!==byColor||effRole(mq,mj)!=='horse') continue;
      var ddr=r-mr, ddc=c-mc;
      var legR = Math.abs(ddr)===2 ? mr + (ddr>0?1:-1) : mr;
      var legC = Math.abs(ddr)===2 ? mc : mc + (ddc>0?1:-1);
      if(!B[legR*9+legC]) return true;
    }
    // 兵/卒
    if(byColor==='red'){
      if(r-1>=0){ var j1=(r-1)*9+c, q1=B[j1]; if(q1&&q1.color==='red'&&effRole(q1,j1)==='soldier') return true; }
      if(r>=5){ for(var d=-1;d<=1;d+=2){ var cc2=c+d; if(cc2<0||cc2>8) continue; var j2=r*9+cc2,q2=B[j2];
        if(q2&&q2.color==='red'&&effRole(q2,j2)==='soldier') return true; } }
    } else {
      if(r+1<=9){ var j3=(r+1)*9+c, q3=B[j3]; if(q3&&q3.color==='black'&&effRole(q3,j3)==='soldier') return true; }
      if(r<=4){ for(var d2=-1;d2<=1;d2+=2){ var cc3=c+d2; if(cc3<0||cc3>8) continue; var j4=r*9+cc3,q4=B[j4];
        if(q4&&q4.color==='black'&&effRole(q4,j4)==='soldier') return true; } }
    }
    // 士
    var av=[[-1,-1],[-1,1],[1,-1],[1,1]];
    for(var a=0;a<4;a++){
      var ar=r+av[a][0], ac=c+av[a][1];
      if(ar<0||ar>9||ac<0||ac>8) continue;
      var aj=ar*9+ac, aq=B[aj];
      if(!aq||aq.color!==byColor||effRole(aq,aj)!=='advisor') continue;
      if(!aq.faceDown) return true;               // 明士可过河
      if(inPalace(r,c,aq.color)) return true;     // 暗士限九宫
    }
    // 象
    var ev=[[-2,-2],[-2,2],[2,-2],[2,2]];
    for(var b2=0;b2<4;b2++){
      var er2=r+ev[b2][0], ec=c+ev[b2][1];
      if(er2<0||er2>9||ec<0||ec>8) continue;
      var ej=er2*9+ec, eq=B[ej];
      if(!eq||eq.color!==byColor||effRole(eq,ej)!=='elephant') continue;
      if(B[(r+ev[b2][0]/2|0)*9 + (c+ev[b2][1]/2|0)]) continue;   // 塞象眼
      if(!eq.faceDown) return true;               // 明象可过河
      if(eq.color==='red' ? r<=4 : r>=5) return true;
    }
    return false;
  }
  function inCheck(s, color){ var g=findGeneral(s,color); if(g<0) return false; return attacked(s,g,other(color)); }

  function legalMoves(s, from){
    var raw=[]; genRaw(s,from,raw);
    var out=[], p=s.board[from]; if(!p) return out;
    for(var i=0;i<raw.length;i++){
      var to=raw[i];
      var t=clone(s);
      t.board[to]=t.board[from]; t.board[from]=null;
      if(t.board[to]) t.board[to].faceDown=false;
      if(kingsFace(t)) continue;
      if(inCheck(t,p.color)) continue;
      out.push(to);
    }
    return out;
  }
  function allLegal(s, color){
    var res=[];
    for(var i=0;i<90;i++){ var p=s.board[i]; if(p&&p.color===color){ var mv=legalMoves(s,i); for(var k=0;k<mv.length;k++) res.push({from:i,to:mv[k]}); } }
    return res;
  }

  /** 执行走法，返回新状态与事件。不校验合法性（调用方先校验） */
  function applyMove(s, from, to){
    var n = clone(s);
    var p = n.board[from], cap = n.board[to];
    var wasFaceDown = p.faceDown;
    n.board[to] = { color:p.color, role:p.role, faceDown:false };
    n.board[from] = null;
    var evt = { from:from, to:to, mover:p.color, revealed: wasFaceDown ? p.role : null, captured:null };
    if(cap){
      evt.captured = { owner:cap.color, role:cap.role, wasFaceDown:cap.faceDown };
      n.captures.push(evt.captured);
      n.noCap = 0;
    } else if(wasFaceDown){
      n.noCap = 0;                 // 翻子清空无吃子计数
    } else {
      n.noCap = s.noCap + 1;
    }
    n.turn = other(p.color);
    n.ply = s.ply + 1;
    n.lastMove = { from:from, to:to };
    // 终局判定
    var opp = n.turn;
    var moves = allLegal(n, opp);
    var chk = inCheck(n, opp);
    if(moves.length === 0){
      // 揭棋：全堵死按困毙判负
      n.over = { result: chk ? 'checkmate' : 'stalemate', winner: p.color };
    } else if(n.noCap >= 80){
      n.over = { result:'draw80', winner:null };
    } else if(n.ply >= 400){
      n.over = { result:'drawMax', winner:null };   // 最大 200 回合判和
    } else {
      n.over = { result: chk ? 'check' : null, winner:null };
    }
    return { state:n, evt:evt };
  }

  /* ---------- FEN (Pikafish jieqi 格式) ---------- */
  function pieceFenCh(p){
    if(p.faceDown) return p.color==='red' ? 'X' : 'x';
    var ch = ROLE_CH[p.role];
    return p.color==='red' ? ch : ch.toLowerCase();
  }
  function boardField(s){
    var rows=[];
    for(var r=9;r>=0;r--){
      var row='', empty=0;
      for(var c=0;c<9;c++){
        var p=s.board[r*9+c];
        if(!p){ empty++; continue; }
        if(empty){ row+=empty; empty=0; }
        row += pieceFenCh(p);
      }
      if(empty) row+=empty;
      rows.push(row);
    }
    return rows.join('/');
  }
  function poolField(s, viewer){
    var cnt = { red:{}, black:{} };
    for(var i=0;i<90;i++){
      var p=s.board[i];
      if(p && p.faceDown) cnt[p.color][p.role] = (cnt[p.color][p.role]||0)+1;
    }
    // viewer 自己被吃掉的暗子，viewer 不知道是啥 → 留在池里
    if(viewer){
      for(var k=0;k<s.captures.length;k++){
        var cp=s.captures[k];
        if(cp.owner===viewer && cp.wasFaceDown) cnt[viewer][cp.role]=(cnt[viewer][cp.role]||0)+1;
      }
    }
    var out='';
    ['red','black'].forEach(function(col){
      POOL_ORDER.forEach(function(role){
        var ch = ROLE_CH[role];
        out += (col==='red'?ch:ch.toLowerCase()) + (cnt[col][role]||0);
      });
    });
    return out;
  }
  function toFen(s, viewer){
    return [ boardField(s), s.turn==='red'?'w':'b', poolField(s, viewer), s.noCap, Math.floor(s.ply/2)+1 ].join(' ');
  }

  /* ---------- UCI 坐标 ---------- */
  function idxToUci(i){ return String.fromCharCode(97+(i%9)) + ((i/9)|0); }
  function uciToIdx(u){ return (parseInt(u.slice(1),10))*9 + (u.charCodeAt(0)-97); }

  /* ---------- 视图脱敏 ---------- */
  function viewFor(s, viewer){
    var b=new Array(90);
    for(var i=0;i<90;i++){
      var p=s.board[i];
      if(!p){ b[i]=null; continue; }
      if(p.faceDown){ b[i]={ color:p.color, role:null, faceDown:true }; }
      else b[i]={ color:p.color, role:p.role, faceDown:false };
    }
    var caps = s.captures.map(function(cp){
      // 己方暗子被吃 → 己方不知道
      if(cp.owner===viewer && cp.wasFaceDown) return { owner:cp.owner, role:null, wasFaceDown:true };
      return { owner:cp.owner, role:cp.role, wasFaceDown:cp.wasFaceDown };
    });
    return { board:b, turn:s.turn, captures:caps, noCap:s.noCap, ply:s.ply, over:s.over, lastMove:s.lastMove };
  }

  return { ROLE_CH:ROLE_CH, CH_ROLE:CH_ROLE, ROLE_CN:ROLE_CN, HOME:HOME,
    newGame:newGame, clone:clone, effRole:effRole, inPalace:inPalace, other:other,
    genRaw:genRaw, legalMoves:legalMoves, allLegal:allLegal, applyMove:applyMove,
    inCheck:inCheck, kingsFace:kingsFace, attacked:attacked, findGeneral:findGeneral,
    toFen:toFen, idxToUci:idxToUci, uciToIdx:uciToIdx, viewFor:viewFor };
})();

/* ---------------------------- 防左右滑返回 ---------------------------- */
var SwipeGuard = {
  startX:0, startY:0, active:false,
  init: function(){
    var self=this;
    // 全局 touchmove 拦截：横向位移 > 竖向位移 时吞掉手势
    window.addEventListener('touchmove', function(e){
      if(!self.active || !e.touches || e.touches.length!==1) return;
      var t=e.touches[0];
      var dx = t.clientX - self.startX, dy = t.clientY - self.startY;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12){
        if(e.cancelable) e.preventDefault();
      }
    }, {passive:false});
    window.addEventListener('touchstart', function(e){
      if(!e.touches || e.touches.length!==1) return;
      self.active=true;
      self.startX=e.touches[0].clientX; self.startY=e.touches[0].clientY;
    }, {passive:true});
    window.addEventListener('touchend', function(){ self.active=false; }, {passive:true});
    window.addEventListener('touchcancel', function(){ self.active=false; }, {passive:true});
    // 桌面端手势
    try{
      window.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
    }catch(e){}
    log('I','已启用防左右滑');
  }
};

/* ---------------------------- 返回键锁（仅对局页） ---------------------------- */
var Guard = {
  locked:false, pushed:false, depth:0,
  onPop: null, onKey: null,
  lock: function(){
    if(this.locked) return;
    this.locked = true;
    var self=this;
    if(!this.pushed){
      try{ history.pushState({jq:1}, '', location.href); this.pushed=true; this.depth=1; }
      catch(e){ log('W','压入历史失败',{msg:e.message}); }
    }
    if(!this.onPop) this.onPop = function(e){
      try{ history.pushState({jq:1}, '', location.href); Guard.depth++; }catch(err){}
      log('I','已拦截浏览器返回（对局中）');
      toast('对局进行中已锁定返回\n点左上角「退出」可返回上级', 2200);
    };
    if(!this.onKey) this.onKey = function(e){
      if(e.key === 'Backspace' || (e.key === 'ArrowLeft' && (e.altKey || e.metaKey))){
        var t = e.target, tag = t && t.tagName;
        if(tag === 'INPUT' || tag === 'TEXTAREA') return;
        e.preventDefault();
        toast('对局进行中已锁定返回\n点左上角「退出」可返回上级', 2200);
      }
    };
    window.addEventListener('popstate', this.onPop, false);
    window.addEventListener('keydown', this.onKey, true);
    log('I','返回已锁死（对局页）');
  },
  unlock: function(){
    if(!this.locked) return;
    this.locked = false;
    if(this.onPop) window.removeEventListener('popstate', this.onPop, false);
    if(this.onKey) window.removeEventListener('keydown', this.onKey, true);
    var d = this.depth;
    this.depth = 0; this.pushed = false;
    if(d === 1){
      setTimeout(function(){ try{ history.go(-1); }catch(e){} }, 80);
    }
    log('I','返回已解锁', { cleared:d });
  },
  // 静默解锁：不清垫层（页面内部跳转用）
  release: function(){
    if(!this.locked) return;
    this.locked = false;
    if(this.onPop) window.removeEventListener('popstate', this.onPop, false);
    if(this.onKey) window.removeEventListener('keydown', this.onKey, true);
    log('I','返回锁已释放（保留垫层）');
  }
};

var FS_BALL_KEY = 'jieqi-fsball-pos';
function fsBallClamp(){
  var d = document.getElementById('fs-dot'); if(!d) return;
  var w = d.offsetWidth || 52, h = d.offsetHeight || 52;
  var maxX = Math.max(1, innerWidth - w), maxY = Math.max(1, innerHeight - h);
  var x = Math.min(maxX, Math.max(0, parseFloat(d.style.left) || (maxX - 0)));
  var y = Math.min(maxY, Math.max(0, parseFloat(d.style.top)  || (maxY - 70)));
  d.style.left = x + 'px'; d.style.top = y + 'px';
}
function fsBallSave(){
  var d = document.getElementById('fs-dot'); if(!d || !d.style.left) return;
  var w = d.offsetWidth || 52, h = d.offsetHeight || 52;
  var maxX = Math.max(1, innerWidth - w), maxY = Math.max(1, innerHeight - h);
  var rx = (parseFloat(d.style.left)||0) / maxX, ry = (parseFloat(d.style.top)||0) / maxY;
  try{ localStorage.setItem(FS_BALL_KEY, JSON.stringify({x:rx, y:ry})); }catch(e){}
}
function fsBallLoad(){
  var d = document.getElementById('fs-dot'); if(!d) return;
  var w = d.offsetWidth || 52, h = d.offsetHeight || 52;
  var maxX = Math.max(1, innerWidth - w), maxY = Math.max(1, innerHeight - h);
  var p = null;
  try{ p = JSON.parse(localStorage.getItem(FS_BALL_KEY) || 'null'); }catch(e){}

    d.style.left = Math.round(p.x * maxX) + 'px';
    d.style.top  = Math.round(p.y * maxY) + 'px';
  } else {

    d.style.left = Math.round(maxX - 0) + 'px';

  }
}
function fsBallBind(){
  var d = document.getElementById('fs-dot'); if(!d) return;
  fsBallLoad(); fsBallClamp();
  var sx=0, sy=0, ox=0, oy=0, moved=false, timer=0;
  function down(e){
    var t = (e.touches && e.touches[0]) || e;
    sx = t.clientX; sy = t.clientY;
    ox = parseFloat(d.style.left)||0; oy = parseFloat(d.style.top)||0;
    moved = false;
    d.classList.add('drag'); d.classList.remove('dim');
    timer = setTimeout(function(){ if(!moved){ moved='long'; } }, 600);
    if(e.cancelable) e.preventDefault();
  }
  function move(e){
    var t = (e.touches && e.touches[0]) || e;
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(!moved && Math.abs(dx)+Math.abs(dy) > 6) moved = true;
    d.style.left = (ox + dx) + 'px';
    d.style.top  = (oy + dy) + 'px';
    if(e.cancelable) e.preventDefault();
  }
  function up(){
    clearTimeout(timer);
    d.classList.remove('drag');
    fsBallClamp(); fsBallSave(); fsBall();
    if(!moved){ fsBallTap(); }
    else if(moved === 'long'){ /* 长按：清位置回默认 */ try{ localStorage.removeItem(FS_BALL_KEY); }catch(e){} fsBallLoad(); fsBallClamp(); toast('悬浮球已复位'); }
  }
  d.addEventListener('touchstart', down, {passive:false});
  d.addEventListener('touchmove',  move, {passive:false});
  d.addEventListener('touchend',   up);
  d.addEventListener('touchcancel', up);
  d.addEventListener('mousedown',  down);
  window.addEventListener('mousemove', function(e){ if(d.classList.contains('drag')) move(e); });
  window.addEventListener('mouseup',  function(){ if(d.classList.contains('drag')) up(); });
}

function fsPaint(on){

function fsNativeTry(ok, bad){
  var el = document.documentElement;
  var list = [
    ['requestFullscreen', el.requestFullscreen],
    ['webkitRequestFullscreen', el.webkitRequestFullscreen],
    ['webkitRequestFullScreen', el.webkitRequestFullScreen],
    ['msRequestFullscreen', el.msRequestFullscreen],
    ['mozRequestFullScreen', el.mozRequestFullScreen]
  ];
  var i = 0;
  function next(){
    if(i >= list.length){ bad('内核不支持'); return; }
    var nm = list[i][0], fn = list[i][1];
    i++;
    if(typeof fn !== 'function'){ next(); return; }
    FS_TRY = nm;
    var q = null;
    try{ q = fn.call(el, { navigationUI: 'hide' }); }catch(e){ next(); return; }
    var check = function(){ if(fsIsOn()) ok(nm); else next(); };
    if(q && q.then) q.then(function(){ setTimeout(check, 60); }).catch(function(){ next(); });
    else setTimeout(check, 160);
  }
  next();
}
function fsFallback(reason, already){
  if(fsIsOn()){ fsSync(); return; }
  fsPaint(true);
  try{ window.scrollTo(0, 1); }catch(e){}
  try{ document.documentElement.scrollTop = 1; }catch(e){}
  if(already) return;
  log('I','真全屏不可用，已切换沉浸模式', { reason: reason||'未知' });
  toast('已隐藏顶栏底栏 · 棋盘撑满');
  var KEY = 'jieqi-fs-tip-shown';
  var shown = false;
  try{ shown = localStorage.getItem(KEY) === '1'; }catch(e){}
  if(!shown){
    setTimeout(function(){
      toast('想要无地址栏的真全屏：浏览器菜单 →「添加到主屏幕」，再从桌面图标打开', 3400);
      try{ localStorage.setItem(KEY, '1'); }catch(e){}
    }, 2300);
  }
}
function fsEnter(){
  Snd.tap(); Hap.tap();
  var already = fsIsImmersive();
  var handled = false;
  function ok(nm){
    if(handled) return; handled = true;
    FS_LOG = '原生全屏成功 · ' + nm;
    log('I','全屏', { result: FS_LOG });
    fsSync();
  }
  function bad(why){
    if(handled) return; handled = true;
    FS_LOG = '降级沉浸（' + why + '）';
    fsFallback(why, already);
  }
  try{ fsNativeTry(ok, bad); }catch(e){ bad('调用异常'); }
  setTimeout(function(){
    if(handled) return;
    if(fsIsOn()) ok(FS_TRY || 'requestFullscreen');
    else bad('无响应');
  }, 600);
}
function fsExit(){
  Snd.tap(); Hap.tap();
  try{
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  fsPaint(false);
}

}

async function sha256(buf){
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      var d = await crypto.subtle.digest('SHA-256', buf);
      var a = new Uint8Array(d), h='';
      for(var i=0;i<a.length;i++) h += ('0'+a[i].toString(16)).slice(-2);
      return h;
    }
  }catch(e){}

/* ---------------------------- 单文件赛马下载 ---------------------------- */
/** 流式下载单个文件，返回 ArrayBuffer；可被 AbortController 中断 */
async function fetchStream(url, ctl, onChunk){
  var opt = { cache:'no-store' };
  if(ctl) opt.signal = ctl.signal;
  var r = await fetch(url, opt);
  if(!r.ok) throw new Error('HTTP'+r.status);
  var len = parseInt(r.headers.get('content-length')||'0', 10);
  if(r.body && r.body.getReader){
    var rd = r.body.getReader(), parts=[], got=0;
    for(;;){
      var d = await rd.read();
      if(d.done) break;
      parts.push(d.value); got += d.value.length;
      if(onChunk) onChunk(got, len);
    }
    return await (new Blob(parts)).arrayBuffer();
  }
  var b = await r.arrayBuffer();
  if(onChunk) onChunk(b.byteLength, len || b.byteLength);
  return b;
}

/**
 * 赛马：所有源同时下载同一文件，谁先完整落地就用谁，其余立即中断。
 * 输家的下载结果一律丢弃、绝不写盘。
 */
function raceFile(file, sources, onProg){
  return new Promise(function(resolve, reject){
    var settled=false, ctls=[], failed=0, progState=[];
    sources.forEach(function(src, i){
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      ctls.push(ctl);
      progState[i] = { got:0, len:0 };
      (async function(){
        var buf;
        try{
          buf = await fetchStream(src.url + file, ctl, function(got, len){
            progState[i].got = got; progState[i].len = len;
          });
          if(!buf || buf.byteLength===0) throw new Error('空响应');
        }catch(e){
          failed++;
          if(!settled) log('D','下载源失败', { file:file, source:src.label, msg:String(e&&e.message||e).slice(0,70) });
          if(failed>=sources.length && !settled){
            settled=true;
            reject(new Error('全部 '+sources.length+' 个源均下载失败'));
          }
          return;
        }
        if(settled) return;              // 已有赢家 → 结果直接丢弃
        settled = true;
        // 立刻掐掉其余所有源
        for(var j=0;j<ctls.length;j++){ if(j!==i && ctls[j]){ try{ ctls[j].abort(); }catch(e){} } }
        log('I','赛马获胜', { file:file, source:src.label, bytes:buf.byteLength });
        resolve({ buf:buf, source:src });
      })();
    });
    // 进度汇报：取当前最快的那条
    if(onProg){
      var t = setInterval(function(){
        if(settled){ clearInterval(t); return; }
        var best=null, bi=-1;
        for(var k=0;k<progState.length;k++){
          var p=progState[k];
          if(p.got>0 && (!best || p.got>best.got)){ best=p; bi=k; }
        }
        if(best) onProg(best.got, best.len, sources[bi]);
      }, 200);
      setTimeout(function(){ clearInterval(t); }, 120000);
    }
  });
}

/* ---------------------------- Worker 源码（只负责编译 + UCI） ---------------------------- */
var ENGINE_WORKER_SRC = [
"var command=null;",
"function P(m){ self.postMessage(m); }",
"self.addEventListener('message', async function(ev){",
"  var m=ev.data;",
"  if(!m || m.type!=='boot') return;",
"  try{",
"    var burl=URL.createObjectURL(new Blob([m.jsText], {type:'text/javascript'}));",
"    try{ importScripts(burl); } finally { URL.revokeObjectURL(burl); }",
"    if(typeof self.PikaJieQi !== 'function') throw new Error('引擎工厂缺失');",
"    P({type:'prog', stage:'compile'});",
"    var mod = await self.PikaJieQi({",
"      wasmBinary: new Uint8Array(m.wasm),",
"      print: function(l){ P({type:'line', line:String(l)}); },",
"      printErr: function(l){ P({type:'stderr', line:String(l)}); }",
"    });",
"    var init = mod.cwrap('pikajieqi_initialize', null, []);",
"    command = mod.cwrap('pikajieqi_command', null, ['string']);",
"    init();",
"    P({type:'ready'});",
"  }catch(e){ P({type:'error', error:(e && e.message) ? e.message : String(e)}); }",
"});",
"self.addEventListener('message', function(ev){",
"  var m=ev.data;",
"  if(m && m.type==='command' && typeof m.command==='string'){",
"    if(!command){ P({type:'error', error:'引擎未就绪'}); return; }",
"    try{ command(m.command); }catch(e){ P({type:'error', error:String(e && e.message)}); }",
"  }",
"});"
].join('\n');

/* ---------------------------- 引擎客户端 ---------------------------- */
var ENGINE = {
  worker:null, ready:null, sourceLabel:'-', fromCache:false,
  searching:false, token:0, queue:Promise.resolve(), lines:[],

  /** 用 jsText + wasm 启动 worker 并完成 UCI 握手 */
  boot(jsText, wasmBuffer, onProgress){
    var self=this;
    return new Promise(function(resolve, reject){
      var wurl = URL.createObjectURL(new Blob([ENGINE_WORKER_SRC], {type:'text/javascript'}));
      var w;
      try{ w = new Worker(wurl); }catch(e){ reject(new Error('Worker 创建失败: '+e.message)); return; }
      var settled=false;
      function fail(msg){ if(settled) return; settled=true; clearTimeout(tmo);
        try{ w.terminate(); }catch(e){} if(self.worker===w) self.worker=null;
        reject(new Error(msg)); }
      w.onmessage = function(ev){
        var m=ev.data;
        if(m.type==='line'){
          if(m.line.indexOf('bestmove')===0) self.searching=false;
          var ls=self.lines.slice();
          for(var i=0;i<ls.length;i++){ try{ ls[i](m.line); }catch(e){ log('E','引擎行回调异常',{msg:e.message}); } }
        } else if(m.type==='stderr'){
          log('W','引擎stderr',{ line:m.line });
        } else if(m.type==='error'){
          log('E','引擎启动失败', { error:m.error });
          fail(m.error||'引擎启动失败');
        } else if(m.type==='ready'){
          if(settled) return;
          settled=true; clearTimeout(tmo);
          self.worker=w;
          (async function(){
            try{
              await self.cmdWait('uci','uciok',20000);
              self.send('setoption name Hash value 32');
              self.send('setoption name MultiPV value 1');
              await self.cmdWait('isready','readyok',20000);
              log('I','引擎就绪', { source:self.sourceLabel, fromCache:self.fromCache });
              resolve();
            }catch(e){ fail('UCI握手失败: '+e.message); }
          })();
        }
      };
      w.onerror = function(ev){ log('E','Worker异常',{message:ev.message}); fail('Worker 异常: '+ev.message); };
      var tmo = setTimeout(function(){ fail('引擎启动超时（60秒）'); }, 60000);
      // 传副本并 transfer：原始 buffer 保留给主线程做缓存写入
      try{
        var copy = wasmBuffer.slice(0);
        w.postMessage({ type:'boot', jsText:jsText, wasm:copy }, [copy]);
      }catch(e){
        w.postMessage({ type:'boot', jsText:jsText, wasm:wasmBuffer.slice(0) });
      }
    });
  },

  preload(onProgress){
    if(this.ready) return this.ready;
    var self=this;
    this.ready = (async function(){
      var t0=Date.now();
      function prog(t){ try{ onProgress && onProgress(t); }catch(e){} }

      /* 1) 先查本地缓存 */
      try{
        var cjs = await Cache.get('pikajieqi-st.js');
        var cwasm = await Cache.get('pikajieqi-st.wasm');
        if(cjs && cwasm && cjs.byteLength>1000 && cwasm.byteLength>100000){
          // 复制一份，避免后续操作影响缓存数据
          var h = await sha256(cwasm);
          if(h === ENGINE_FILES[1].sha){
            self.fromCache = true;
            self.sourceLabel = '本地缓存';
            prog('使用本地缓存，校验通过…');
            var txt = new TextDecoder('utf-8').decode(cjs);
            await self.boot(txt, cwasm.slice(0), prog);
            log('I','引擎来自缓存', { ms:Date.now()-t0 });
            return;
          }
          log('W','缓存校验失败，重新下载', { got:hex8(h) });
          await Cache.clear();
        }
      }catch(e){ log('W','缓存读取失败',{msg:e.message}); }

      /* 2) 两个文件各自赛马（可来自不同源） */
      prog('正在从 '+SOURCE_COUNT+' 个源并发下载引擎脚本…');
      var rJs = await raceFile('pikajieqi-st.js', ENGINE_SOURCES, function(got,len,src){
        prog('下载引擎脚本 ' + Math.round(got/1024) + 'KB · ' + src.label);
      });
      var jsText = new TextDecoder('utf-8').decode(rJs.buf);
      if(jsText.indexOf('PikaJieQi')<0) throw new Error('引擎脚本内容异常（'+rJs.source.label+'）');
      var hJs = await sha256(rJs.buf);
      if(hJs && hJs !== ENGINE_FILES[0].sha){
        log('W','引擎脚本哈希不匹配', { got:hex8(hJs), source:rJs.source.label });
      }

      prog('正在从 '+SOURCE_COUNT+' 个源并发下载引擎核心…');
      var rW = await raceFile('pikajieqi-st.wasm', ENGINE_SOURCES, function(got,len,src){
        prog('下载引擎核心 ' + Math.round(got/1024) + 'KB · ' + src.label);
      });
      var hW = await sha256(rW.buf);
      if(hW !== ENGINE_FILES[1].sha){
        throw new Error('引擎核心校验失败（'+hex8(hW)+' ≠ '+ENGINE_VERSION+'），已放弃该来源');
      }

      self.sourceLabel = rJs.source.label + ' / ' + rW.source.label;

      /* 3) 校验通过 → 先落盘（此时 buffer 仍完好） */
      prog('校验通过，正在写入本地缓存…');
      try{
        await Cache.put('pikajieqi-st.js', rJs.buf);
        await Cache.put('pikajieqi-st.wasm', rW.buf);
        log('I','引擎已缓存', { js:rJs.buf.byteLength, wasm:rW.buf.byteLength, source:self.sourceLabel });
      }catch(e){ log('W','缓存写入失败',{msg:e.message}); }

      /* 4) 再启动引擎 */
      prog('正在编译引擎…');
      await self.boot(jsText, rW.buf, prog);
    })().catch(function(e){
      self.ready=null; self.worker=null;
      log('E','引擎加载失败', { msg:e.message });
      throw e;
    });
    return this.ready;
  },

  send(cmd){ if(!this.worker) throw new Error('引擎未就绪'); this.worker.postMessage({ type:'command', command:cmd }); },
  onLine(fn){ this.lines.push(fn); var self=this; return function(){ var i=self.lines.indexOf(fn); if(i>=0) self.lines.splice(i,1); }; },
  waitFor(pred, ms){
    var self=this;
    return new Promise(function(res){
      var timer=setTimeout(function(){ off(); res(null); }, ms||20000);
      var off=self.onLine(function(line){ if(pred(line)){ clearTimeout(timer); off(); res(line); } });
    });
  },
  cmdWait(cmd, expect, ms){
    var p=this.waitFor(function(l){ return l.indexOf(expect)===0; }, ms||15000);
    this.send(cmd);
    return p.then(function(l){ if(!l) throw new Error('等待 '+expect+' 超时'); return l; });
  },
  stop(){ this.token++; if(this.searching && this.worker){ try{ this.send('stop'); }catch(e){} } },
  search(fen, opt){
    var self=this;
    var run=function(){ return self.searchNow(fen, opt||{}); };
    var next=this.queue.then(run, run);
    this.queue=next.then(function(){}, function(){});
    return next;
  },
  async searchNow(fen, opt){
    await this.preload();
    var my=++this.token;
    if(this.searching){ await this.waitFor(function(l){ return l.indexOf('bestmove')===0; }, 5000); this.searching=false; }
    if(this.token!==my) return { best:null, ok:false, aborted:true };
    this.send('setoption name MultiPV value 1');
    this.send('position fen '+fen);
    var self=this, best=null;
    this.searching=true;
    var p=this.waitFor(function(l){ return l.indexOf('bestmove')===0; }, (opt.movetime||0)+25000);
    this.send(opt.movetime ? ('go movetime '+Math.round(opt.movetime)) : ('go depth '+(opt.depth||1)));
    var line=await p;
    this.searching=false;
    if(line){ var parts=line.split(/\s+/); best=(parts[1]&&parts[1]!=='(none)')?parts[1]:null; }
    return { best:best, ok:(this.token===my && !!best), aborted:(this.token!==my) };
  }
};

async function runDiagnostic(render){
  var out=[];
  log('I','开始测速诊断', { sources:SOURCE_COUNT });
  for(var i=0;i<ENGINE_SOURCES.length;i++){
    var src=ENGINE_SOURCES[i];
    try{ render && render('('+(i+1)+'/'+SOURCE_COUNT+') 测试 '+src.label+' …'); }catch(e){}
    var rec={ label:src.label, ok:false, ms:0, bytes:0, kbps:0, note:'' };
    var ctl=('AbortController' in window)?new AbortController():null;
    var t0=Date.now();
    try{
      var buf = await fetchStream(src.url+'pikajieqi-st.js', ctl, function(){});
      var ms=Date.now()-t0;
      if(!buf || buf.byteLength<1000) throw new Error('响应过小');
      var txt=new TextDecoder('utf-8').decode(buf);
      if(txt.indexOf('PikaJieQi')<0) throw new Error('内容异常');
      rec.ok=true; rec.ms=ms; rec.bytes=buf.byteLength;
      rec.kbps = Math.round(buf.byteLength/1024 / (ms/1000));
      rec.note = '正常';
    }catch(e){
      rec.ms=Date.now()-t0;
      rec.note = String(e && e.message || e).slice(0,40) || '失败';
    }
    if(ctl) { try{ ctl.abort(); }catch(e){} }
    out.push(rec);
    log('I','测速结果', rec);
  }
  var okList=out.filter(function(r){return r.ok;});
  log('I','测速诊断完成', { total:out.length, ok:okList.length });
  return out;
}

/* =========================================================================
   棋盘渲染
   ========================================================================= */
var Board = {
  cv:null, ctx:null, cell:0, pad:0, W:0, H:0,
  init(cv){ this.cv=cv; this.ctx=cv.getContext('2d'); },
  resize(){
    var wrap = this.cv.parentNode;
    // 沉浸模式下榨取边距，让棋盘尽量大
    var mg = (document.getElementById('app') && document.getElementById('app').classList.contains('immersive')) ? 3 : 12;
    var aw = wrap.clientWidth - mg, ah = wrap.clientHeight - mg;
    if(aw<=0||ah<=0) return;
    var cell = Math.floor(Math.min(aw/9, ah/10));
    if(cell<8) cell=8;
    this.cell = cell; this.pad = Math.round(cell*0.52);
    var W = cell*8 + this.pad*2, H = cell*9 + this.pad*2;
    // 若高度溢出则再收缩
    if(H > ah){ var k = ah/H; cell = Math.floor(cell*k); this.cell=cell; this.pad=Math.round(cell*0.52); W=cell*8+this.pad*2; H=cell*9+this.pad*2; }
    var dpr = window.devicePixelRatio||1;
    this.W=W; this.H=H;
    this.cv.style.width=W+'px'; this.cv.style.height=H+'px';
    this.cv.width=Math.round(W*dpr); this.cv.height=Math.round(H*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  xy(r,c){
    var sr = G.flip ? r : (9-r);
    var sc = G.flip ? (8-c) : c;
    return [ this.pad + sc*this.cell, this.pad + sr*this.cell ];
  },
  pick(px,py){
    var sc = Math.round((px - this.pad)/this.cell);
    var sr = Math.round((py - this.pad)/this.cell);
    if(sc<0||sc>8||sr<0||sr>9) return -1;
    var c = G.flip ? (8-sc) : sc;
    var r = G.flip ? sr : (9-sr);
    return r*9+c;
  },
  draw(){
    var ctx=this.ctx, cell=this.cell, pad=this.pad;
    if(!ctx||!cell) return;
    var W=this.W,H=this.H;
    // 背景
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#e3c08d'); g.addColorStop(1,'#d4a86e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=Math.max(1,cell*0.035);
    // 网格
    ctx.beginPath();
    for(var c=0;c<9;c++){
      var a=this.xy(0,c), b=this.xy(9,c);
      if(c===0||c===8){ ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); }
      else { ctx.moveTo(a[0],a[1]); ctx.lineTo(this.xy(4,c)[0],this.xy(4,c)[1]);
             ctx.moveTo(this.xy(5,c)[0],this.xy(5,c)[1]); ctx.lineTo(b[0],b[1]); }
    }
    for(var r=0;r<10;r++){
      var a2=this.xy(r,0), b2=this.xy(r,8);
      ctx.moveTo(a2[0],a2[1]); ctx.lineTo(b2[0],b2[1]);
    }
    ctx.stroke();
    // 外框
    ctx.lineWidth=Math.max(1.2,cell*0.05);
    ctx.strokeRect(this.xy(0,0)[0], this.xy(0,0)[1], cell*8, cell*9);
    // 九宫斜线
    ctx.lineWidth=Math.max(1,cell*0.03);
    ctx.beginPath();
    [[0,3,2,5],[0,5,2,3],[7,3,9,5],[7,5,9,3]].forEach(function(s){
      var p1=this.xy(s[0],s[1]), p2=this.xy(s[2],s[3]);
      ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]);
    }, this);
    ctx.stroke();
    // 河界文字
    ctx.fillStyle='rgba(120,72,30,.75)';
    ctx.font='600 '+Math.round(cell*0.42)+'px "KaiTi","STKaiti","PingFang SC","Microsoft YaHei",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    var midY=(this.xy(4,0)[1]+this.xy(5,0)[1])/2;
    var x1=this.xy(4,1)[0], x2=this.xy(4,7)[0];
    ctx.fillText('楚 河', x1, midY);
    ctx.fillText('漢 界', x2, midY);
    // 兵炮位标记
    ctx.fillStyle='#8a5a2b';
    var marks=[[3,0],[3,2],[3,4],[3,6],[3,8],[6,0],[6,2],[6,4],[6,6],[6,8],[2,1],[2,7],[7,1],[7,7]];
    ctx.lineWidth=Math.max(1,cell*0.022);
    marks.forEach(function(m){
      var p=this.xy(m[0],m[1]); var off=cell*0.10, L=cell*0.16;
      for(var k=0;k<4;k++){
        var sx=(k===0||k===3)?-1:1, sy=(k<2)?-1:1;
        var hx=p[0]+sx*off, hy=p[1]+sy*off;
        if(hx-cell*0.5 < this.xy(m[0],0)[0]-cell*0.45 && false) continue;
        ctx.beginPath();
        ctx.moveTo(hx, hy); ctx.lineTo(hx+sx*L, hy);
        ctx.moveTo(hx, hy); ctx.lineTo(hx, hy+sy*L);
        ctx.stroke();
      }
    }, this);

    // 走子提示
    if(G.sel!==null){
      var sp=this.xy((G.sel/9)|0, G.sel%9);
      ctx.strokeStyle='#ffd54a'; ctx.lineWidth=Math.max(2,cell*0.07);
      ctx.beginPath(); ctx.arc(sp[0],sp[1],cell*0.46,0,Math.PI*2); ctx.stroke();
    }
    for(var i=0;i<G.moves.length;i++){
      var m=G.moves[i];
      var p=this.xy((m/9)|0, m%9);
      var occ = G.state && G.state.board[m];
      if(occ){
        ctx.strokeStyle='#ff5252'; ctx.lineWidth=Math.max(2,cell*0.07);
        ctx.beginPath(); ctx.arc(p[0],p[1],cell*0.46,0,Math.PI*2); ctx.stroke();
      } else {
        ctx.fillStyle='rgba(60,180,120,.62)';
        ctx.beginPath(); ctx.arc(p[0],p[1],cell*0.16,0,Math.PI*2); ctx.fill();
      }
    }
    // 上一步标记
    if(G.state && G.state.lastMove){
      [[G.state.lastMove.from,'rgba(90,160,255,.9)'],[G.state.lastMove.to,'rgba(90,160,255,.9)']].forEach(function(x){
        var idx=x[0], p=this.xy((idx/9)|0, idx%9);
        ctx.strokeStyle=x[1]; ctx.lineWidth=Math.max(1.5,cell*0.05);
        ctx.strokeRect(p[0]-cell*0.46,p[1]-cell*0.46,cell*0.92,cell*0.92);
      }, this);
    }
    // 棋子
    var view = G.viewState || G.state;
    if(view){
      for(var j=0;j<90;j++){
        var pc=view.board[j]; if(!pc) continue;
        this.drawPiece(j, pc);
      }
    }
  },
  drawPiece(idx, p){
    var ctx=this.ctx, cell=this.cell;
    var xy=this.xy((idx/9)|0, idx%9);
    var R=cell*0.43;
    if(p.faceDown){
      // 暗子
      var g=ctx.createRadialGradient(xy[0]-R*0.3, xy[1]-R*0.3, R*0.1, xy[0], xy[1], R);
      g.addColorStop(0,'#6f6259'); g.addColorStop(1,'#3f3730');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(xy[0],xy[1],R,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=p.color==='red'?'#c96a4a':'#4a4a55'; ctx.lineWidth=Math.max(1.4,cell*0.055);
      ctx.beginPath(); ctx.arc(xy[0],xy[1],R,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=Math.max(1,cell*0.03);
      ctx.beginPath(); ctx.arc(xy[0],xy[1],R*0.66,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.30)';
      ctx.font='600 '+Math.round(cell*0.34)+'px system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('?', xy[0], xy[1]+1);
    } else {
      var red = p.color==='red';
      var g2=ctx.createRadialGradient(xy[0]-R*0.3, xy[1]-R*0.35, R*0.1, xy[0], xy[1], R);
      g2.addColorStop(0,'#fdf0d5'); g2.addColorStop(1,'#e2c79c');
      ctx.fillStyle=g2;
      ctx.beginPath(); ctx.arc(xy[0],xy[1],R,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=red?'#a8321e':'#33333c'; ctx.lineWidth=Math.max(1.4,cell*0.055);
      ctx.beginPath(); ctx.arc(xy[0],xy[1],R,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=Math.max(1,cell*0.02);
      ctx.beginPath(); ctx.arc(xy[0],xy[1],R*0.80,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=red?'#b02a12':'#24242c';
      ctx.font='700 '+Math.round(cell*0.56)+'px "KaiTi","STKaiti","PingFang SC","Microsoft YaHei",serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      var cn = Rules.ROLE_CN[p.role] ? Rules.ROLE_CN[p.role][p.color] : '?';
      ctx.fillText(cn, xy[0], xy[1]+Math.round(cell*0.02));
    }
  }
};

    G.mode='pve';
    G.humanColor = G.humanColor||'red';

    G.flip = (G.humanColor==='black');
    G.state = Rules.newGame();
    G.sel=null; G.moves=[]; G.thinking=false; G.ponder=null;
    G.history=[]; G.viewState=Rules.viewFor(G.state, G.humanColor);

    if(ui) ui.textContent = '加载失败：' + e.message + '\n可点「测速诊断」查看各源状态。';
    toast('引擎加载失败：'+e.message, 4000);

}

/* 走子反馈：翻子 > 吃子 > 将军 > 普通 */
function feedbackMove(evt){
  if(evt && evt.revealed){ Snd.reveal(); Hap.reveal(); return; }
  if(evt && evt.captured){ Snd.capture(); Hap.capture(); return; }
  Snd.move(); Hap.move();
}

function onBoardClick(ev){
  if(!G.state) return;
  if(isOver(G.state.over)) return;
  var myColor = G.mode==='pve' ? G.humanColor : G.netColor;
  if(G.state.turn !== myColor) { toast('还没到你的回合'); return; }
  if(G.thinking) return;
  var rect = Board.cv.getBoundingClientRect();
  var px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  var idx = Board.pick(px, py);
  if(idx<0) return;
  var p = G.state.board[idx];
  if(G.sel!==null && G.moves.indexOf(idx)>=0){
    doMove(G.sel, idx);
    return;
  }
  if(p && p.color===myColor){
    G.sel = idx;
    G.moves = Rules.legalMoves(G.state, idx);
    log('D','选中棋子', { idx:idx, uci:Rules.idxToUci(idx), moves:G.moves.length });
    Snd.tap(); Hap.tap();
    Board.draw();
  } else {
    G.sel=null; G.moves=[]; Board.draw();
  }
}

function doMove(from, to){
  var legal = Rules.legalMoves(G.state, from);
  if(legal.indexOf(to)<0){ log('W','非法走法被拒绝',{from:from,to:to}); toast('非法走法'); return; }
  if(G.mode==='pvp'){
    if(G.isHost){
      // 房主持真相：本地直接应用，再广播给客机
      G.history.push(Rules.clone(G.state));
      var rh = Rules.applyMove(G.state, from, to);
      G.state = rh.state; G.sel=null; G.moves=[];
      G.viewState = Rules.viewFor(G.state, 'red');
      log('I','房主走子', { uci:Rules.idxToUci(from)+Rules.idxToUci(to), revealed:rh.evt.revealed, captured:rh.evt.captured });
      feedbackMove(rh.evt);
      Board.draw(); updateStatus(); broadcast();
      if(isGameOver()) return;
      return;
    }
    if(G.conn){
      sendNet({ t:'move', from:from, to:to });
      G.thinking=true; updateStatus(); return;   // 等房主回执
    }
    return;
  }
  G.history.push(Rules.clone(G.state));
  var res = Rules.applyMove(G.state, from, to);
  G.state = res.state;
  G.sel=null; G.moves=[];
  G.viewState = Rules.viewFor(G.state, G.humanColor);
  log('I','玩家走子', { uci:Rules.idxToUci(from)+Rules.idxToUci(to), from:from, to:to,
    revealed:res.evt.revealed, captured:res.evt.captured });
  feedbackMove(res.evt);
  Board.draw(); updateStatus();
  if(isGameOver()) return;
  if(G.mode==='pve') setTimeout(aiTurn, 260);
}

/** 对局是否已终结 */
function isOver(o){
  return !!o && (o.result==='checkmate'||o.result==='stalemate'||o.result==='draw80'||o.result==='drawMax'||o.result==='resign');
}
function isGameOver(){
  var o=G.state.over; if(!o) return false;
  if(isOver(o)){
    log('I','对局结束', o);
    setTimeout(function(){ showResult(o); }, 200);
    return true;
  }
  return false;
}
function showResult(o){
  var txt = (o.result==='draw80') ? '和棋（连续80步无吃子）'
    : (o.result==='drawMax') ? '和棋（达到200回合上限）'
    : (o.winner==='red'?'红方胜':'黑方胜') + '（' + (o.result==='checkmate'?'将死':o.result==='stalemate'?'困毙':'认输') + '）';
  var mine = G.mode==='pve' ? G.humanColor : G.netColor;
  var note='';
  if(o.winner){ note = (o.winner===mine) ? ' 你赢了' : ' 你输了'; }
  if(!o.winner){ Snd.draw(); Hap.tap(); }
  else if(o.winner===mine){ Snd.win(); Hap.win(); }
  else { Snd.lose(); Hap.lose(); }
  confirmBox(txt + note, function(){
    if(G.mode==='pve'){
      G.state=Rules.newGame(); G.sel=null; G.moves=[]; G.ponder=null; G.history=[];
      G.viewState=Rules.viewFor(G.state,G.humanColor);
      Board.draw(); updateStatus();
      if(G.aiColor==='red') setTimeout(aiTurn,300);
    } else { renderPvpSetup(); }
  });
}

function doUndo(){
  if(G.mode!=='pve'||!G.state){ return; }
  if(G.thinking){ toast('AI 正在思考，请稍候'); return; }
  if(!G.history.length){ toast('没有可悔的棋'); return; }
  // 回退到"轮到我走"的最近一个局面（撤销 AI 一步 + 自己一步）
  var target=null;
  while(G.history.length){
    var h=G.history.pop();
    if(h.turn===G.humanColor){ target=h; break; }
  }
  if(!target){ toast('没有可悔的棋'); return; }
  ENGINE.stop();
  G.state=target; G.sel=null; G.moves=[]; G.ponder=null;
  G.viewState=Rules.viewFor(G.state,G.humanColor);
  log('I','悔棋', { backToPly:G.state.ply });
  Snd.undo(); Hap.undo();
  Board.draw(); updateStatus(); toast('已悔棋');
}

function doHint(){
  if(G.mode!=='pve') return;
  if(G.state.turn!==G.humanColor){ toast('等AI走完'); return; }
  G.thinking=true; updateStatus();
  var fen = Rules.toFen(G.state, G.humanColor);
  ENGINE.search(fen, { movetime:1500 }).then(function(r){
    G.thinking=false;
    if(r.best){
      var from=Rules.uciToIdx(r.best.slice(0,2)), to=Rules.uciToIdx(r.best.slice(2,4));
      if(from>=0&&to>=0){
        G.sel=from; G.moves=Rules.legalMoves(G.state,from);
        Board.draw();
        toast('建议：'+Rules.idxToUci(from)+'→'+Rules.idxToUci(to), 2500);
        log('I','AI提示', { best:r.best });
      }
    } else toast('引擎未给出建议');
    updateStatus();
  }).catch(function(e){ G.thinking=false; log('E','提示失败',{msg:e.message}); toast('提示失败'); updateStatus(); });
}

/* ---------- AI 回合 ---------- */
async function aiTurn(){
  if(G.mode!=='pve'||!G.state) return;
  if(G.state.turn!==G.aiColor) return;
  if(isOver(G.state.over)) return;
  G.thinking=true; updateStatus();
  var lv = LEVELS[G.level];
  var fen = Rules.toFen(G.state, G.aiColor);
  log('I','AI思考', { fen:fen, level:G.level, opt: (lv.depth?('depth '+lv.depth):('movetime '+lv.movetime)) });

  var usedPonder=false;
  if(G.ponder && G.ponder.fen === fen){
    // 后台思考命中
    usedPonder=true;
    log('I','后台思考命中', { fen:fen });
  } else if(G.ponder){
    log('I','后台思考未命中，停止', { ponderFen:G.ponder.fen, nowFen:fen });
    ENGINE.stop();
    G.ponder=null;
  }

  var r;
  try{
    if(usedPonder){
      r = await G.ponder.promise;
      G.ponder=null;
    } else {
      r = await ENGINE.search(fen, lv.depth?{depth:lv.depth}:{movetime:lv.movetime});
    }
  }catch(e){ log('E','AI搜索异常',{msg:e.message}); r=null; }

  G.thinking=false;
  if(!r || !r.best){
    // 兜底：随机一个合法走法
    var all=Rules.allLegal(G.state, G.aiColor);
    if(all.length===0){ updateStatus(); return; }
    var mv=all[randInt(all.length)];
    log('W','引擎无结果，使用兜底走法', { mv:mv });
    applyAi(mv.from, mv.to, true);
    return;
  }
  var from=Rules.uciToIdx(r.best.slice(0,2)), to=Rules.uciToIdx(r.best.slice(2,4));
  var legal=Rules.legalMoves(G.state, from);
  if(from<0||to<0||legal.indexOf(to)<0){
    log('W','引擎走法非法，兜底', { best:r.best });
    var all2=Rules.allLegal(G.state,G.aiColor);
    if(all2.length===0){ updateStatus(); return; }
    var mv2=all2[randInt(all2.length)];
    applyAi(mv2.from, mv2.to, true);
    return;
  }
  applyAi(from, to, false);
}

function applyAi(from, to, fallback){
  G.history.push(Rules.clone(G.state));
  var res=Rules.applyMove(G.state, from, to);
  G.state=res.state;
  G.viewState=Rules.viewFor(G.state,G.humanColor);
  log('I','AI走子', { uci:Rules.idxToUci(from)+Rules.idxToUci(to), revealed:res.evt.revealed,
    captured:res.evt.captured, fallback:fallback });
  feedbackMove(res.evt);
  Board.draw(); updateStatus();
  if(isGameOver()) return;
  // 后台思考
  if(LEVELS[G.level].ponder && !G.state.over){
    startPonder();
  }
}

async function startPonder(){
  try{
    var lv=LEVELS[G.level];
    // 预测玩家应手（短搜）
    var fenNow = Rules.toFen(G.state, G.humanColor);
    var pr = await ENGINE.search(fenNow, { movetime:400 });
    if(!pr || !pr.best){ return; }
    var f=Rules.uciToIdx(pr.best.slice(0,2)), t=Rules.uciToIdx(pr.best.slice(2,4));
    var legal=Rules.legalMoves(G.state, f);
    if(f<0||t<0||legal.indexOf(t)<0) return;
    var after = Rules.applyMove(G.state, f, t).state;
    var fenP = Rules.toFen(after, G.aiColor);
    log('I','启动后台思考', { predict:pr.best, fen:fenP });
    var p = ENGINE.search(fenP, { movetime: lv.movetime });
    G.ponder = { fen:fenP, promise:p };
    // 若引擎因主搜索被抢占，清空
    p.then(function(){ if(G.ponder && G.ponder.promise===p){ /* 保留 */ } }).catch(function(){});
  }catch(e){ log('W','后台思考启动失败',{msg:e.message}); }
}

/* =========================================================================
   联机（PeerJS）
   ========================================================================= */
var PEER_SERVERS = [
  { host:'0.peerjs.com', port:443, path:'/', secure:true },
  { host:'1.peerjs.com', port:443, path:'/', secure:true }
];
var PEER_CDNS = [
  'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://fastly.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
];
function loadPeerJs(){
  if(window.Peer) return Promise.resolve();
  var i=0;
  function tryNext(){
    if(i>=PEER_CDNS.length) return Promise.reject(new Error('PeerJS 库加载失败'));
    var url=PEER_CDNS[i++];
    log('I','加载 PeerJS', { url:url });
    return new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src=url; s.onload=function(){ window.Peer ? res() : rej(new Error('Peer 未定义')); };
      s.onerror=function(){ rej(new Error('加载失败')); };
      document.head.appendChild(s);
      setTimeout(function(){ if(!window.Peer) rej(new Error('超时')); }, 15000);
    }).catch(function(e){ log('W','PeerJS CDN失败',{url:url,msg:e.message}); return tryNext(); });
  }
  return tryNext();
}

function genRoom(){
  var ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='';
  for(var i=0;i<6;i++) s+=ch[randInt(ch.length)];
  return 'jq-'+s;
}

function renderPvpSetup(){
  clearApp();
  var page=el('div','page'); page.style.justifyContent='flex-start';
  var c=el('div','card'); c.appendChild(el('h3','','联机对局'));
  var info=el('div','msg');
  info.innerHTML='通过房间号与好友对战。房主执红先手，客机执黑。<br>信令服务器：0.peerjs.com / 1.peerjs.com（公共免费，自动切换）';
  c.appendChild(info);
  var bCreate=el('button','btn pri','创建房间');
  var rowIn=el('div','row'); rowIn.style.marginTop='8px';
  var input=el('input'); input.placeholder='输入房间号';
  input.style.cssText='flex:1;padding:10px;font-size:15px;border-radius:8px;border:1px solid #55432f;background:#1a1410;color:#f2e8da;font-family:inherit;letter-spacing:1px;text-transform:uppercase';
  var bJoin=el('button','btn','加入'); bJoin.style.flex='0 0 72px';
  rowIn.appendChild(input); rowIn.appendChild(bJoin);
  c.appendChild(bCreate); c.appendChild(rowIn);
  var msg=el('div','msg',''); msg.id='pvpmsg'; c.appendChild(msg);
  page.appendChild(c);
  var back=el('button','btn','返回'); back.style.maxWidth='320px'; back.onclick=renderHome;
  page.appendChild(back);
  app.appendChild(page);
  addGear();

  bCreate.onclick=function(){ hostRoom(msg); };
  bJoin.onclick=function(){ var v=(input.value||'').trim().toUpperCase(); if(!v){ setMsg(msg,'请输入房间号'); return; } joinRoom(v, msg); };
}
function setMsg(el, t){ if(el) el.innerHTML=t; }

async function hostRoom(msgEl){
  setMsg(msgEl,'正在连接信令服务器…');
  try{ await loadPeerJs(); }catch(e){ setMsg(msgEl,'PeerJS 库加载失败：'+e.message); log('E','PeerJS失败',{msg:e.message}); return; }
  var room = genRoom();
  G.room=room; G.isHost=true; G.netColor='red'; G.mode='pvp';
  var idx=0;
  function tryServer(){
    if(idx>=PEER_SERVERS.length){ setMsg(msgEl,'所有信令服务器均不可用'); log('E','信令服务器全部失败'); return; }
    var cfg=PEER_SERVERS[idx];
    setMsg(msgEl,'正在连接 '+cfg.host+' …（第'+(idx+1)+'个）');
    log('I','尝试信令服务器', { host:cfg.host, idx:idx });
    var peer;
    try{
      peer = new Peer(room, Object.assign({ debug:1 }, cfg));
    }catch(e){ idx++; return tryServer(); }
    var settled=false;
    peer.on('open', function(id){
      settled=true;
      log('I','信令连接成功，房间已创建', { room:room, host:cfg.host });
      setMsg(msgEl,'房间号 <b style="color:#e8b872;font-size:17px">'+room+'</b><br>等待对手加入…');
    });
    peer.on('connection', function(conn){
      log('I','对手已连接');
      G.conn=conn; G.peer=peer;
      setupConn(conn);
      // 房主持真相
      G.state=Rules.newGame();
      G.viewState=Rules.viewFor(G.state,'red');
      G.history=[]; G.flip=false;
      renderGame();
      updateStatus();
      setTimeout(function(){
        Board.resize(); Board.draw();
        sendNet({ t:'view', view:Rules.viewFor(G.state,'black'), you:'black',
                  turn:G.state.turn, over:G.state.over, lastMove:G.state.lastMove });
      },120);
    });
    peer.on('error', function(err){
      log('W','Peer错误', { type:err.type, msg:err.message, host:cfg.host });
      if(!settled && (err.type==='server-error'||err.type==='network'||err.type==='socket-error'||err.type==='unavailable-id')){
        try{ peer.destroy(); }catch(e){}
        idx++; tryServer();
      } else if(err.type==='unavailable-id'){
        setMsg(msgEl,'房间号已被占用，请重试');
      } else {
        setMsg(msgEl,'连接错误：'+(err.message||err.type));
      }
    });
  }
  tryServer();
}

async function joinRoom(room, msgEl){
  setMsg(msgEl,'正在连接信令服务器…');
  try{ await loadPeerJs(); }catch(e){ setMsg(msgEl,'PeerJS 库加载失败：'+e.message); log('E','PeerJS失败',{msg:e.message}); return; }
  G.room=room; G.isHost=false; G.mode='pvp';
  var idx=0;
  function tryServer(){
    if(idx>=PEER_SERVERS.length){ setMsg(msgEl,'所有信令服务器均不可用'); return; }
    var cfg=PEER_SERVERS[idx];
    setMsg(msgEl,'正在连接 '+cfg.host+' …');
    log('I','尝试信令服务器(客机)', { host:cfg.host, idx:idx, room:room });
    var peer;
    try{ peer = new Peer(Object.assign({ debug:1 }, cfg)); }catch(e){ idx++; return tryServer(); }
    var settled=false;
    peer.on('open', function(id){
      settled=true;
      log('I','信令连接成功，尝试加入房间', { room:room });
      setMsg(msgEl,'正在加入 '+room+' …');
      var conn = peer.connect(room, { reliable:true });
      G.conn=conn;
      conn.on('open', function(){
        log('I','已连接房主');
        Snd.connect(); Hap.connect();
        G.peer=peer;
        setupConn(conn);
        renderGame();
        setMsg(msgEl,'已连接，等待房主开局…');
      });
      conn.on('error', function(e){ log('E','连接错误',{msg:e.message}); setMsg(msgEl,'连接失败：'+e.message); });
    });
    peer.on('error', function(err){
      log('W','Peer错误(客机)', { type:err.type, msg:err.message });
      if(!settled && (err.type==='server-error'||err.type==='network'||err.type==='socket-error')){
        try{ peer.destroy(); }catch(e){}
        idx++; tryServer();
      } else if(err.type==='peer-unavailable'){
        setMsg(msgEl,'房间不存在或房主未在线');
      } else {
        setMsg(msgEl,'错误：'+(err.message||err.type));
      }
    });
  }
  tryServer();
}

function setupConn(conn){
  conn.on('data', function(d){ onNetData(d); });
  conn.on('close', function(){
    log('W','连接断开');
    toast('对手已断开');
  });
}
function sendNet(o){
  if(G.conn){ try{ G.conn.send(o); }catch(e){ log('E','发送失败',{msg:e.message}); } }
}
function onNetData(d){
  log('I','收到网络消息', { t:d.t });
  if(G.isHost){
    // 房主：处理客机走子
    if(d.t==='move'){
      if(G.state.turn!=='black'){ log('W','客机在非其回合走子'); sendNet({t:'view',view:Rules.viewFor(G.state,'black'),turn:G.state.turn,over:G.state.over,lastMove:G.state.lastMove}); return; }
      var legal=Rules.legalMoves(G.state, d.from);
      if(legal.indexOf(d.to)<0){ log('W','客机非法走法',{from:d.from,to:d.to}); sendNet({t:'view',view:Rules.viewFor(G.state,'black'),turn:G.state.turn,over:G.state.over,lastMove:G.state.lastMove}); return; }
      G.history.push(Rules.clone(G.state));
      var res=Rules.applyMove(G.state,d.from,d.to);
      G.state=res.state; G.viewState=Rules.viewFor(G.state,'red');
      Board.draw(); updateStatus();
      broadcast();
      if(isOver(G.state.over)) isGameOver();
    } else if(d.t==='resign'){
      G.state.over={result:'resign', winner:'red'}; G.viewState=Rules.viewFor(G.state,'red');
      Board.draw(); updateStatus(); broadcast(); isGameOver();
    } else if(d.t==='reqUndo'){
      // 回退到最近一个"轮到客机(黑)"的局面
      var tgt=null;
      while(G.history.length){ var h=G.history.pop(); if(h.turn==='black'){ tgt=h; break; } }
      if(tgt){
        G.state=tgt; G.sel=null; G.moves=[];
        G.viewState=Rules.viewFor(G.state,'red');
        Board.draw(); updateStatus(); broadcast();
        log('I','联机悔棋',{ backToPly:G.state.ply });
        toast('对手悔棋，已回退');
      } else { sendNet({t:'msg', text:'当前无法悔棋'}); }
    }
  } else {
    // 客机：接收视图
    if(d.t==='msg'){ toast(d.text||''); return; }
    if(d.t==='view'){
      if(d.you) G.netColor=d.you;
      G.flip = (G.netColor==='black');
      G.viewState = d.view;
      G.state = d.view;   // 客机用视图当状态（暗子 role=null，走法只看位置，可行）
      G.thinking=false;
      if(!document.querySelector('canvas')) renderGame();
      Board.resize(); Board.draw(); updateStatus();
      if(isOver(d.over)){
        setTimeout(function(){ showResult(d.over); },200);
      }
    }
  }
}
function broadcast(){
  if(!G.isHost||!G.conn) return;
  sendNet({ t:'view', view:Rules.viewFor(G.state,'black'), you:'black',
            turn:G.state.turn, over:G.state.over, lastMove:G.state.lastMove });
}
