/* ---- 用 DOMParser 重建文档，不依赖 document.write ----
   1) 脚本是 parser 插入的，active parser 存在时 document.open() 被规范静默忽略
   2) 延迟到 DOMContentLoaded 再 write，Chrome 又会以"干预"为由丢弃写入
   两者都会导致外壳残留 / 正文 meta 被塞进 body。
   故改为：DOMParser 解析 → 手动搬迁 head/body → 动态创建 script 执行（保序）。 */
function execScript(orig, parent){
var s=document.createElement("script");
var a=orig.attributes;
for(var k=0;k<a.length;k++){
var nm=a[k].name.toLowerCase();
if(nm==="src"||nm==="async"||nm==="defer") continue;
try{ s.setAttribute(a[k].name, a[k].value); }catch(e){}
}
if(orig.getAttribute("src")) s.src=orig.getAttribute("src");
else s.textContent=orig.textContent;
parent.appendChild(s);
}
function run(html){
var doc=new DOMParser().parseFromString(html,"text/html");
var sh=doc.head, sb=doc.body;
if(!sh||!sb) throw new Error("解析失败：找不到 head/body");

var lg=doc.documentElement.getAttribute("lang");
if(lg) document.documentElement.lang=lg;
}catch(e){}
var h=document.head, bd=document.body;

while(bd.firstChild) bd.removeChild(bd.firstChild);

var ba=sb.attributes;
for(var z=0;z<ba.length;z++){
try{ bd.setAttribute(ba[z].name, ba[z].value); }catch(e){}
}
}catch(e){}
var hn=[],i;
for(i=0;i<sh.childNodes.length;i++) hn.push(sh.childNodes[i]);
for(i=0;i<hn.length;i++){
var n=hn[i];
if(n.nodeType!==1) continue;
if(n.nodeName==="SCRIPT"){ execScript(n,h); }
else { h.appendChild(document.importNode(n,true)); }
}
var bn=[],j;
for(j=0;j<sb.childNodes.length;j++) bn.push(sb.childNodes[j]);

else { bd.appendChild(document.importNode(m,true)); }
}
}
