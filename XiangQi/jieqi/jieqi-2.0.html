      prog('下载引擎脚本 ' + Math.round(got/1024) + 'KB · ' + src.label);
    });
    var jsText = new TextDecoder('utf-8').decode(rJs.buf);
    if(jsText.indexOf('PikaJieQi')<0) throw new Error('引擎脚本内容异常（'+rJs.source.label+'）');
    var hJs = await sha256(rJs.buf);
    if(hJs && hJs !== V.js.sha){
      log('W','引擎脚本哈希不匹配', { got:hex8(hJs), source:rJs.source.label });
    }

    prog('正在从 '+SOURCE_COUNT+' 个源并发下载引擎核心（' + V.tag + '）…');
    var rW = await raceFile(V.wasm.file, ENGINE_SOURCES, function(got,len,src){
      prog('下载引擎核心 ' + Math.round(got/1024) + 'KB · ' + src.label);
    });
    var hW = await sha256(rW.buf);
    if(hW !== V.wasm.sha){
      throw new Error('引擎核心校验失败（'+hex8(hW)+'），已放弃该来源');
    }

    self.sourceLabel = rJs.source.label + ' / ' + rW.source.label;

    
    prog('校验通过，正在写入本地缓存…');
    try{
      await Cache.put(ck(V.js.file), rJs.buf);
      await Cache.put(ck(V.wasm.file), rW.buf);
      log('I','引擎已缓存', { variant:self.variant, js:rJs.buf.byteLength,
                              wasm:rW.buf.byteLength, source:self.sourceLabel });
    }catch(e){ log('W','缓存写入失败',{msg:e.message}); }

    /* 再启动引擎。
       两级重试：① 真实同源 URL（子 Worker 兼容性最好）
                ② blob URL（兜底，某些环境无同源文件时可用）
       两者都失败且当前是多线程 → 自动降级单线程。 */

    prog('正在编译引擎…');
    try{
      var BU = self.engineBaseUrl();
      if(self.variant === 'mt') await self._bootMT(jsText, rW.buf, prog, BU);
      else await self.boot(jsText, rW.buf, prog, { baseUrl:BU });
    }catch(e){
      self.lastError = e.message;
      if(self.variant === 'mt' && !FORCE_ST && !self._degraded){
        self._degraded = true;
        log('W','多线程启动失败，自动降级单线程', { 原因:e.message });
        
        FORCE_ST = true;
        self.ready = null; self.worker = null; self.handshakeDone = false;
        self.variant = 'st'; self.threads = 1;
        prog('多线程启动失败，已自动改用单线程…');
        return await self._loadFromNet(prog, t0);
      }
      throw e;
    }
  },

  preload(onProgress){
    if(this.ready) return this.ready;
    var self=this;
    this.ready = (async function(){
      var t0=Date.now();
      function prog(t){ try{ onProgress && onProgress(t); }catch(e){} }

      var V = variantOf();
      self.variant = variantKey();
      self.hash = HASH_OF(G.level || 'normal');
      var firstVariant = self.variant;
      self.lastError = null;
      self.simdBlocked = false;

      /* 预检：不支持 SIMD 就不下载，直接告知换浏览器 */
      if(!simdSupported()){
        self.simdBlocked = true;
        self.lastError = '浏览器内核不支持 WebAssembly SIMD';
        log('E','SIMD 预检失败，已阻止下载', { kernel:kernelTag() });
        if(!_simdWarned){
          _simdWarned = true;
          infoBox('浏览器内核不支持 WebAssembly SIMD\n\n当前浏览器 ' + kernelTag() +
            ' 版本过旧，无法运行本游戏引擎。\n请升级到 Chrome / Edge 91+ 或 Firefox 89+ 后重试，或改用系统自带浏览器打开。');
        }
        throw new Error(self.lastError);
      }

      
      try{
        var cjs = await Cache.get(ck(V.js.file));
        var cwasm = await Cache.get(ck(V.wasm.file));
        if(cjs && cwasm && cjs.byteLength>1000 && cwasm.byteLength>100000){
          // 复制一份，避免后续操作影响缓存数据
          var h = await sha256(cwasm);
          if(h === V.wasm.sha){
            self.fromCache = true;
            self.sourceLabel = '本地缓存';
            prog('使用本地缓存（' + V.tag + '），校验通过…');
            var txt = new TextDecoder('utf-8').decode(cjs);
            try{
              /* 必须传 baseUrl：否则 locateFile 拿不到基准路径，
                 动态新建的 pthread 子 Worker 会去 fetch blob:https://host/xxx.wasm 而失败，
                 表现为「Threads>2 就卡死」。缓存分支此前漏传，正是用户遇到的情况。 */

              var CBU = self.engineBaseUrl();
              if(self.variant === 'mt') await self._bootMT(txt, cwasm.slice(0), prog, CBU);
              else await self.boot(txt, cwasm.slice(0), prog, { baseUrl:CBU });
              log('I','引擎来自缓存', { variant:self.variant, ms:Date.now()-t0 });
              return;
            }catch(e){
              self.lastError = e.message;
              log('E','缓存引擎启动失败', { variant:self.variant, msg:e.message });

              /* 环境类失败（内核不支持 SIMD 等）清了也是白清，反而丢掉好缓存；
                 只有疑似文件损坏才清，让下次重新下载。 */
              var envFail = /simd|s128|Invalid value type|CompileError|LinkError/i.test(e.message||'');
              if(!envFail){ try{ await Cache.clear(); }catch(_){} }
              else log('W','环境类失败，保留缓存', { msg:e.message });
              if(firstVariant === 'mt' && !FORCE_ST && !self._degraded){
                log('W','多线程启动失败，自动降级单线程', { 原因:e.message });
                self._degraded = true;
                /* 不写 localStorage：降级只对本次会话有效，
                   下次打开仍会重新检测并尝试多线程 */

                FORCE_ST = true;
                self.variant = 'st'; self.threads = 1;
                prog('多线程启动失败，已自动改用单线程…');
                return await self._loadFromNet(prog, t0);
              }
              self.ready = null;
              throw e;
            }
          }
          log('W','缓存校验失败，重新下载', { got:hex8(h) });
          await Cache.clear();
        }
      }catch(e){ log('W','缓存读取失败',{msg:e.message}); }

      /* 2) 走网络下载并启动（内部自带 多线程→单线程 降级） */

      await self._loadFromNet(prog, t0);
    })().catch(function(e){
      self.lastError = e.message;
      self.ready=null; self.worker=null;
      log('E','引擎加载失败', { msg:e.message });
      throw e;
    });
    return this.ready;
  },

  send(cmd){ if(!this.worker) throw new Error('引擎未就绪'); this.worker.postMessage({ type:'command', command:cmd }); },
  onLine(fn){ this.lines.push(fn); var self=this; return function(){ var i=self.lines.indexOf(fn); if(i>=0) self.lines.splice(i,1); }; },
  waitFor(pred, ms){
    var self=this;
    return new Promise(function(res){
      var timer=setTimeout(function(){ off(); res(null); }, ms||20000);
      var off=self.onLine(function(line){ if(pred(line)){ clearTimeout(timer); off(); res(line); } });
    });
  },
  cmdWait(cmd, expect, ms){
    var p=this.waitFor(function(l){ return l.indexOf(expect)===0; }, ms||15000);
    this.send(cmd);
    return p.then(function(l){ if(!l) throw new Error('等待 '+expect+' 超时'); return l; });
  },
  stop(){ this.token++; if(this.searching && this.worker){ try{ this.send('stop'); }catch(e){} } },
  search(fen, opt){
    var self=this;
    var run=function(){ return self.searchNow(fen, opt||{}); };
    var next=this.queue.then(run, run);
    this.queue=next.then(function(){}, function(){});
    return next;
  },
  async searchNow(fen, opt){
    await this.preload();
    var my=++this.token;
    if(this.searching){ await this.waitFor(function(l){ return l.indexOf('bestmove')===0; }, 5000); this.searching=false; }
    if(this.token!==my) return { best:null, ok:false, aborted:true };
    this.send('setoption name MultiPV value 1');
    this.send('position fen '+fen);
    var self=this, best=null;
    /* 评分是「本次搜索的走子方」视角。落子后 st.turn 会换边，
       若不在这里记下，显示时按新走子方换算就会把优劣说反。 */
    var sideFen = (fen||'').split(/\s+/)[1];
    this.infoSide = (sideFen === 'b') ? 'black' : 'red';
    this.searching=true;
    var p=this.waitFor(function(l){ return l.indexOf('bestmove')===0; }, (opt.movetime||0)+25000);
    this.send(opt.movetime ? ('go movetime '+Math.round(opt.movetime)) : ('go depth '+(opt.depth||1)));
    var line=await p;
    this.searching=false;
    var pm=null;
    if(line){ var parts=line.split(/\s+/); best=(parts[1]&&parts[1]!=='(none)')?parts[1]:null;
      /* 引擎 bestmove 行末的 ponder 是「它预测你会走的那步」，深搜免费附带，白拿不花钱 */
      pm=(parts[2]==='ponder'&&parts[3])?parts[3]:null; }
    var inf = this.info || {};
    return { best:best, ok:(this.token===my && !!best), aborted:(this.token!==my),
             score:(inf.score==null?null:inf.score), mate:(inf.mate==null?null:inf.mate), side:this.infoSide,
             ponder:pm };
  }
};


var _optLockAt = 0, _OPT_COOL = 400;
function optRow(items, cur, onPick){
  var box = el('div');
  var nodes = [];
  items.forEach(function(it){
    var o = el('div','opt'+(it.key===cur?' sel':''));
    if(it.icon) o.appendChild(el('span','ic',it.icon));
    var tx = el('span','t',it.label);
    o.appendChild(tx);
    if(it.desc) o.appendChild(el('span','d2',it.desc));
    o.onclick = function(){
      if(it.key === cur) return;
      var n = Date.now();
      if(n - _optLockAt < _OPT_COOL) return;
      _optLockAt = n;
      cur = it.key;
      nodes.forEach(function(x){ x.o.classList.remove('sel'); });
      o.classList.add('sel');
      Snd.tap();
      onPick(it.key);
    };
    nodes.push({o:o, it:it});
    box.appendChild(o);
  });
  return box;
}

function pickEngineMove(state, color, best){
  var from=-1, to=-1;
  if(best){ from = Rules.uciToIdx(best.slice(0,2)); to = Rules.uciToIdx(best.slice(2,4)); }
  var legal = (from>=0) ? Rules.legalMoves(state, from) : [];
  if(from>=0 && to>=0 && legal.indexOf(to)>=0) return { from:from, to:to, fallback:false };
  var all = Rules.allLegal(state, color);
  if(!all.length) return null;
  var mv = all[randInt(all.length)];
  return { from:mv.from, to:mv.to, fallback:true };
}

async function startPve(){

  G.mode='pve';

  G.aiColor = Rules.other(G.humanColor);
  G.flip = (G.humanColor==='black');

  G.history=[]; G.viewState=Rules.viewFor(G.state, G.humanColor);
  G.loading='准备中…';
  renderGame();
  Board.resize(); Board.draw();
  updateStatus();
  var t0 = Date.now();
  function loadMsg(txt){
    pveLoading(txt + ' · 已用时 ' + ((Date.now()-t0)/1000).toFixed(0) + ' 秒');
  }
  try{
    await ENGINE.preload(loadMsg);
    G.loading = null;
    log('I','开始人机对局', { level:G.level, human:G.humanColor, engineSource:ENGINE.sourceLabel, fromCache:ENGINE.fromCache });
    updateStatus();
    if(G.aiColor==='red') setTimeout(aiTurn, 350);
  }catch(e){
    G.loading = null;
    try{ updateScoreBar(); }catch(e2){}
    log('E','启动人机失败',{msg:e.message});
    if(ENGINE.simdBlocked) return;   /* 已弹过 SIMD 专属提示，不再套一层"加载失败" */
    /* 左「返回」右「重试」：askBox 的按钮顺序就是 [noTxt, yesTxt]，直接复用即可 */

    askBox('引擎加载失败：' + e.message + '\n已用时 ' + ((Date.now()-t0)/1000).toFixed(1) + ' 秒',
      '重试', function(){
        ENGINE.ready=null; ENGINE.worker=null; ENGINE.lastError=null; startPve();
      }, '返回', renderHome);
  }
}

   只有走「联机测试」入口（ON.testMode）才有，正常联机不显示。 */
function simBtnsFrag(mk){
  var frag = document.createDocumentFragment();
  if(!ON.testMode) return frag;
  frag.appendChild(mk('踢出对手', function(){
    confirmBox('确定踢出对手？', function(){ netKickBot(); });
  }));
  frag.appendChild(mk('邀请机器人', function(){
    if(BOT.on){ toast('机器人已在房间里'); return; }
    if(!ON.room){ toast('还没进入房间'); return; }
    netSend({ t:'kick' });
    if(ON.role==='host') botJoin(ON.room);
    else toast('仅房主可邀请机器人');
  }));
  frag.appendChild(mk('解散房间', function(){
    confirmBox('解散将终止对局并回收房间号，确定？', function(){
      netSend({ t:'kick' }); netLeave(); renderNetTest();
    });
  }));
  return frag;
}

function fmtScore(mine, mate){
  if(mate){
    if(mine > 0) return { txt:'我绝杀', cls:'#4fd47a' };
    if(mine < 0) return { txt:'被绝杀', cls:'#e85444' };
    return { txt:'绝杀', cls:'#e85444' };
  }
  var a = Math.abs(mine|0);
  if(a <= 50) return { txt:'势均力敌', cls:'#e8c88a' };
  var win = mine > 0;
  var k = Math.min(1, a/1500);
  var cls = win ? ('hsl(142,62%,' + Math.round(40 + k*22) + '%)')
                : ('hsl(4,74%,'  + Math.round(44 + k*20) + '%)');
  if(a >= 2000) return { txt: win ? '我胜势' : 'AI胜势', cls:cls };
  var word = a >= 990 ? (win ? '我大优' : 'AI大优') : (win ? '我优势' : 'AI优势');
  return { txt: word + ' ' + a, cls:cls };
}
function updateScoreBar(){
  var box = document.getElementById('scorebar');
  if(!box) return;
  /* 引擎加载期间：这一行直接当进度条用，不新增任何 UI */

  if(G.loading){
    box.style.display = 'flex';
    box.innerHTML = '';
    var ld = el('span','sc', G.loading);
    ld.style.color = '#c98b4a';
    box.appendChild(ld);
    return;
  }
  var show = (G.mode === 'pve');   /* 计分条只给人机用：联机没有 AI 评分，靠吃子区看战绩 */
  if(!show){ box.style.display='none'; return; }
  box.style.display = 'flex';
  box.innerHTML = '';

  var myColor = (G.mode === 'pve') ? (G.humanColor || 'red') : (G.netColor || 'red');
  var i = ENGINE.info || {};
  var st = G.state;

  var main = el('span','sc','评估中…');
  main.style.color = '#8a7965';

  if(i.score != null && st){
    /* 用「本次评估时是谁在走」换算，不能用 st.turn（落子后已换边，会把优劣说反） */
    var mover = i.side || st.turn;
    var mine = (mover === myColor) ? i.score : -i.score;
    var mate = null;
    if(i.mate != null) mate = (mover === myColor) ? i.mate : -i.mate;
    var f = fmtScore(mine, mate);
    main.textContent = f.txt;
    main.style.color = f.cls;
  } else if(st && st.over){
    var w = st.over.winner;
    if(w){
      if(w === myColor){ main.textContent='你赢了'; main.style.color='#4fd47a'; }
      else { main.textContent='你输了'; main.style.color='#e85444'; }
    } else { main.textContent='和棋'; main.style.color='#e8c88a'; }
  }
  box.appendChild(main);

  var meta = el('span','meta','');
  var parts = [];
  if(i.depth) parts.push('深度 ' + i.depth);
  if(i.hashfull) parts.push('置换表 ' + Math.round(i.hashfull/10) + '%');
  if(parts.length) meta.textContent = parts.join(' · ');
  box.appendChild(meta);

  if(ENGINE.worker){
    var thr = el('span','thr' + (ENGINE.variant === 'mt' ? ' mt' : ' st'),
      ENGINE.variant === 'mt' ? ('多线程 · ' + ENGINE.threads + ' 线程') : '单线程 · 1 线程');
    box.appendChild(thr);
  }
}

function updateStatus(){
  var st = document.getElementById('status'); if(!st) return;
  var s=G.state; if(!s){ st.textContent=''; return; }
  st.innerHTML='';
  if(isOver(s.over)){
    var w=s.over.winner;
    var txt = (s.over.result==='draw80') ? '和棋（连续80步无吃子）' : (s.over.result==='drawMax') ? '和棋（200回合上限）'
      : ('<b>'+(w==='red'?'红方':'黑方')+'胜</b> · ' + (s.over.result==='checkmate'?'将死':s.over.result==='stalemate'?'困毙':'认输'));
    st.innerHTML = txt;
    return;
  }
  var turnTxt = s.turn==='red' ? '红方走' : '黑方走';
  var who = G.mode==='pve' ? (s.turn===G.humanColor?'（你）':'（AI思考中）') : (s.turn===G.netColor?'（你）':'（对手）');
  var extra='';
  if(s.over && s.over.result==='check'){
    extra=' · <b>将军</b>';
    if(G._lastCheckPly !== s.ply){ G._lastCheckPly = s.ply; Snd.check(); }
  }
  var noCapTxt = s.noCap>=60 ? (' · 无吃子'+s.noCap+'/80') : '';
  st.innerHTML = turnTxt + who + extra + noCapTxt;
  updateCaps();
}

function updateCaps(){
  try{ updateScoreBar(); }catch(e){}
  var box=document.getElementById('caps'); if(!box) return;
  box.innerHTML='';
  var view = G.viewState || G.state; if(!view) return;
  ['red','black'].forEach(function(col){
    var grp=el('div','grp');
    grp.appendChild(el('span','', col==='red'?'红失：':'黑失：'));
    var list = view.captures.filter(function(c){ return c.owner===col; });
    if(list.length===0){ grp.appendChild(el('span','','—')); }
    list.forEach(function(c){
      var cls = 'pc' + (col==='black'?' bk':'') + (c.role===null?' dk':'');
      var sp=el('span',cls, c.role===null ? '?' : (Rules.ROLE_CN[c.role]?Rules.ROLE_CN[c.role][col]:'?'));
      grp.appendChild(sp);
    });
    box.appendChild(grp);
  });
}

/* 通用弹窗：btns = [{txt, pri, fn}]，按数组顺序从左到右排列。
   confirmBox / askBox / infoBox 都由此派生，避免三份几乎相同的建窗代码。 */

function modalBox(msg, btns){
  var mask=el('div','mask');
  var m=el('div','modal');
  m.appendChild(el('h3','',msg));
  var row=el('div','row');
  (btns||[]).forEach(function(b){
    var btn=el('button','btn'+(b.pri?' pri':''), b.txt);
    btn.onclick=function(){ mask.remove(); b.fn && b.fn(); };
    row.appendChild(btn);
  });
  m.appendChild(row); mask.appendChild(m);
  document.body.appendChild(mask);
  return mask;
}

function confirmBox(msg, fn){
  return modalBox(msg, [
    { txt:'取消' },
    { txt:'确定', pri:true, fn:fn }
  ]);
}

function askBox(msg, yesTxt, onYes, noTxt, onNo){
  return modalBox(msg, [
    { txt: noTxt||'取消', fn: onNo },
    { txt: yesTxt||'确定', pri:true, fn: onYes }
  ]);
}
function infoBox(msg){
  return modalBox(msg, [ { txt:'知道了', pri:true } ]);
}


function feedbackMove(evt){
  if(evt && evt.revealed){ Snd.reveal(); return; }
  if(evt && evt.captured){ Snd.capture(); return; }
  Snd.move();
}

/* 双击改子：仅人机模式。兵种按钮复用 Board.drawPiece 画到小 canvas 上，
   与棋盘上的棋子外观完全一致；红/黑互斥，当前所属方亮灯且不可点。将/帅不可改。 */
var EDIT_ROLES = ['chariot','horse','cannon','elephant','advisor','soldier'];
function boardTapAt(px, py){
  if(!G.state) return;
  if(G.loading){ toast('引擎加载中，请稍候'); return; }
  if(G.mode==='pvp' && G.phase!=='playing'){
    if(G.oppGone) toast('对手已离场');
    else if(!ON.on) toast('尚未进入房间');
    else toast('双方都点「准备」后才能开始');
    return;
  }
  if(isOver(G.state.over)) return;
  var myColor = G.mode==='pve' ? G.humanColor : G.netColor;
  if(G.state.turn !== myColor) { toast('还没到你的回合'); return; }
  if(G.thinking) return;
  var idx = Board.pick(px, py);
  if(idx<0) return;
  var p = G.state.board[idx];
  if(G.sel!==null && G.moves.indexOf(idx)>=0){
    var mf = G.sel;
    doMove(mf, idx);
    if(G.mode==='pvp') netSend({t:'move', from:mf, to:idx});
    return;
  }
  /* 双击改子：仅人机模式。放在走子判断之后，避免把「双击落点走子」误判成改子 */
  if(G.mode==='pve'){
    var now = Date.now();
    if(idx === Board.lastEditIdx && now - Board.lastEditT < 350){
      Board.lastEditIdx = -1; Board.lastEditT = 0;
      openPieceEditor(idx);
      return;
    }
    Board.lastEditIdx = idx; Board.lastEditT = now;
  }
  if(p && p.color===myColor){
    G.sel = idx;
    G.moves = Rules.legalMoves(G.state, idx);
    log('D','选中棋子', { idx:idx, uci:Rules.idxToUci(idx), moves:G.moves.length });
    Snd.tap();
    Board.draw();
  } else {
    G.sel=null; G.moves=[]; Board.draw();
  }
}
function onBoardClick(ev){
  if(!Board.cv) return;
  /* 触摸已自行判定并消费，忽略随后合成的 click，否则同一次点按会被处理两遍
     （走子后又把落点棋子选中） */
  if(Board.lastTap && Date.now() - Board.lastTap < 600) return;
  var rect = Board.cv.getBoundingClientRect();
  boardTapAt(ev.clientX - rect.left, ev.clientY - rect.top);
}
/* 触摸自判定：不再依赖浏览器合成 click。
   iOS 上合成 click 有约 300ms 延迟，且一旦 touchmove 被 preventDefault 就根本不合成
   （此前 SwipeGuard 全屏拦截，手指横移 15px 即吞掉点击，表现为「点了不走子」）。
   这里按下→抬起位移不超过 TAP_SLOP 即判定为点击，并即时给出按下高亮。 */
var TAP_SLOP = 24;
/* 按钮同样补一层触摸自判定：浏览器在手指位移超过自身容差时就不合成 click
   （实测 dx≥22 即被吞），点按会整段丢失。这里在 touchend 后等一小会儿，
   若浏览器确实没派发 click，再主动补一次，绝不会重复触发。 */
(function bindTapFallback(){
  var pend=null;
  document.addEventListener('touchstart', function(e){
    if(!e.touches || e.touches.length!==1){ pend=null; return; }
    var t=e.target, el=null;
    while(t && t!==document){ if(t.tagName==='BUTTON'){ el=t; break; } t=t.parentNode; }
    pend = el ? { el:el, x:e.touches[0].clientX, y:e.touches[0].clientY } : null;
  }, {passive:true, capture:true});
  document.addEventListener('touchmove', function(e){
    if(!pend || !e.touches || !e.touches.length) return;
    var t=e.touches[0];
    if(Math.abs(t.clientX-pend.x) > TAP_SLOP || Math.abs(t.clientY-pend.y) > TAP_SLOP) pend=null;
  }, {passive:true, capture:true});
  document.addEventListener('touchend', function(){
    if(!pend) return;
    var el=pend.el, fired=false;
    pend=null;
    var once=function(){ fired=true; };
    el.addEventListener('click', once, {capture:true, once:true});
    setTimeout(function(){
      try{ el.removeEventListener('click', once, true); }catch(_){}
      if(!fired && document.contains(el)){ try{ el.click(); }catch(_){} }
    }, 320);
  }, {passive:true, capture:true});
})();
function bindBoardTap(cv){
  var sx=0, sy=0, down=false, moved=false;
  function at(e){
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    var r = cv.getBoundingClientRect();
    return [t.clientX - r.left, t.clientY - r.top];
  }
  function onDown(e){
    if(e.touches && e.touches.length>1) { down=false; return; }
    var p = at(e); sx=p[0]; sy=p[1]; down=true; moved=false;
    var idx = Board.pick(p[0], p[1]);
    if(idx>=0 && idx!==Board.pressIdx){ Board.pressIdx=idx; Board.draw(); }
  }
  function onMove(e){
    if(!down) return;
    var p = at(e);
    if(Math.abs(p[0]-sx) > TAP_SLOP || Math.abs(p[1]-sy) > TAP_SLOP){
      moved = true;
      if(Board.pressIdx>=0){ Board.pressIdx=-1; Board.draw(); }
    }
  }
  function onUp(e){
    if(!down) return;
    down=false;
    var wasMoved = moved;
    var idx = Board.pressIdx;
    if(Board.pressIdx>=0){ Board.pressIdx=-1; Board.draw(); }
    if(wasMoved) return;
    var p = at(e);
    if(Math.abs(p[0]-sx) > TAP_SLOP || Math.abs(p[1]-sy) > TAP_SLOP) return;
    Board.lastTap = Date.now();
    boardTapAt(p[0], p[1]);
  }
  cv.addEventListener('touchstart', onDown, {passive:true});
  cv.addEventListener('touchmove', onMove, {passive:true});
  cv.addEventListener('touchend', onUp, {passive:true});
  cv.addEventListener('touchcancel', function(){ down=false; if(Board.pressIdx>=0){ Board.pressIdx=-1; Board.draw(); } }, {passive:true});
  if(window.PointerEvent){
    cv.addEventListener('pointerdown', function(e){ if(e.pointerType==='mouse'){ onDown(e); } }, {passive:true});
    cv.addEventListener('pointerup', function(e){ if(e.pointerType==='mouse'){ onUp(e); } }, {passive:true});
  }
}

/* ===== 改子：人机模式下双击棋子（或空格）弹出 ===== */
var EDIT_ROLES = ['chariot','horse','cannon','elephant','advisor','soldier'];
function drawPieceIcon(cv, p, size){
  var dpr = window.devicePixelRatio||1;
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr);
  cv.style.width=size+'px'; cv.style.height=size+'px';
  var cx=cv.getContext('2d');
  cx.setTransform(dpr,0,0,dpr,0,0);
  /* 直接复用棋盘棋子的绘制代码：只把坐标函数换成「永远居中」，不改动 Board 自身状态 */
  Board.drawPiece.call({ ctx:cx, cell:size, xy:function(){ return [size/2, size/2]; } }, 0, p);
}
function openPieceEditor(idx){
  if(G.mode!=='pve' || !G.state) return;
  var p = G.state.board[idx];
  if(p && p.role==='general'){ toast('将（帅）不能修改'); return; }
  var color = p ? p.color : G.humanColor;
  var old = document.querySelector('.editbox');
  if(old && old.parentNode) old.parentNode.remove();      /* 连开时先收掉上一个，避免遮罩叠加 */
  var host = document.getElementById('stage') || document.body;
  var mask = el('div','mask');
  var box = el('div','editbox');
  box.appendChild(el('div','tip', (p?'修改此子 · ':'新增棋子 · ') + Rules.idxToUci(idx)));
  var r1 = el('div','edrow'), btns=[];
  EDIT_ROLES.forEach(function(role){
    var btn = el('button','pbtn');
    var cv = document.createElement('canvas');
    btn.appendChild(cv);
    btn.setAttribute('data-role', role);
    btns.push(btn); r1.appendChild(btn);
  });
  box.appendChild(r1);
  var r2 = el('div','swrow'), sw={};
  ['red','black'].forEach(function(c){
    var btn = el('button','swbtn');
    btn.appendChild(el('i','led'));
    btn.appendChild(el('span','', c==='red'?'红':'黑'));
    sw[c]=btn; r2.appendChild(btn);
  });
  box.appendChild(r2);
  box.appendChild(el('div','tip','点棋子即生效，可连改多个；点框外关闭'));
  mask.appendChild(box);
  host.appendChild(mask);
  function setColor(c){
    color = c;
    ['red','black'].forEach(function(k){
      var on = (k===color);
      sw[k].classList.toggle('on', on);   /* 灯亮 + 醒目边框 */
      sw[k].disabled = on;                /* 当前所属方不可再点，点另一方才切换 */
    });
    btns.forEach(function(btn){
      drawPieceIcon(btn.querySelector('canvas'), { color:color, role:btn.getAttribute('data-role'), faceDown:false }, 38);
    });
  }
  ['red','black'].forEach(function(c){
    sw[c].addEventListener('click', function(e){
      e.stopPropagation();
      if(c===color) return;
      setColor(c); Snd.tap();
    });
  });
  btns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      applyEdit(idx, color, btn.getAttribute('data-role'));
      Snd.tap();
    });
  });
  mask.addEventListener('click', function(e){ if(e.target===mask) mask.remove(); });
  setColor(color);
}
function applyEdit(idx, color, role){
  G.history.push(Rules.clone(G.state));                    /* 存档，改坏了可悔棋 */
  G.state.board[idx] = { color:color, role:role, faceDown:false };
  G.sel=null; G.moves=[];
  G.viewState = Rules.viewFor(G.state, G.humanColor);
  Board.draw(); updateStatus();
  log('I','改子', { uci:Rules.idxToUci(idx), color:color, role:role });
}
function doMove(from, to){
  var legal = Rules.legalMoves(G.state, from);
  if(legal.indexOf(to)<0){ log('W','非法走法被拒绝',{from:from,to:to}); toast('非法走法'); return; }
  G.history.push(Rules.clone(G.state));
  var res = Rules.applyMove(G.state, from, to);
  G.state = res.state;
  G.sel=null; G.moves=[];
  G.viewState = Rules.viewFor(G.state, G.humanColor);
  log('I','玩家走子', { uci:Rules.idxToUci(from)+Rules.idxToUci(to), from:from, to:to,
    revealed:res.evt.revealed, captured:res.evt.captured });
  feedbackMove(res.evt);
  Board.draw(); updateStatus();
  if(isGameOver()) return;
  if(G.mode==='pve') setTimeout(aiTurn, 260);
}


function isOver(o){
  return !!o && (o.result==='checkmate'||o.result==='stalemate'||o.result==='draw80'||o.result==='drawMax'||o.result==='resign');
}
function isGameOver(){
  var o=G.state.over; if(!o) return false;
  if(isOver(o)){
    log('I','对局结束', o);
    setTimeout(function(){ showResult(o); }, 200);
    return true;
  }
  return false;
}
function showResult(o){
  var txt = (o.result==='draw80') ? '和棋（连续80步无吃子）'
    : (o.result==='drawMax') ? '和棋（达到200回合上限）'
    : (o.winner==='red'?'红方胜':'黑方胜') + '（' + (o.result==='checkmate'?'将死':o.result==='stalemate'?'困毙':'认输') + '）';
  var mine = G.mode==='pve' ? G.humanColor : G.netColor;
  var note='';
  if(o.winner){ note = (o.winner===mine) ? ' 你赢了' : ' 你输了'; }
  if(!o.winner){ Snd.draw(); }
  else if(o.winner===mine){ Snd.win(); }
  else { Snd.lose(); }
  if(G.mode==='pvp'){
    infoBox(txt + note + '\n重新开始请退出房间再进');
    return;
  }
  confirmBox(txt + note, function(){
    G.state=Rules.newGame(); G.sel=null; G.moves=[]; G.ponder=null; G.history=[];
    G.viewState=Rules.viewFor(G.state,G.humanColor);
    Board.draw(); updateStatus();
    if(G.aiColor==='red') setTimeout(aiTurn,300);
  });
}

function doUndo(){
  if(G.mode!=='pve'||!G.state){ return; }
  if(G.thinking){ toast('AI 正在思考，请稍候'); return; }
  if(!G.history.length){ toast('没有可悔的棋'); return; }
  // 回退到"轮到我走"的最近一个局面（撤销 AI 一步 + 自己一步）
  var target=null;
  while(G.history.length){
    var h=G.history.pop();
    if(h.turn===G.humanColor){ target=h; break; }
  }
  if(!target){ toast('没有可悔的棋'); return; }
  ENGINE.stop();
  G.state=target; G.sel=null; G.moves=[]; G.ponder=null;
  G.viewState=Rules.viewFor(G.state,G.humanColor);
  log('I','悔棋', { backToPly:G.state.ply });
  Snd.undo();
  Board.draw(); updateStatus(); toast('已悔棋');
}

function doHint(){
  if(G.mode!=='pve') return;
  if(G.state.turn!==G.humanColor){ toast('等AI走完'); return; }
  G.thinking=true; updateStatus();
  var fen = Rules.toFen(G.state, G.humanColor);
  ENGINE.search(fen, { movetime:1500 }).then(function(r){
    G.thinking=false;
    if(r.best){
      var from=Rules.uciToIdx(r.best.slice(0,2)), to=Rules.uciToIdx(r.best.slice(2,4));
      if(from>=0&&to>=0){
        G.sel=from; G.moves=Rules.legalMoves(G.state,from);
        Board.draw();
        toast('建议：'+Rules.idxToUci(from)+'→'+Rules.idxToUci(to), 2500);
        log('I','AI提示', { best:r.best });
      }
    } else toast('引擎未给出建议');
    updateStatus();
  }).catch(function(e){ G.thinking=false; log('E','提示失败',{msg:e.message}); toast('提示失败'); updateStatus(); });
}

async function startPve(){
  clearApp();
  G.mode='pve';
  G.humanColor = G.humanColor||'red';
  G.aiColor = Rules.other(G.humanColor);
  G.flip = (G.humanColor==='black');
  G.state = Rules.newGame();
  G.sel=null; G.moves=[]; G.thinking=false; G.ponder=null;
  G.history=[]; G.viewState=Rules.viewFor(G.state, G.humanColor);
  G.loading='准备中…';
  renderGame();
  Board.resize(); Board.draw();
  updateStatus();
  var t0 = Date.now();
  function loadMsg(txt){
    pveLoading(txt + ' · 已用时 ' + ((Date.now()-t0)/1000).toFixed(0) + ' 秒');
  }
  try{
    await ENGINE.preload(loadMsg);
    G.loading = null;
    log('I','开始人机对局', { level:G.level, human:G.humanColor, engineSource:ENGINE.sourceLabel, fromCache:ENGINE.fromCache });
    updateStatus();
    if(G.aiColor==='red') setTimeout(aiTurn, 350);
  }catch(e){
    G.loading = null;
    try{ updateScoreBar(); }catch(e2){}
    log('E','启动人机失败',{msg:e.message});
    if(ENGINE.simdBlocked) return;   /* 已弹过 SIMD 专属提示，不再套一层"加载失败" */
    /* 左「返回」右「重试」：askBox 的按钮顺序就是 [noTxt, yesTxt]，直接复用即可 */

    askBox('引擎加载失败：' + e.message + '\n已用时 ' + ((Date.now()-t0)/1000).toFixed(1) + ' 秒',
      '重试', function(){
        ENGINE.ready=null; ENGINE.worker=null; ENGINE.lastError=null; startPve();
      }, '返回', renderHome);
  }
}




async function aiTurn(){
  if(G.mode!=='pve'||!G.state) return;
  if(G.state.turn!==G.aiColor) return;
  if(isOver(G.state.over)) return;
  G.thinking=true; updateStatus();
  var lv = LEVELS[G.level];
  if(ENGINE.hashFor !== G.level){
    /* 取「难度档位」与「线程建议值」的较大者。
       多线程共享一张置换表，表太小会让线程互相抢表、深度反降；
       不能因为换难度就把已按线程数调大的 Hash 又调小。 */

    await ENGINE.setHash(Math.max(HASH_OF(G.level), ENGINE.suggestedHash()));
    ENGINE.hashFor = G.level;
  }
  var fen = Rules.toFen(G.state, G.aiColor);
  log('I','AI思考', { fen:fen, level:G.level, opt: (lv.depth?('depth '+lv.depth):('movetime '+lv.movetime)) });

  var usedPonder=false, oldP=null, pr=null;
  if(G.ponder){
    oldP=G.ponder; G.ponder=null;
    if(oldP.fen === fen){ usedPonder=true; log('I','后台思考命中', { fen:fen }); }
    else log('I','后台思考未命中，停止', { ponderFen:oldP.fen, nowFen:fen });
    oldP.stop=true; ENGINE.stop();
    /* 关键：必须等旧搜索真正退出再发新搜索。
       mt 下若不等，新搜索会排在旧搜索后面排队，实测未命中卡 45 秒 */
    try{ pr = await oldP.promise; }catch(e){ pr=null; }
  }

  var r;
  try{
    if(usedPonder) r = pr;
    else r = await ENGINE.search(fen, lv.depth?{depth:lv.depth}:{movetime:lv.movetime});
  }catch(e){ log('E','AI搜索异常',{msg:e.message}); r=null; }

  G.thinking=false;
  /* 解析 + 非法兜底走公共函数（与机器人两条链路同一套逻辑） */

  var mv = pickEngineMove(G.state, G.aiColor, r && r.best);
  if(!mv){ updateStatus(); return; }
  if(!r || !r.best) log('W','引擎无结果，使用兜底走法', { mv:mv });
  else if(mv.fallback) log('W','引擎走法非法，兜底', { best:r.best });
  G.lastPonder = (r && r.ponder) || null;
  applyAi(mv.from, mv.to, mv.fallback);
}

function applyAi(from, to, fallback){
  G.history.push(Rules.clone(G.state));
  var res=Rules.applyMove(G.state, from, to);
  G.state=res.state;
  G.viewState=Rules.viewFor(G.state,G.humanColor);
  log('I','AI走子', { uci:Rules.idxToUci(from)+Rules.idxToUci(to), revealed:res.evt.revealed,
    captured:res.evt.captured, fallback:fallback });
  feedbackMove(res.evt);
  Board.draw(); updateStatus();
  if(isGameOver()) return;
  
  /* 注意：G.state.over 恒为对象（{result:null,winner:null}），直接取反永远是 false，
     后台思考会永远启动不了 —— 必须用 isOver() 判断 */
  if(LEVELS[G.level].ponder && !isOver(G.state.over)){
    startPonder();
  }
}


/* 后台思考：把你思考的时间白送给 AI。
   预测着法直接用引擎上次 bestmove 免费附带的 ponder 字段，省掉原来那次 400ms 浅搜。
   单线程 wasm 在 Worker 内同步搜索、中途 stop 无效（实测 6 秒发 stop、78 秒才回），
   所以单核切成 3 秒一段的循环：每段结束都是检查点，你走子后最多等 3 秒就能接管；
   深度封顶 38 层（256MB 实测 30 秒到 38 层）。
   多线程 stop 实测 1ms 生效，可直接 go depth 40。 */
async function startPonder(){
  try{
    /* 预测着法优先用引擎上次 bestmove 免费附带的 ponder（省一次 400ms 浅搜）；
       但它可能缺失（PV 太短）或在我方规则下不合法，这两种情况都退回浅搜，保证后台思考必定启动 */
    var pm = G.lastPonder;
    var f = pm?Rules.uciToIdx(pm.slice(0,2)):-1, t = pm?Rules.uciToIdx(pm.slice(2,4)):-1;
    if(!pm || f<0 || t<0 || Rules.legalMoves(G.state,f).indexOf(t)<0){
      var pr = await ENGINE.search(Rules.toFen(G.state, G.humanColor), { movetime:400 });
      pm = pr && pr.best;
      f = pm?Rules.uciToIdx(pm.slice(0,2)):-1; t = pm?Rules.uciToIdx(pm.slice(2,4)):-1;
    }
    if(!pm || f<0 || t<0 || Rules.legalMoves(G.state,f).indexOf(t)<0) return;
    var fenP = Rules.toFen(Rules.applyMove(G.state,f,t).state, G.aiColor);
    log('I','启动后台思考', { predict:pm, fen:fenP });
    var h = { fen:fenP, stop:false };
    G.ponder = h;
    h.promise = ponderSeg(fenP, h);
  }catch(e){ log('W','后台思考启动失败',{msg:e.message}); }
}
/* 单核分片后台思考：每段 3 秒，段间检查「你已走子」或「够深了」 */
async function ponderSeg(fenP, h){
  var r=null;
  for(var k=0;k<12;k++){
    r = await ENGINE.search(fenP, { movetime:3000 });
    if(!G.ponder || G.ponder!==h || h.stop) break;
    if((ENGINE.info.depth||0) >= 38) break;
  }
  return r;
}


window.UI = UI;
/* 调试出口：诊断日志可直接读它，真机排查时也能在控制台看内部状态 */
window.__JQ = { G:G, ENGINE:ENGINE, Rules:Rules, Board:Board, LEVELS:LEVELS, ST:ST, Snd:Snd,
  doMove:doMove, doUndo:doUndo, doHint:doHint, aiTurn:aiTurn, renderPveSetup:renderPveSetup, showMenu:showMenu };
UI.init();
})();
