<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>揭棋 · 模式选择</title>
<style>
/* 纯黑背景板 + 居中竖排厚板 3D 菜单 + 右上设置 + 右下全屏键 */
:root{
  --ink2:#e8dfc8; --line:rgba(245,239,224,.30); --acc:#ffb44a; --txt:#f5efe0; --dim:#a49e8e;
  --sh:3px 3px 0 rgba(0,0,0,.42);
  --hand:"LXGW WenKai","XiaWuWenKai","楷体","KaiTi","STKaiti","楷体_GB2312","Comic Sans MS",cursive;
  --r1:255px 14px 225px 16px/16px 225px 14px 255px;
  --r2:14px;
  /* 底板尺寸由 JS 冻结成 px，其余尺寸一律由它派生 */
  --plateW:100vw; --plateH:100vh;
  --btnH:clamp(64px, calc(var(--plateH) * .105), 88px);
  --btnGap:clamp(10px, calc(var(--plateH) * .016), 16px);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000;color:var(--txt);
  font-family:var(--hand),-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
  -webkit-touch-callout:none;-webkit-user-drag:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}

/* 刚体模型：整块版面放进尺寸冻结的 #plate，内部只用 px/百分比，不依赖视口。
   #dock 只抵消「视口顶边的位移」，于是视口怎么长，底板内一切纹丝不动。 */
#dock{position:fixed;left:0;top:0;width:100%;height:100%;z-index:45;pointer-events:none;
  transform:translate3d(0, calc(-1 * var(--fsdy,0px)), 0);
  will-change:transform;backface-visibility:hidden}
#plate{position:absolute;left:0;top:0;width:var(--plateW);height:var(--plateH);pointer-events:none}

#head{position:absolute;left:0;right:0;top:8%;padding:0 24px;text-align:center}
/* 游戏名：实体厚度立体（8 层递进侧壁 + 金色柔光），与按钮的厚板 3D 同一套语言。
   厚度靠 text-shadow 逐层压暗堆叠，是能看见的侧壁，不是渐变或投影。
   字号由底板高度派生（clamp 36~56px），各屏宽实测墨迹不溢出、不撞菜单。
   --txt 仍被 body / .dhead h3 / #toast 使用，未被本条改动孤立。 */
/* 游戏名 = 按钮文字 08 款的放大版：色值、字重、字距、挤出阴影与 .mbtn b 逐项一致，
   只有 font-size 不同。原先那套 8 层垂直厚块 + 金色柔光已整体移除。 */
#head h1{margin:0;font-size:clamp(36px, calc(var(--plateH) * .069), 56px);
  letter-spacing:.06em;font-weight:700;color:#ffe9c2;
  text-shadow:1px 1px 0 #a8722a, 2px 2px 0 #8a5c1e, 3px 3px 0 #6c4716, 4px 4px 5px rgba(0,0,0,.6)}
#head .sub{margin:8px 0 0;font-size:11px;line-height:1.7;color:var(--dim)}
/* 菜单整体上移一个按钮的高度（54% − btnH）。
   max() 右半为防碰撞下限：首键顶边至少离标题底边 12px，窄屏标题换行变高时自动少上移。 */
/* 菜单下移一个按钮高（--btnH），给标题腾空间（原为 54% - btnH 上移一个按钮）。
   两个下限取 max 防碰撞：
   1) 上：标题底 + 12px + 菜单半高 —— 标题换行变高时自动少上移（沿用原有约束）
   2) 下：菜单底 ≤ 底栏顶(底板高 - 66px - sib) - 8px —— 保险下限，防止将来
      标题变矮或菜单变高时压到底栏；当前六屏宽均未触发（余量 47~150px）。
   注：320 小屏实测只下移 19px 而非 64px —— 该屏标题换行成两行(82px高)，
      改前菜单本就被"标题底+12"的上约束顶住，下移只是回到 54%，属预期。 */
#menu{position:absolute;left:50%;transform:translate(-50%,-50%);
  top:max(calc(8% + var(--headH,64px) + 12px + var(--menuH,352px) / 2),
          min(54%, calc(var(--plateH) - 66px - var(--sib,0px) - 8px - var(--menuH,352px) / 2)));
  width:min(300px, calc(var(--plateW) - 44px));
  display:flex;flex-direction:column;gap:var(--btnGap)}

/* ---------- 按钮骨架：厚板挤出 3D，皮肤只换 --s-bg / --s-wall ---------- */
.mbtn{position:relative;overflow:hidden;pointer-events:auto;
  width:100%;min-height:var(--btnH);padding:8px 12px;border-radius:var(--r2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:inherit;color:var(--ink2);
  background-image:var(--s-bg,linear-gradient(180deg,#7e5634,#5e4026 55%,#402c19));
  background-color:var(--s-wall,#523820);
  --s-hih:36%;
  /* 侧壁 fallback：老浏览器不支持 color-mix 时，至少保住一层厚度 */
  box-shadow:0 8px 0 var(--s-wall,#523820),0 11px 14px -3px rgba(0,0,0,.6);
  transition:transform .12s ease,box-shadow .12s ease;
  border:0}
/* 8 层递进实色侧壁：由单个 --s-wall 经 color-mix 逐层压暗算出，
   避免为每种皮肤各写 8 层。不支持 color-mix 的内核自动回落到上面的单层。 */
.mbtn{box-shadow:
  0 1px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 92%, #000),
  0 2px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 84%, #000),
  0 3px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 76%, #000),
  0 4px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 68%, #000),
  0 5px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 60%, #000),
  0 6px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 52%, #000),
  0 7px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 44%, #000),
  0 8px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 36%, #000),
  0 11px 14px -3px rgba(0,0,0,.6)}
/* 清漆高光条：--s-hih 为 0 时自然不可见 */
.mbtn::before{content:'';position:absolute;left:0;right:0;top:0;height:var(--s-hih,0);
  background:var(--s-hi,linear-gradient(180deg,rgba(255,230,196,.26),transparent));border-radius:var(--s-hir,0);pointer-events:none}
/* 按下：整体下沉 + 侧壁塌陷，像真按进面板里 */
.mbtn:active{transform:translate(2px,2px);
  box-shadow:0 2px 0 var(--s-wall,#8a5f22),0 3px 6px rgba(0,0,0,.55)}
.mbtn:active{box-shadow:
  0 1px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 84%, #000),
  0 2px 0 color-mix(in srgb, var(--s-wall,#8a5f22) 60%, #000),
  0 3px 6px rgba(0,0,0,.55)}
/* 按下态：:active 手指一抬就没了，切页又是瞬时的，等于动画白做。
   改用 .pressed 类由 JS 加上、切页完成后再移除，配合上面的 transition 才看得见下沉过程。 */
.mbtn.pressed{transform:translate(2px,2px);
  box-shadow:0 2px 0 var(--s-wall,#8a5f22),0 3px 6px rgba(0,0,0,.55)}
/* 文字款色固定为 08：香槟色 + 1/2/3px 棕色阶梯挤出 + 4px 投影 */
.mbtn b{position:relative;font-size:19px;font-weight:700;letter-spacing:.06em;color:#ffe9c2;
  text-shadow:1px 1px 0 #a8722a,2px 2px 0 #8a5c1e,3px 3px 0 #6c4716,4px 4px 5px rgba(0,0,0,.6)}
.mbtn span{position:relative;font-size:12px;color:var(--dim);opacity:.95}
/* ---------- 返回大厅键：jieqi.html 的 .hall 款 ---------- */
/* 款一字不差：120° 金渐变描边 + 双背景层(padding-box,border-box) + sheen 流光 +
   金色箭头（按下左移 4px）+ #1d1710 深底。尺寸拉到与另外三键一致（300x81）。
   三处适配（都是"尺寸/观感"，不动款）：
   1) max-width:280px 不抄 —— 会变窄 20px，本页保持 300
   2) padding:20px → 14px 16px + line-height:1.15 —— 20px 会撑到 98px 高；
      14px 配副标题 margin-top:2px 实测精确落在 81px，与另外三键齐平，
      上下留白 20px（原版 22px，观感一致）
   3) 关掉 .mbtn::before 的清漆高光 —— 那是木纹按钮的，糊在 hall 上会把它洗成棕灰色
   文字沿用本页固定的 08 款（香槟色 + 棕色阶梯挤出）。 */
.hall{position:relative;overflow:hidden;
  flex-shrink:0;padding:14px 16px;line-height:1.15;
  font-size:19px;font-weight:600;cursor:pointer;
  background:#1d1710;
  border:2px solid transparent;
  background-image:linear-gradient(#1d1710,#1d1710),
    linear-gradient(120deg,#7a5a2a,#e8c274 25%,#fff0c4 45%,#e8c274 65%,#7a5a2a);
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 2px 10px rgba(0,0,0,.4)}
.hall .arw{display:inline-block;margin-right:10px;color:#e8c274;font-weight:700;
  transition:transform .18s}
.hall:active .arw{transform:translateX(-4px)}
.hall.pressed .arw{transform:translateX(-4px)}
.hall:active{background-image:linear-gradient(#2a2118,#2a2118),
  linear-gradient(120deg,#7a5a2a,#e8c274,#fff0c4,#e8c274,#7a5a2a)}
.hall .d{display:block;font-size:12px;font-weight:400;color:#9d8a6c;margin-top:2px}

.hall .sheen{position:absolute;top:-60%;left:-40%;width:40%;height:220%;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,240,200,.28),rgba(255,255,255,0));
  transform:translate3d(0,0,0) rotate(18deg);animation:hallSheen 3.5s ease-in-out infinite}
/* 原版：0%{left:-40%} 55%{left:130%} 100%{left:130%}，位移 170% 按钮宽且纯水平。
   用 transform 走合成层（原版 left 动画实测 1.2 秒 78 次重排），等价位移 425%
   （sheen 自身宽 40%，425%×40% = 170%）。
   顺序必须是 translate3d 在 rotate 之前：CSS 的 transform 函数从右往左作用于点，
   写成 rotate(...) translate(...) 会把平移方向也旋转 18°，实测垂直位移 +156px
   （按钮高才 81px），流光斜着掉出按钮——就是"走到一半往下掉"。 */
@keyframes hallSheen{
  0%{transform:translate3d(0,0,0) rotate(18deg)}
  55%{transform:translate3d(425%,0,0) rotate(18deg)}
  100%{transform:translate3d(425%,0,0) rotate(18deg)}
}
@media (prefers-reduced-motion:reduce){ .hall .sheen{animation:none;opacity:0} }
/* 清漆高光是木纹按钮的，hall 上会把它洗成棕灰色：关掉 */
.hall::before{display:none}

/* 三个固定角/行元素：位置只由冻结的安全区决定 */
#btnSet,#btnFs{position:absolute;pointer-events:auto;width:44px;height:44px;border-radius:var(--r2);z-index:50;
  background:rgba(0,0,0,.5);border:2px solid var(--line);color:var(--ink2);
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--sh)}
/* 齿轮：换成 jieqi.html 的 .gear 款（34x34 正圆 · #3c2f22 底 · #55432f 金棕边 · #e8b872 金色），
   位置沿用本页冻结安全区（不用 env()，否则会破坏全屏锚定）。
   ::after 把触摸热区撑到 44x44 —— 34 小于触摸目标建议最小值，手指容易落空。 */
#btnSet{top:calc(22px + var(--sit,0px));right:calc(22px + var(--sir,0px));
  width:34px;height:34px;border-radius:50%;
  background:#3c2f22;border:1px solid #55432f;color:#e8b872;font-size:17px;
  box-shadow:0 2px 6px rgba(0,0,0,.5)}
#btnSet::after{content:'';position:absolute;left:-5px;top:-5px;right:-5px;bottom:-5px;border-radius:50%}
#btnSet:active{background:#55432f;transform:translate(2px,2px);
  box-shadow:1px 1px 0 rgba(0,0,0,.38);border-width:2.5px}
#btnFs{right:calc(22px + var(--sir,0px));bottom:calc(22px + var(--sib,0px))}
#btnFs:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.38);border-width:2.5px}
#btnFs.on{background:rgba(255,180,74,.22);border-color:var(--acc);color:#ffe9c2}
/* 版本号宽度：左 24px；右侧留 70px 给全屏键（键本身 right:22 + 44 宽，即占右侧 66px）。
   原先左右各 80px 只剩 160px 可用宽，装不下「当前引擎：8核多线程 · Hash 256MB · 版本号v1.5.0」。
   改成左 24 / 右 70 后：390 屏可用 296px、320 屏 226px；再给 ≤340px 小屏降到 9px（最长文案 220px），
   六种文案都不截断，且 #ver 右边界（250）不与全屏键左边界（254）重叠。 */
#ver{position:absolute;left:24px;right:70px;bottom:calc(22px + var(--sib,0px));height:44px;
  line-height:44px;text-align:center;font-size:10px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
@media (max-width:340px){ #ver{font-size:9px} }
/* 版本号热区：#dock/#plate 是 pointer-events:none，#ver 会继承，导致压根点不到。
   这里不开 #ver 自身（它是横跨屏幕的 44px 宽条，点底部空白也会误计数），
   只给内层文字开 auto，热区 = 版本号文字 + 左右各 12px。 */
#ver b{pointer-events:auto;display:inline-block;padding:0 12px;font-weight:400}

/* ============ 设置抽屉：款式照抄 jieqi.html 的遮罩 + 右侧抽屉 ============ */
/* 关键：#mask 与 #panel 已从 #plate 内移到 #stage 下（#dock 平级）。
   #dock 带 transform（全屏顶边补偿），fixed 元素放进去会以 dock 为包含块而错位；
   放 #stage 下才能解析到视口，且全屏时 #stage 是 fullscreen 元素，抽屉照常可见。 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .22s;touch-action:none}
#mask.open{opacity:1;pointer-events:auto}
/* 测试模式抽屉：与设置抽屉同款参数（右侧滑出 .24s ease），仅 z-index 更高一层 */
#tmask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .22s;touch-action:none}
#tmask.open{opacity:1;pointer-events:auto}
#tpanel{position:fixed;top:0;right:0;bottom:0;width:86%;max-width:340px;background:#1e1812;
  border-left:1px solid #55432f;z-index:71;transform:translateX(100%);transition:transform .24s ease;
  display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y}
#tpanel.open{transform:translateX(0)}
.dit .tt span{white-space:pre-wrap;word-break:break-all}
#panel{position:fixed;top:0;right:0;bottom:0;width:86%;max-width:340px;background:#1e1812;
  border-left:1px solid #55432f;z-index:61;transform:translateX(100%);transition:transform .24s ease;
  display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y}
#panel.open{transform:translateX(0)}
.dhead{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:8px;
  padding:calc(12px + var(--sit,0px)) 14px 12px;border-bottom:1px solid #3a2e22}
.dhead h3{margin:0;font-size:16px;color:#e8b872;flex:1;font-weight:600}
#btnDClose{flex:0 0 38px;width:38px;height:32px;padding:0;font-size:15px;font-family:inherit;
  border-radius:8px;border:1px solid #55432f;background:#2b2318;color:#f2e8da}
#btnDClose:active{background:#3d3022}
/* 诊断日志按钮原在 .dfoot 最底部，浏览器 UI 一遮挡就点不到；移到标题栏水平居中（.dhead 已 relative）。
   绝对定位到标题栏正中：左边留够距离，点 ✕ 不会误触；也不再匹配 .dfoot button（那条是 flex:1 会撑满）。 */
#btnLog{position:absolute;left:50%;top:calc(12px + var(--sit,0px));transform:translateX(-50%);
  height:32px;padding:0 10px;font-size:12px;font-family:inherit;
  border-radius:8px;border:1px solid #55432f;background:#2b2318;color:#f2e8da;white-space:nowrap}
#btnLog:active{background:#3d3022}
.dbody{flex:1 1 auto;overflow-y:auto;padding:12px 14px calc(20px + var(--sib,0px));
  -webkit-overflow-scrolling:touch}
.dgrp{margin-bottom:16px}
.dgrp h4{margin:0 0 8px;font-size:13px;color:#c9a870;font-weight:600;letter-spacing:1px}
.dit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:#2c2318;margin-bottom:7px}
.dit-rng{flex-direction:column;align-items:stretch;gap:0;padding:10px 12px 12px}
.dit .tt{flex:1;min-width:0}
.dit .tt b{display:block;font-size:14px;font-weight:600;color:#f2e8da}
.dit .tt span{display:block;font-size:11px;color:#9c8a76;margin-top:2px;line-height:1.45}
.dit-hint{display:block;margin-top:6px;font-size:11px;color:#8a7965;line-height:1.5}
.sw{flex:0 0 46px;width:46px;height:26px;border-radius:13px;background:#4a3c2c;position:relative;
  transition:background .2s;border:1px solid #5d4a35;pointer-events:auto}
.sw.on{background:#a8642a;border-color:#c8813c}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#e8d5b0;transition:transform .2s}
.sw.on::after{transform:translateX(20px)}
/* 滑块：自绘 + Pointer Capture，照抄 jieqi.html 的做法。
   为什么弃用原生 input[type=range]：jieqi 源码注释实测——QQ浏览器（X5 内核 / Chrome 121）
   上原生 range 只在指针停留在控件矩形内时才响应，手指滑出那一条就断连，
   表现为「拖不动、只能跳到两端」。改法：自绘轨道与滑块头，
   用 pointerdown + setPointerCapture 全程接管手势，手指移出控件也只驱动它，直到松手。 */
.drng{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px}
.drng .lab{flex:0 0 auto;font-size:12px;color:#c9a870;min-width:44px}
.sld{flex:1;min-width:0;position:relative;height:44px;display:flex;align-items:center;
  touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.sld .trk{position:relative;flex:1;height:6px;border-radius:3px;background:#55432f}
.sld .fil{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#c8813c;pointer-events:none}
.sld .thb{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:#e8d5b0;border:1px solid #8a6a3a;pointer-events:none}
.dfoot{flex:0 0 auto;display:flex;gap:8px;padding:10px 14px calc(10px + var(--sib,0px));
  border-top:1px solid #3a2e22}
.dfoot button{flex:1;min-height:44px;font-size:13px;font-family:inherit;border-radius:8px;
  border:1px solid #55432f;background:#2b2318;color:#f2e8da}
.dfoot button:active{background:#3d3022}

#toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:120;max-width:86%;
  background:#232130;border:2px solid var(--line);border-radius:var(--r1);padding:9px 14px;
  font-size:12px;line-height:1.5;color:var(--txt);opacity:0;transition:opacity .2s;pointer-events:none;
  text-align:center;box-shadow:var(--sh)}
#toast.show{opacity:1}
#toast.ok{border-color:rgba(123,224,138,.7)}
#toast.bad{border-color:rgba(255,138,138,.7)}
#stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ==================== 游戏页：样式照抄 jieqi.html ==================== */

<!-- 启用跨源隔离（COOP/COEP），让 WebAssembly 多线程生效。
     GitHub Pages 无法自行设置响应头，故用 Service Worker 注入。
     注册代码内联：必须同步且先于主程序执行，否则主程序会先按单线程把引擎下载一遍，
     SW 再 reload 时又要重新下载多线程版，白白浪费一次流量。
     ./coi-sw.js 仍需保留在服务器上（浏览器要 fetch 它作为 SW 脚本）。

     各内核支持差异很大，按顺序逐个尝试、失败自动换下一个：
       require-corp   —— Chrome / Edge / Firefox 均支持（首选）
       credentialless —— 仅 Chrome / Edge；Firefox 会静默忽略该值（实测隔离不生效）
     Safari / 老内核两者都不支持时自动放弃，退回单线程，不影响使用。 -->
<script>
(function(){
  var KT='jieqi-coi-tried', KM='jieqi-coi-mode', KV='jieqi-coi-ver';
  var VER='3';                                   /* 版本号变更时清空旧尝试记录，避免脏状态卡死 */

  var ORDER=['require-corp','credentialless'];
  function get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
  function set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
  var RC='jieqi-coi-reloads', RMAX=4;              
  try{ if(get(KV)!==VER){ sessionStorage.removeItem(KT); sessionStorage.removeItem(KM); sessionStorage.removeItem(RC); set(KV,VER); } }catch(e){}
  function triedList(){ var t=[]; try{ t=JSON.parse(get(KT)||'[]'); }catch(e){ t=[]; } return Array.isArray(t)?t:[]; }
  function markTried(m){ var t=triedList(); if(t.indexOf(m)<0){ t.push(m); set(KT, JSON.stringify(t)); } }
  function nextMode(){ var t=triedList(); for(var i=0;i<ORDER.length;i++){ if(t.indexOf(ORDER[i])<0) return ORDER[i]; } return null; }

  try{
    if(window.crossOriginIsolated===true) return;          
    if(!('serviceWorker' in navigator) || !navigator.serviceWorker) return;
    if(!window.isSecureContext) return;                    

    /* 页面级校验，但有个关键前提：
       SW 需要「两次 reload」才生效 —— 第一次注册安装，第二次才真正接管并注入响应头。
       早期版本在第二次访问时 SW 尚未接管就把它判成失败，直接跳到下一个模式；
       而 Firefox 不支持 credentialless，于是彻底没戏，退回单线程。
       修法：只有当 SW 确实已接管（controller 存在）却仍未隔离，才判定该模式失败。 */

    var prev=get(KM);
    var hasController = !!navigator.serviceWorker.controller;
    if(prev && hasController){ markTried(prev); }
    

    var mode=nextMode();

    /* 页面 URL 上带 ?coi=require-corp 或 ?coi=credentialless 时强制指定模式。
       用途：某些内核在 require-corp 下动态创建的 pthread 子 Worker 会卡死，
       用 credentialless 反而正常。方便手动对比、定位问题。 */

    try{
      var qm = /(?:^|[?&])coi=([^&]*)/.exec(location.search);
      if(qm && qm[1]){
        var forced = decodeURIComponent(qm[1]);
        if(ORDER.indexOf(forced) >= 0){
          mode = forced;
          set(KM, mode);
          var t2 = triedList().filter(function(x){ return x !== mode; });
          set(KT, JSON.stringify(t2));
        }
      }
    }catch(e){}

    if(!mode){ set(KM,''); return; }                       
    set(KM, mode);
    set('jieqi-coi-ctrl', hasController ? '1' : '0');
    set('jieqi-coi-reg',  '1');

    navigator.serviceWorker.register('./coi-sw.js?coi='+encodeURIComponent(mode), {scope:'./'})
      .then(function(){ doReload(); })
      .catch(function(){});

    /* 无论当前有无 controller，都必须 reload 一次：
       新 SW 不会重新拉取已加载的文档头，只有下次导航才会带上 COOP/COEP。
       用「次数上限」而非「时间间隔」防跑飞——本地页面刷新可能只要 200ms，
       时间防抖会误杀必要的那一次跳转。 */

    function doReload(){
      var used=0; try{ used=parseInt(get(RC)||'0',10); }catch(e){}
      if(!isFinite(used)) used=0;
      if(used >= RMAX) return;
      set(RC, String(used+1));
      setTimeout(function(){ window.location.reload(); }, 60);
    }
  }catch(e){}
})();
</script>

<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const JIEQI_VER = '0.1.0';
const HALL_URL = 'https://kevin-jili.github.io/html-ck/jili-game.html';

let toastTimer = 0;
function toast(msg, kind) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.className = kind ? 'show ' + kind : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2200);
}

/* ============ 诊断日志：事件码 + 短键名压缩，环形缓冲 2000 条 ============ */
/* 设置状态：字段名与 jieqi.html 的 SETTINGS_DEFAULTS 一致，Snd 直接读它 */
const ST = { sound:true, volume:100 };
const PREF_KEY = 'jieqi-prefs-v1';
function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(ST)); }catch(e){} }
function loadPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    Object.keys(ST).forEach(k => { if(o[k] !== undefined) ST[k] = o[k]; });
  }catch(e){}
}
loadPrefs();

/* 导出文件名用的本地时间戳：YYYYMMDD_HHMMSS。
   ① 必须用本地时间而不是 toISOString()——后者是 UTC，东八区会整整差 8 小时。
   ② 时/分/秒之间不加冒号：实测 Chromium 下载时会把英文冒号强制替换成下划线，
      导致同一分钟内多次导出互相覆盖；紧凑写法各平台都是合法文件名。 */
function logStamp(){
  var d = new Date();
  var p2 = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_'
       + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
}

const LOG = {
  buf: [], t0: Date.now(), max: 2000, dropped: 0,
  // 环境头只在导出时生成一次，避免每条都写大段文本
  env() {
    const d = devicePixelRatio || 1, n = navigator;
    return ['JQ|' + JIEQI_VER,
      'ENV|w' + innerWidth + ' h' + innerHeight + ' scr' + screen.width + 'x' + screen.height +
        ' dpr' + d + ' vv' + (visualViewport ? Math.round(visualViewport.height) : 0),
      'CAP|fs' + (document.fullscreenEnabled ? 1 : 0) + ' wake' + (n.wakeLock ? 1 : 0) +
        ' ori' + (screen.orientation ? 1 : 0) +
        ' clip' + (n.clipboard ? 1 : 0) + ' tz' + (-new Date().getTimezoneOffset() / 60),
      'UA|' + (n.userAgent.match(/(Chrome|MicroMessenger|QQ|XiaoMi|Huawei|Safari|Firefox)\/[\d.]+/g) || ['?']).join(','),
      'T0|' + this.t0].join('\n');
  },
  add(code, msg) {
    const line = (Date.now() - this.t0) + '|' + code + (msg ? ' ' + msg : '');
    this.buf.push(line);
    if (this.buf.length > this.max) { this.buf.shift(); this.dropped++; }
  },
  dump() {
    const tail = '\n--\nDROP|' + this.dropped + ' TOTAL|' + (this.buf.length + this.dropped) +
      '\nCODES|I初始化 F全屏 T触摸 P面板 R滑块 L日志 E错误 V视口 M菜单 A帧 W警告 N跳转';
    return this.env() + '\n' + this.buf.join('\n') + tail;
  },
  copy() {
    const txt = this.dump();
    const done = () => { this.add('L', 'copy=' + txt.length + 'B'); toast('日志已复制（' + txt.length + ' 字节）', 'ok'); };
    // file:// 下 clipboard API 常不可用，textarea + execCommand 兜底
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(() => this._fallback(txt, done));
    } else this._fallback(txt, done);
  },
  _fallback(txt, done) {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { }
    ta.remove();
    if (ok) done(); else { this.add('E', 'copy_fail'); toast('复制失败，请改用下载', 'bad'); }
  },
  download() {
    const txt = this.dump();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
    a.download = '揭棋日志_' + logStamp() + '.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    this.add('L', 'dl=' + txt.length + 'B');
    toast('日志已下载（' + txt.length + ' 字节）', 'ok');
  },
  reset() { this.buf.length = 0; this.dropped = 0; this.t0 = Date.now(); this.add('L', 'reset'); }
};
window.onerror = (m, s, l, c, e) => LOG.add('E', 'msg=' + String(m).slice(0, 90) + ' @' + l + ':' + c);
window.addEventListener('unhandledrejection', (e) => LOG.add('E', 'rej=' + String(e.reason).slice(0, 90)));

const UI = {
  // _fsdyCur 必须显式初始化为 0：否则 rAF 首帧未跑时日志会打出 undefined
  _fsBusy: 0, _fsAt: 0, _fsArmed: false, _orientLocked: 0, wakeLock: null, _frames: 0, _fsdyCur: 0,

  init() {
    this._preloadMsg = null;
    this._engineFail = null;
    this._cacheInfo = null;
    this.refreshVer();
    this.freezeInsets();
    LOG.add('I', 'ver=' + JIEQI_VER + ' w' + innerWidth + ' h' + innerHeight + ' dpr' + (devicePixelRatio || 1));
    this.bind();
    window.addEventListener('resize', () => this.layout());
    window.addEventListener('orientationchange', () => setTimeout(() => this.layout(), 250));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => this.layout());
      window.visualViewport.addEventListener('scroll', () => this.layout());
    }
    this.layout();
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => { this.refreshFsBtn(); this.layoutAfterFs(); }));
    this.refreshFsBtn();
    LOG.add('I', 'ok');
    /* 打开游戏立即开始预载引擎（用户选 1B）：让进人机时引擎已就绪。
       有缓存时直接读 IndexedDB，不发网络请求；失败只更新页脚文案，不弹框打扰。 */
    this.startPreload();
    /* 缓存大小异步读一次，用于「未下载 / 已缓存 N KB」分支 */
    this.refreshCacheInfo();
  },

  /* ---------- 版本号 = 引擎状态 + 版本号（jieqi 的 menuFootText 思路）---------- */
  refreshVer() {
    const el = $('#ver'); if (!el) return;
    el.innerHTML = '<b>' + this.engFootText() + '</b>';
  },
  /* 加载进度文案压缩：引擎原始文案很长（如「正在从 9 个源并发下载引擎脚本（单线程）…」356px、
     「下载引擎核心 429KB · cdn.jsdelivr」316px），320 小屏可用宽只有 272px 会被省略号截断。
     这里抽关键量压成短语：进度优先取 KB 数，其余按语义给固定短词。 */
  compactMsg(m) {
    if (!m) return m;
    const kb = /(\d+)\s*KB/.exec(m);
    if (/多线程启动失败|改用单线程/.test(m)) return '降级单线程';
    if (/正在编译|编译引擎/.test(m)) return '编译中';
    if (/本地缓存/.test(m)) return '读缓存';
    if (/校验通过/.test(m)) return '校验中';
    if (/并发下载/.test(m)) return '下载中';
    if (/下载引擎核心/.test(m)) return kb ? (kb[1] + 'KB') : '下载中';
    if (/准备中|握手/.test(m)) return '启动中';
    return (m.length > 12) ? (kb ? (kb[1] + 'KB') : '加载中') : m;
  },
  engFootText() {
    let eng;
    if (typeof ENGINE !== 'undefined' && ENGINE.worker) {
      eng = (ENGINE.variant === 'mt')
        ? ('当前引擎：' + ENGINE.threads + '核多线程 · Hash ' + ENGINE.hash + 'MB')
        : ('当前引擎：单线程 · Hash ' + (ENGINE.hash || 32) + 'MB');
    } else if (this._preloadMsg) {
      eng = '当前引擎：加载中 ' + this.compactMsg(this._preloadMsg);
    } else if (this._engineFail) {
      eng = '当前引擎：' + this._engineFail;
    } else if (this._cacheInfo && this._cacheInfo.has) {
      eng = '当前引擎：已缓存 ' + Math.round(this._cacheInfo.total / 1024) + 'KB';
    } else {
      eng = '当前引擎：未下载';
    }
    return eng + ' · 版本号' + JIEQI_VER;
  },
  async refreshCacheInfo() {
    try {
      if (typeof Cache === 'undefined' || typeof ck !== 'function' || typeof variantOf !== 'function') return;
      const V = variantOf();
      const a = await Cache.get(ck(V.js.file));
      const b = await Cache.get(ck(V.wasm.file));
      const jsB = a ? a.byteLength : 0, wB = b ? b.byteLength : 0;
      this._cacheInfo = { js: jsB, wasm: wB, total: jsB + wB, has: (wB > 100000) };
    } catch (e) { this._cacheInfo = null; }
    this.refreshVer();
  },
  /* 预载：进度实时刷新到页脚（用户选 2A）。失败只记状态（用户选 3A），进人机时重试。 */
  startPreload() {
    if (typeof ENGINE === 'undefined') return;
    this._preloadMsg = null;
    this._engineFail = null;
    this.refreshVer();
    ENGINE.preload((t) => {
      this._preloadMsg = t;
      this.refreshVer();
    }).then(() => {
      this._preloadMsg = null;
      this._engineFail = null;
      this.refreshVer();
      this.refreshCacheInfo();
      LOG.add('I', '预载完成 variant=' + ENGINE.variant + ' threads=' + ENGINE.threads + ' hash=' + ENGINE.hash);
    }).catch((e) => {
      this._preloadMsg = null;
      this._engineFail = '下载失败';
      this.refreshVer();
      LOG.add('W', '预载失败（进人机时会重试） msg=' + String(e && e.message).slice(0, 80));
    });
  },

  bind() {
    // 触摸统一记日志：坐标 + target，便于复现问题
    $('#dock').addEventListener('pointerdown', (e) => {
      const id = (e.target.closest('button') || {}).id || (e.target.id) || '?';
      LOG.add('T', id + ' x' + Math.round(e.clientX) + ' y' + Math.round(e.clientY) + ' sy' + Math.round(e.screenY || 0));
    }, true);

    $('#btnFs').addEventListener('click', (e) => { e.stopPropagation(); this.captureFsAnchor(e); this.toggleFs(); });
    $('#btnSet').addEventListener('click', (e) => { e.stopPropagation(); this.openPanel(); });
    $('#btnPve').addEventListener('click', (e) => { e.stopPropagation(); Snd.tap(); LOG.add('M', 'pve'); this.pressGo($('#btnPve'), () => this.openPveSetup(true), () => this.openPveSetup()); });
    $('#btnNet').addEventListener('click', (e) => { e.stopPropagation(); Snd.tap(); LOG.add('M', 'net'); this.pressGo($('#btnNet'), () => this.openNetSetup(null, true), () => this.openNetSetup()); });
    $('#btnBack').addEventListener('click', (e) => {
      e.stopPropagation();
      LOG.add('N', 'hall');
      this.pressGo($('#btnBack'), null, () => { window.location.href = HALL_URL; });
    });

    /* ---------- 测试模式隐藏入口：连点版本号 5 次（2 秒窗口）---------- */
    /* 按钮不写在 HTML 里，而是运行时动态插 DOM —— 只 display:none 的话，
       能探测隐藏元素的浏览器仍会把它列出来，等于没隐藏。
       再点 5 次从 DOM 移除，双向清理。切换静默，只记日志（用户选 3B）。 */
    this._verTaps = [];
    this._testBtn = null;
    $('#ver').addEventListener('click', (e) => {
      e.stopPropagation();
      const now = (performance.now ? performance.now() : Date.now());
      this._verTaps = this._verTaps.filter(t => now - t < 2000);
      this._verTaps.push(now);
      if (this._verTaps.length >= 5) {
        this._verTaps = [];
        this._toggleTestBtn();
      }
    });

    $('#mask').addEventListener('click', () => this.closePanel());
    $('#btnDClose').addEventListener('click', () => this.closePanel());
    $('#tmask').addEventListener('click', () => this.closeTest());
    $('#btnTClose').addEventListener('click', () => this.closeTest());
    $('#btnClearCache').addEventListener('click', () => this.clearEngineCache());
    $('#btnNetTest').addEventListener('click', () => { this.closeTest(); this.openNetSetup(renderNetTest); });
    $('#btnLog').addEventListener('click', () => this.onLog());
    $('#btnReset').addEventListener('click', () => {
      ST.sound = true; ST.volume = 100;
      savePrefs(); Snd.setVolume();
      this.syncSettings();
      LOG.reset(); LOG.add('R', 'reset_all');
      toast('已恢复默认设置', 'ok');
    });
    this.syncSettings();
    // 音效开关 → ST.sound；音量 → ST.volume（Snd 每次发声前读，拖动即时生效）
    $('#swSound').addEventListener('click', () => {
      ST.sound = !ST.sound; savePrefs(); LOG.add('R', 'sound=' + (ST.sound ? 1 : 0));
      this.syncSettings();
      if (ST.sound) Snd.tap();
    });
    /* 反馈类型：'vol' 音量 / 空 = 无反馈。
       抄自 jieqi 1.0 的 dRange：拖动时每 120ms 给一次「当前档位」的实感
       （音量出声），松手再给一次确认；值没变则不反馈，
       否则拖到 0/100 端点后继续滑会被钳住不动却照响，像卡住了。 */
    this.bindSlider('#rgVol', (v) => { ST.volume = v; Snd.setVolume(); },
      () => { savePrefs(); Snd.setVolume(); if (ST.sound) Snd.move(); LOG.add('R', 'vol=' + ST.volume); },
      (v) => { $('#volVal').textContent = v + '%'; }, 'vol');

  },

  // 把 ST 的值刷回面板控件（进入面板与恢复默认时用）
  syncSettings() {
    $('#swSound').classList.toggle('on', !!ST.sound);
    // 音效关掉后音量滑块没有意义（抄 jieqi 1.0：只在其开启时渲染）
    $('#rowVol').style.display = ST.sound ? '' : 'none';
    this.setSlider('#rgVol', ST.volume, (v) => { $('#volVal').textContent = v + '%'; });
  },

  /* ---- 自绘滑块：pointerdown + setPointerCapture 全程接管手势 ---- */
  getSlider(sel) {
    const el = $(sel); if (!el) return 0;
    return parseInt(el.dataset.val || '0', 10);
  },
  setSlider(sel, v, fmt) {
    const el = $(sel); if (!el) return;
    const mn = +el.dataset.min, mx = +el.dataset.max;
    v = Math.max(mn, Math.min(mx, Math.round(v)));
    el.dataset.val = String(v);
    const pct = mx === mn ? 0 : (v - mn) / (mx - mn);
    const fil = el.querySelector('.fil'), thb = el.querySelector('.thb');
    if (fil) fil.style.width = (pct * 100) + '%';
    if (thb) thb.style.left = (pct * 100) + '%';
    if (fmt) fmt(v);
  },
  bindSlider(sel, onInput, onChange, fmt, fb) {
    const el = $(sel); if (!el) return;
    const self = this;
    const mn = +el.dataset.min, mx = +el.dataset.max;
    let fmtCb = fmt || (() => {});
    let lastFb = 0;
    /* 拖动反馈（抄自 jieqi 1.0 的 dRange）：音量每 120ms 出一声，
       让用户不看数字也能感知当前档位。值没变就完全不反馈——否则拖到 0/100 端点后继续滑，
       值被钳住不动、反馈却照发，表现为「还在响」的假象。 */
    const feedback = (v, changed) => {
      if (!fb || !changed) return;
      const now = Date.now();
      if (now - lastFb < 120) return;
      lastFb = now;
      if (fb === 'vol') { if (ST.sound && v > 0) Snd.tap(); }
    };
    const apply = (v) => {
      const changed = (v !== self.getSlider(sel));
      self.setSlider(sel, v, fmtCb);
      if (onInput) onInput(v);
      feedback(v, changed);
    };
    const posToVal = (clientX) => {
      const trk = el.querySelector('.trk');
      const r = trk.getBoundingClientRect();
      const p = r.width ? (clientX - r.left) / r.width : 0;
      return Math.max(mn, Math.min(mx, Math.round(mn + p * (mx - mn))));
    };
    el.addEventListener('pointerdown', (e) => {
      // 锁定该指针：手指滑出控件、滑到屏幕边缘都只驱动这个滑块
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el._drag = true;
      apply(posToVal(e.clientX));
      e.preventDefault();
    });
    el.addEventListener('pointermove', (e) => {
      if (!el._drag) return;
      apply(posToVal(e.clientX));
    });
    const end = (e) => {
      if (!el._drag) return;
      el._drag = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      if (onChange) onChange(self.getSlider(sel));
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  },

  /* ---------- 测试模式抽屉 ---------- */
  openTest() {
    this.renderTestInfo();
    $('#tmask').classList.add('open');
    $('#tpanel').classList.add('open');
    LOG.add('P', 'test_panel=1');
  },
  closeTest() {
    $('#tmask').classList.remove('open');
    $('#tpanel').classList.remove('open');
    LOG.add('P', 'test_close');
  },
  renderTestInfo() {
    let st;
    if (typeof ENGINE !== 'undefined' && ENGINE.worker) {
      st = (ENGINE.variant === 'mt')
        ? ('已加载 · ' + ENGINE.threads + ' 核多线程 · Hash ' + ENGINE.hash + 'MB')
        : ('已加载 · 单线程 · Hash ' + (ENGINE.hash || 32) + 'MB');
    } else if (this._preloadMsg) st = '加载中 · ' + this._preloadMsg;
    else if (this._engineFail) st = '未加载 · ' + this._engineFail;
    else st = '未加载';
    if (typeof ENGINE !== 'undefined' && ENGINE.sourceLabel) st += '\n来源：' + ENGINE.sourceLabel;
    const ver = (typeof ENGINE !== 'undefined' && ENGINE.variant) ? ('\n变体：' + ENGINE.variant) : '';
    $('#tEngState').textContent = st + ver;
    const ci = this._cacheInfo;
    $('#tCacheInfo').textContent = (ci && ci.has)
      ? ('已缓存 ' + Math.round(ci.total / 1024) + 'KB（js ' + Math.round(ci.js / 1024) + 'KB + wasm ' + Math.round(ci.wasm / 1024) + 'KB）')
      : '无缓存';
  },
  /* 清除引擎缓存：IndexedDB + SW CacheStorage + 内存实例。
     清完不自动重下（用户选 4A），下次进人机时才重新下载。 */
  async clearEngineCache() {
    LOG.add('R', 'clear_cache');
    let idb = false, swc = false;
    const keys = [];
    try { await Cache.clear(); idb = true; } catch (e) { LOG.add('W', 'idb_clear_fail ' + e.message); }
    try {
      if (window.caches && caches.keys) {
        const ks = await caches.keys();
        for (const k of ks) { await caches.delete(k); keys.push(k); swc = true; }
      }
    } catch (e) { LOG.add('W', 'sw_clear_fail ' + e.message); }
    if (typeof ENGINE !== 'undefined') {
      ENGINE.ready = null; ENGINE.worker = null; ENGINE.fromCache = false;
      ENGINE.sourceLabel = ''; ENGINE.lastError = null; ENGINE.hashSet = false;
    }
    this._cacheInfo = null;
    this._preloadMsg = null;
    this._engineFail = null;
    this.refreshVer();
    this.renderTestInfo();
    toast('引擎缓存已清除');
    LOG.add('I', 'clear_cache_done idb=' + idb + ' swc=' + swc + ' keys=' + keys.length);
  },

  openPanel() {
    $('#mask').classList.add('open');
    $('#panel').classList.add('open');
    LOG.add('P', 'panel=1');
  },
  closePanel() {
    $('#mask').classList.remove('open');
    $('#panel').classList.remove('open');
    LOG.add('P', 'close');
  },

  onLog() {
    LOG.copy();          // 先自动复制；苹果等复制不成功的机型靠下面的文本框手动选
    this.openLog();
  },
  /* 日志弹窗：正方形，中间文本框可编辑，手机上能长按全选复制（故不再需要「全选」按钮）。
     关闭方式只有「点框外的遮罩」——用 e.target===mask 一行判断，
     不给内部元素逐个加阻止冒泡，省代码。 */
  openLog() {
    const txt = LOG.dump();
    const mask = document.createElement('div');
    mask.className = 'mask';
    const box = document.createElement('div');
    box.className = 'logbox';
    box.innerHTML = '<div class="tip">可长按全选复制</div>' +
      '<textarea spellcheck="false"></textarea>' +
      '<div class="row"><button type="button" id="lgDl">下载为txt</button></div>';
    const ta = box.querySelector('textarea');
    ta.value = txt;
    mask.appendChild(box);
    /* 必须挂 #stage 而不是 body：全屏元素是 #stage，真实全屏时浏览器只绘制它及其子孙，
       挂 body 上的弹窗会整个不显示（设置抽屉当初就是因为这个挪进 #stage 的）。 */
    (document.getElementById('stage') || document.body).appendChild(mask);
    LOG.add('L', 'logbox=' + txt.length + 'B');
    mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
    box.querySelector('#lgDl').addEventListener('click', () => LOG.download());
  },

  // 安全区进出全屏会变，启动时量一次冻结成 px，底板内一律用定值
  freezeInsets() {
    const probe = (css) => {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:-9999px;' + css;
      document.body.appendChild(d);
      const r = d.getBoundingClientRect();
      d.remove();
      return r;
    };
    const rs = document.documentElement.style;
    rs.setProperty('--sit', Math.round(probe('top:0;width:1px;height:env(safe-area-inset-top,0px)').height) + 'px');
    rs.setProperty('--sib', Math.round(probe('bottom:0;width:1px;height:env(safe-area-inset-bottom,0px)').height) + 'px');
    rs.setProperty('--sir', Math.round(probe('right:0;width:env(safe-area-inset-right,0px);height:1px').width) + 'px');
  },

  // 按可靠性依次取：全屏元素实测 → visualViewport → window
  viewport() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
      document.mozFullScreenElement || document.msFullscreenElement;
    let w = 0, h = 0;
    if (fsEl && fsEl.clientWidth > 0 && fsEl.clientHeight > 0) {
      w = fsEl.clientWidth; h = fsEl.clientHeight;
    } else if (window.visualViewport && window.visualViewport.width > 0) {
      w = Math.round(window.visualViewport.width); h = Math.round(window.visualViewport.height);
    }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    return { w: w, h: h };
  },

  layout() {
    const v = this.viewport();
    /* 底板只在「非全屏、不在过渡中、且补偿已归零」时重冻。
       补偿未归零就重冻会量到全屏尺寸（实测退出后偏 85px 且回不来）。 */
    if (!this.isFs() && !this._raf && !this._fsBusy && !this._fsdyCur) {
      if (this._pw !== v.w || this._ph !== v.h) {
        this._pw = v.w; this._ph = v.h;
        const rs = document.documentElement.style;
        rs.setProperty('--plateW', v.w + 'px');
        rs.setProperty('--plateH', v.h + 'px');
        if (this._lastW !== v.w || this._lastH !== v.h) {
          this._lastW = v.w; this._lastH = v.h;
          LOG.add('V', 'w' + v.w + ' h' + v.h + ' sy' + Math.round(this.screenTop()));
        }
      }
    }
    // 标题与菜单实测高度，供 CSS 防碰撞下限使用（标题会随屏宽换行变高）
    const rs = document.documentElement.style;
    const hh = Math.round($('#head').getBoundingClientRect().height);
    const mh = Math.round($('#menu').getBoundingClientRect().height);
    if (this._hh !== hh) { this._hh = hh; rs.setProperty('--headH', hh + 'px'); }
    if (this._mh !== mh) { this._mh = mh; rs.setProperty('--menuH', mh + 'px'); }
    // 退出全屏时视口会缩回去，重新拉起监视让补偿一路回到 0
    if (!this.isFs() && this._fsdyCur && !this._raf) this.startAnchorWatch();
    this.applyFsAnchor();
  },

  /* ---------------- 全屏锚定 ---------------- */
  /* 底板是刚体，只需抵消视口顶边的位移，无需量任何元素 */
  captureFsAnchor(e) {
    if (this.isFs() || this._raf) return;   // 退出时或过渡未走完时不重记
    this._anchorSy = this.screenTop();
    /* 交叉校验：锚定全靠 window.screenY，而事件的 screenY−clientY 是它的独立取值。
       两者在正常环境应相等；真机若不一致说明 screenY 不可靠、锚定会偏，写进日志好定位。 */
    if (e && typeof e.screenY === 'number' && typeof e.clientY === 'number' && e.screenY > 0) {
      const evOff = Math.round(e.screenY - e.clientY);
      if (Math.abs(evOff - Math.round(this._anchorSy)) > 1) {
        LOG.add('W', 'off_diff sy=' + Math.round(this._anchorSy) + ' ev=' + evOff);
      }
    }
    this.startAnchorWatch();
  },

  // fsdy = 当前视口顶边 − 按下时的视口顶边，使底板顶边物理坐标恒定
  applyFsAnchor(sy) {
    if (this._anchorSy == null) return;
    if (sy === undefined) sy = this.screenTop();
    const next = Math.round(sy) - this._anchorSy;
    if (next === this._fsdyCur) return;
    this._fsdyCur = next;
    $('#dock').style.setProperty('--fsdy', next + 'px');
  },

function manualRoom(){ var e = document.getElementById('netRoomVal'); return e ? (e.value || '').trim() : ''; }
function netManual(rm, host){
  var got = null;
  NET.onMsg = function(t, p){ if(t === rmDir(rm) && p) got = p; };
  NET.sub([rmDir(rm)]);
  netTip((host ? '正在创建' : '正在加入') + rm);
  setTimeout(function(){
    var o = null; try{ o = got ? JSON.parse(got) : null; }catch(e){}
    var stale = !o || (o.ts && Date.now() - o.ts > ROOM_TTL);
    if(host ? (!stale && o.owner !== NET.cid) : stale){ netToast(host ? '房间号已经被使用' : ('房间 ' + rm + ' 没人开')); return; }
    if(!host && o.full){ netToast('房间已满'); return; }

/* --- 创建房间：取目录 → 挑最小空号 → retained 占位 → 二次确认防撞 --- */
function netDoCreate(fixed){
  netEnsure(function(ok){ if(!ok) return;
    if(fixed){ netManual(fixed, true); return; }
    var seen = {}, got = false;
    NET.onMsg = function(topic, payload){
      if(topic.indexOf(MQT+'dir/')===0) seen[topic.slice((MQT+'dir/').length)] = payload;
    };
    NET.sub([MQT+'dir/+']);
    netTip('正在创建房间…');
    setTimeout(function(){
      var used = {}; Object.keys(seen).forEach(function(k){
        var o=null; try{ o=JSON.parse(seen[k]); }catch(e){}
        if(!o){ if(seen[k]) used[k]=1; return; }
        if(o.ts && Date.now()-o.ts > ROOM_TTL) return;      /* 僵尸房：房主掉线没续条 */
        used[k]=1;
      });
      var start = fixed || 1, end = fixed || 100, pick = 0;
      for(var i=start;i<=end;i++){ if(!used[roomName(i)]){ pick=i; break; } }
      if(!pick){ netToast('房间已满，没有空房'); return; }
      netClaim(pick, start, end, used);
    }, 1300);
  });
}
function netClaim(i, start, end, used){
  var rm = roomName(i);
  var stamp = { room:rm, owner:NET.cid, ts:Date.now() };
  NET.pub(rmDir(rm), JSON.stringify(stamp), true);
  netTip('正在占用 ' + rm + '…');
  setTimeout(function(){
    /* 二次确认：若 retained 里的 owner 不是自己，说明别人同时占了，顺延下一个 */
    var mine = null;
    NET.onMsg = function(topic, payload){ if(topic===rmDir(rm) && payload){ try{ mine = JSON.parse(payload); }catch(e){ mine={owner:payload}; } } };
    NET.sub([rmDir(rm)]);
    setTimeout(function(){
      if(mine && mine.owner && mine.owner !== NET.cid){
        var nx = i+1;
        while(nx<=end && used[roomName(nx)]) nx++;
        if(nx<=end) netClaim(nx, start, end, used);
        else { netToast('房间已满，没有空房'); }
        return;
      }
      netEnterGame(rm, 'host');
    }, 700);
  }, 350);
}
/* --- 加入房间：订阅目录拿全量在线房间，取最小号；扫三轮仍空则红色提示 --- */
function netDoJoin(fixed){
  netEnsure(function(ok){ if(!ok) return;
    if(fixed){ netManual(fixed, false); return; }
    var round = 0;
    function scan(){
      round++;
      var seen = {};
      NET.onMsg = function(topic, payload){ if(topic.indexOf(MQT+'dir/')===0 && payload) seen[topic.slice((MQT+'dir/').length)] = payload; };
      NET.sub([MQT+'dir/+']);
      netTip('正在加入房间…');
      setTimeout(function(){
        var list = Object.keys(seen).filter(function(k){
        if(k.indexOf('JQ')!==0) return false;
        var o=null; try{ o=JSON.parse(seen[k]); }catch(e){ return true; }
        if(o && o.full) return false;
        return !(o && o.ts && Date.now()-o.ts > ROOM_TTL);
      }).sort();
        if(list.length){ netEnterGame(list[0], 'guest'); return; }
        if(round < 3){ scan(); return; }
        netToast('未找到任何房间');
        log('I','加入房间失败：扫描三轮无结果');
      }, 1500);
    }
    scan();
  });
}
/* --- 进入联机对局页：订阅信令主题 → 建 PC → 房主发 offer --- */
function netEnterGame(room, role){
  ON.on=true; ON.room=room; ON.role=role; ON.myReady=false; ON.peerReady=false; ON.started=false; ON.oppCid=null;
  G.mode='pvp'; G.netColor = (role==='host') ? 'red' : 'black';
  G.humanColor = G.netColor; G.aiColor = Rules.other(G.netColor);
  G.flip = (G.netColor==='black');
  G.state = Rules.newGame(); G.sel=null; G.moves=[]; G.thinking=false; G.history=[];
  G.viewState = Rules.viewFor(G.state, G.netColor);
  G.phase = 'wait'; G.oppGone = false; G.cdTimer = null;
  log('I','进入联机房间', { room:room, role:role, color:G.netColor });
  renderGame(); Board.resize(); Board.draw(); updateStatus();
  var sigTopics = [ rmSig(room,'join'), rmSig(room,'offer'), rmSig(room,'answer'), rmSig(room,'ice'), rmSig(room,'leave') ];
  NET.sub(sigTopics);
  var peerSeen = false;
  NET.onMsg = function(topic, payload){
    var d = null; try{ d = JSON.parse(payload); }catch(e){ return; }
    if(!d) return;
    if(ON.testMode && BOT.on && d.from === NET.cid){ botOnMsg(topic, d); return; }
    if(d.from === NET.cid) return;                 /* 忽略自己发的回声 */
    if(topic === rmSig(room,'leave')){ ON.peerReady=false; G.oppGone=true; netTip('对手已离场', true); updateStatus(); if(role==='host'){ peerSeen=false; ON.oppCid=null; NET.pub(rmDir(room), roomStamp(room), true); } return; }
    if(topic === rmSig(room,'join')){
      if(role!=='host' || peerSeen) return;
      peerSeen = true; ON.oppCid = d.from; netTip('对手已进房，正在握手…'); NET.pub(rmDir(room), roomStamp(room), true);
      RTC.init('host', function(c){ NET.pub(rmSig(room,'ice'), JSON.stringify({from:NET.cid, cand:c}), false); });
      RTC.onOpen = function(){ netOnReady(); };
      RTC.onData = function(s){ netOnData(s); };
      RTC.onState = function(st){ if(st==='failed'){ netTip('直连失败：双方网络无法直连', true); } };
      RTC.offer().then(function(o){ NET.pub(rmSig(room,'offer'), JSON.stringify({from:NET.cid, sdp:o}), false); });
      return;
    }
    if(topic === rmSig(room,'offer')){
      if(role!=='guest') return;
      ON.oppCid = d.from; netTip('收到房主握手，正在回应…');
      if(!RTC.pc){
        RTC.init('guest', function(c){ NET.pub(rmSig(room,'ice'), JSON.stringify({from:NET.cid, cand:c}), false); });
        RTC.onOpen = function(){ netOnReady(); };
        RTC.onData = function(s){ netOnData(s); };
        RTC.onState = function(st){ if(st==='failed'){ netTip('直连失败：双方网络无法直连', true); } };
      }
      RTC.answer(d.sdp).then(function(a){ NET.pub(rmSig(room,'answer'), JSON.stringify({from:NET.cid, sdp:a}), false); });
      return;
    }
    if(topic === rmSig(room,'answer')){
      if(role!=='host' || !RTC.pc) return;
      if(ON.oppCid && d.from !== ON.oppCid) return;      /* 上一个对手遗留的 answer 直接丢掉 */
      try{ var q=RTC.pc.setRemoteDescription(d.sdp); if(q && q.catch) q.catch(function(){}); }catch(e){}
      return;
    }
    if(topic === rmSig(room,'ice')){
      if(!RTC.pc || !RTC.pc.remoteDescription) return;
      if(ON.oppCid && d.from !== ON.oppCid) return;
      RTC.addIce(d.cand);
      return;
    }
  };
  if(role === 'host'){
    ON.beaconT = setInterval(function(){ NET.pub(rmDir(room), roomStamp(room), true); }, ROOM_BEACON);
  }
  if(role === 'guest'){
    netTip('正在加入 ' + room + '…');
    NET.pub(rmSig(room,'join'), JSON.stringify({from:NET.cid}), false);
    /* 客机也发自己的 ICE（房主可能后到 ICE，双向都灌） */
    RTC.init('guest', function(c){ NET.pub(rmSig(room,'ice'), JSON.stringify({from:NET.cid, cand:c}), false); });
    RTC.onOpen = function(){ netOnReady(); };
    RTC.onData = function(s){ netOnData(s); };
    RTC.onState = function(st){ if(st==='failed'){ netTip('直连失败：双方网络无法直连', true); } };
  }else{
    netTip('等待对手加入 ' + room + '…');
  }
}
/* 揭棋的暗子是随机分配的：两边各自 newGame 会得到不同布局，必须房主发一份过去。
   编码：每格 2 字符，首字符 r/b 表红黑，次字符用 ROLE 字母，小写=暗子、大写=明子，-- 为空。 */
var NRC = { chariot:'R', advisor:'A', cannon:'C', soldier:'P', horse:'N', elephant:'B', general:'K' };
var NRR = { R:'chariot', A:'advisor', C:'cannon', P:'soldier', N:'horse', B:'elephant', K:'general' };
function boardDump(st){ var s=''; for(var i=0;i<90;i++){ var p=st.board[i];
  if(!p){ s+='--'; continue; }
  var ch = NRC[p.role] || '?';
  s += (p.color==='red'?'r':'b') + (p.faceDown ? ch.toLowerCase() : ch); }
  return s; }
function boardLoad(s){ var b=new Array(90);
  for(var i=0;i<90;i++){ var t=s.substr(i*2,2);
    if(!t || t==='--'){ b[i]=null; continue; }
    var up=t.charAt(1).toUpperCase(), role=NRR[up];
    b[i] = role ? { color:(t.charAt(0)==='r'?'red':'black'), role:role, faceDown:(t.charAt(1)!==up) } : null; }
  return { board:b, turn:'red', captures:[], noCap:0, ply:0, over:null, lastMove:null }; }
function netOnReady(){
  if(ON.role==='host' && G.state){ netSend({ t:'init', bd:boardDump(G.state) }); log('I','已发送初始布局', { room:ON.room }); }
  netTip('已与对手直连，请点「准备」');
  updateStatus();
}
function netSend(o){ if(RTC.send(o)) return true; toast('尚未与对手建立连接'); return false; }
/* 目录条：房主每 15 秒续一次；已有人加入则带 full=1，第三人据此判断进不去 */

/* --- 收到对手消息 --- */
function netOnData(s){
  var d = null; try{ d = JSON.parse(s); }catch(e){ return; }

  if(d.t === 'init'){
    if(ON.role==='host' || !d.bd) return;
    G.state = boardLoad(d.bd); G.sel=null; G.moves=[]; G.history=[];
    G.viewState = Rules.viewFor(G.state, G.netColor);
    Board.draw(); updateStatus(); log('I','已接收初始布局', { room:ON.room }); return;
  }
  if(d.t === 'ready'){ ON.peerReady = !!d.v; updateStatus(); netCheckStart(); return; }
  if(d.t === 'move'){ netApplyOppMove(d.from, d.to); return; }
  if(d.t === 'undo'){ toast('对手申请悔棋'); return; }
  if(d.t === 'resign'){ G.state.over = { result:'resign', winner:G.netColor }; updateStatus(); Board.draw(); toast('对手认输'); return; }
  if(d.t === 'swap'){ toast('对手申请执黑'); return; }

function netApplyOppMove(from, to){
  if(!G.state || !ON.started) return;
  var res = null;
  try{ res = Rules.applyMove(G.state, from, to); }catch(e){ log('E','应用对手走子失败',{msg:e.message}); try{ toast('对手走子无法应用，请重开'); }catch(e2){} return; }
  if(!res || !res.state){ log('W','应用对手走子失败：起点为空',{from:from,to:to}); try{ toast('对手走子无法应用，请重开'); }catch(e2){} return; }
  G.history.push(Rules.clone(G.state));
  G.state = res.state;                       /* applyMove 是纯函数，返回新 state，必须回写 */
  if(res.evt) feedbackMove(res.evt);
  G.sel=null; G.moves=[]; G.viewState = Rules.viewFor(G.state, G.netColor);

/* --- 测试模式：巅峰棋圣机器人。它走「真实服务器 + 真实 P2P」，用来验联机链路通不通。
       同一页面开第二个 RTCPeerConnection（独立 cid），网络路径与两台手机完全一致；
       唯一验不到的是跨网 NAT 穿透，那得两台真机。 --- */
var BOT = { on:false, cid:null, room:null, role:null, ready:false, started:false, pc:null, dc:null, color:'black', state:null }; /* state：机器人自己的棋盘，与真人端 G.state 分离 */
function botReset(){ BOT.on=false; BOT.cid=null; BOT.room=null; BOT.role=null; BOT.ready=false; BOT.started=false; BOT.pc=null; BOT.dc=null; }
function botSend(o){ if(BOT.dc && BOT.dc.readyState==='open'){ try{ BOT.dc.send(JSON.stringify(o)); return true; }catch(e){} } return false; }
function botPc(room, role){
  var pc = new RTCPeerConnection(ICE_CFG);
  BOT.pc = pc;
  pc.onicecandidate = function(e){ if(e.candidate) NET.pub(rmSig(room,'ice'), JSON.stringify({from:BOT.cid, cand:e.candidate.toJSON?e.candidate.toJSON():e.candidate}), false); };
  function bind(dc){ BOT.dc=dc;
    dc.onopen = function(){
      botSend({ t:'ready', v:true }); BOT.ready=true; netCheckStart();
      log('I','机器人已直连', { room:room, role:BOT.role });
    };
    dc.onmessage = function(e){ botOnData(e.data); };
  }
  if(role==='host'){ bind(pc.createDataChannel('jieqi',{ordered:true})); } else { pc.ondatachannel=function(e){ bind(e.channel); }; }
  return pc;
}
/* 机器人作为客机加入我的房间：完全复刻真人客机的动作（发 join → 收 offer → 回 answer → 灌 ICE） */

function botOnMsg(topic, d){
  var room = BOT.room; if(!room) return;
  if(d.from === BOT.cid) return;                       /* 自己发的回声 */
  if(topic === rmSig(room,'join') && BOT.role==='host'){
    botPc(room,'host');
    botPcOffer(room);
    return;
  }
  if(topic === rmSig(room,'offer') && BOT.role==='guest'){
    if(!BOT.pc) botPc(room,'guest');

    }).catch(function(e){ log('E','机器人 answer 失败',{msg:String(e)}); });
    return;
  }
  if(topic === rmSig(room,'answer') && BOT.role==='host' && BOT.pc){
    try{ BOT.pc.setRemoteDescription(d.sdp); }catch(e){}
    return;
  }
  if(topic === rmSig(room,'ice') && BOT.pc && BOT.pc.remoteDescription){
    try{ var p=BOT.pc.addIceCandidate(d.cand); if(p && p.catch) p.catch(function(){}); }catch(e){}
    return;
  }

function botPcOffer(room){
  var pc=BOT.pc;
  pc.createOffer().then(function(o){ return pc.setLocalDescription(o).then(function(){
    NET.pub(rmSig(room,'offer'), JSON.stringify({from:BOT.cid, sdp:pc.localDescription}), false);
  }); }).catch(function(e){ log('E','机器人 offer 失败',{msg:String(e)}); });

/* 机器人收到我的消息：准备同步 + 走子 */
function botOnData(s){
  var d=null; try{ d=JSON.parse(s); }catch(e){ return; }
  if(!d) return;
  if(d.t==='kick'){ try{ if(BOT.dc) BOT.dc.close(); }catch(e){} try{ if(BOT.pc) BOT.pc.close(); }catch(e){} BOT.on=false; BOT.pc=null; BOT.dc=null; return; }
  if(d.t==='ready'){ if(d.v && BOT.ready && BOT.pc){ botSend({t:'ready', v:true}); } return; }
  if(d.t==='move'){ botApplyMove(d.from, d.to); return; }

function botApplyMove(from, to){
  if(!BOT.state && G.state) BOT.state = Rules.clone(G.state);
  var st = BOT.state; if(!st) return;
  var res=null; try{ res = Rules.applyMove(st, from, to); }catch(e){ log('E','机器人应用走子失败',{msg:String(e && e.message)}); return; }
  if(!res || !res.state){ log('W','机器人应用走子失败：起点为空',{from:from,to:to}); return; }
  BOT.state = res.state;              /* 只动自己的棋盘；真人端靠 netApplyOppMove 更新 G.state */
  if(BOT.state.turn === BOT.color) setTimeout(botThink, 300);
}
/* 机器人思考：独占引擎（联机测试里「我」不用引擎），固定巅峰棋圣 */
async function botThink(){
  if(!BOT.on) return;
  if(!BOT.state && G.state) BOT.state = Rules.clone(G.state);
  var st = BOT.state; if(!st) return;
  if(st.turn !== BOT.color) return;
  if(isOver(st.over)) return;
  try{ await ENGINE.preload(function(){}); }catch(e){ netTip('机器人引擎未就绪：'+e.message, true); return; }
  try{
    var lv = LEVELS['peak'];
    await ENGINE.setHash(Math.max(HASH_OF('peak'), ENGINE.suggestedHash()));
    var fen = Rules.toFen(st, BOT.color);
    var r = await ENGINE.search(fen, { movetime: lv.movetime });
    var mv = pickEngineMove(st, BOT.color, r && r.best);
    if(!mv) return;
    var res = Rules.applyMove(st, mv.from, mv.to);
    if(!res || !res.state) return;
    BOT.state = res.state;            /* 只动自己的棋盘；真人端靠 netApplyOppMove 更新 G.state */
    botSend({ t:'move', from:mv.from, to:mv.to });
  }catch(e){ log('E','机器人思考异常',{msg:String(e && e.message)}); }
}

function randInt(n){
  if(window.crypto && crypto.getRandomValues){ var a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }
  return Math.floor(Math.random()*n);
}
function shuffle(arr){

  return arr;
}

var Snd = {
  ctx:null, master:null, noiseBuf:null,
  unlock: function(){
    try{
      if(!this.ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = (ST.volume/100) * 0.9;
        this.master.connect(this.ctx.destination);
      }
      if(this.ctx.state === 'suspended') this.ctx.resume();
    }catch(e){ log('W','音频初始化失败',{msg:e.message}); }
  },
  setVolume: function(){ try{ if(this.master) this.master.gain.value = (ST.volume/100)*0.9; }catch(e){} },
  tone: function(o){
    if(!ST.sound || !this.ctx) return;
    try{
      var t0 = this.ctx.currentTime + (o.delay||0);
      var osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f, t0);
      if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2), t0+o.dur);
      var peak = (o.gain==null ? 0.25 : o.gain);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0+Math.min(0.02, o.dur*0.25));
      g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
      var node = osc;
      if(o.lp){ var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; node.connect(f); node=f; }
      node.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0+o.dur+0.05);
    }catch(e){}
  },
  noise: function(o){
    if(!ST.sound || !this.ctx) return;
    try{
      var t0 = this.ctx.currentTime + (o.delay||0);
      var len = Math.max(1, Math.floor(this.ctx.sampleRate * o.dur));
      if(!this.noiseBuf || this.noiseBuf.length < len){
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        var dd = this.noiseBuf.getChannelData(0);
        for(var i=0;i<len;i++) dd[i] = Math.random()*2-1;
      }
      var src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
      var f = this.ctx.createBiquadFilter(); f.type = o.hp ? 'highpass' : 'lowpass';
      f.frequency.value = o.freq || 1000;
      var g = this.ctx.createGain();
      g.gain.setValueAtTime(o.gain==null?0.3:o.gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t0); src.stop(t0+o.dur+0.02);
    }catch(e){}
  },
  
  tap:    function(){ this.unlock(); this.tone({f:1180,f2:900,dur:0.05,type:'sine',gain:0.12}); },
  move:   function(){ this.unlock(); this.noise({dur:0.055,freq:1800,hp:true,gain:0.34}); this.tone({f:220,f2:110,dur:0.1,type:'sine',gain:0.30}); },
  reveal: function(){ this.unlock();
            this.noise({dur:0.07,freq:3000,hp:true,gain:0.20});
            this.tone({f:1046,dur:0.20,type:'triangle',gain:0.24});
            this.tone({f:1568,dur:0.26,type:'sine',gain:0.16,delay:0.05}); },
  capture:function(){ this.unlock();
            this.noise({dur:0.09,freq:900,gain:0.30});
            this.tone({f:180,f2:90,dur:0.16,type:'sawtooth',gain:0.20,lp:1200}); },
  check:  function(){ this.unlock();
            this.tone({f:880,dur:0.10,type:'square',gain:0.16});
            this.tone({f:1174,dur:0.14,type:'square',gain:0.14,delay:0.11}); },
  undo:   function(){ this.unlock(); this.tone({f:700,f2:380,dur:0.12,type:'triangle',gain:0.16}); },
  connect:function(){ this.unlock();
            this.tone({f:523,dur:0.10,type:'triangle',gain:0.20});
            this.tone({f:784,dur:0.14,type:'triangle',gain:0.20,delay:0.11}); },
  win:    function(){ this.unlock();
            [523,659,784,1046].forEach(function(f,i){ Snd.tone({f:f,dur:0.22,type:'triangle',gain:0.22,delay:i*0.13}); }); },
  lose:   function(){ this.unlock();
            this.tone({f:392,dur:0.26,type:'sawtooth',gain:0.18,lp:900});
            this.tone({f:294,dur:0.34,type:'sawtooth',gain:0.16,delay:0.20,lp:800}); },
  draw:   function(){ this.unlock(); this.tone({f:440,dur:0.20,type:'square',gain:0.14}); }
};

var Rules = (function(){
  var ROLE_CH = { chariot:'R', advisor:'A', cannon:'C', soldier:'P', horse:'N', elephant:'B', general:'K' };
  var CH_ROLE = { R:'chariot', A:'advisor', C:'cannon', P:'soldier', N:'horse', B:'elephant', K:'general' };
  var POOL_ORDER = ['chariot','advisor','cannon','soldier','horse','elephant']; 
  var ROLE_CN = {
    chariot:{red:'車',black:'車'}, horse:{red:'馬',black:'馬'}, elephant:{red:'相',black:'象'},
    advisor:{red:'仕',black:'士'}, general:{red:'帥',black:'將'}, cannon:{red:'炮',black:'砲'}, soldier:{red:'兵',black:'卒'}
  };

  
  var HOME = new Array(90).fill(null);
  (function(){
    var back = ['chariot','horse','elephant','advisor','general','advisor','elephant','horse','chariot'];
    for(var c=0;c<9;c++){ HOME[c] = back[c]; HOME[81+c] = back[c]; }
    HOME[2*9+1]='cannon'; HOME[2*9+7]='cannon';
    HOME[7*9+1]='cannon'; HOME[7*9+7]='cannon';
    [0,2,4,6,8].forEach(function(c){ HOME[3*9+c]='soldier'; HOME[6*9+c]='soldier'; });
  })();

  var RED_SLOTS  = [0,1,2,3,5,6,7,8, 19,25, 27,29,31,33,35];
  var BLACK_SLOTS= [81,82,83,84,86,87,88,89, 64,70, 54,56,58,60,62];
  var RED_START  = ['chariot','chariot','horse','horse','elephant','elephant','advisor','advisor','cannon','cannon','soldier','soldier','soldier','soldier','soldier'];
  var BLACK_START= RED_START.slice();

  function newGame(){
    var b = new Array(90).fill(null);
    var rs = shuffle(RED_START.slice()), bs = shuffle(BLACK_START.slice());
    for(var i=0;i<15;i++){
      b[RED_SLOTS[i]]   = { color:'red',   role: rs[i], faceDown:true };
      b[BLACK_SLOTS[i]] = { color:'black', role: bs[i], faceDown:true };
    }
    b[4]  = { color:'red',   role:'general', faceDown:false };
    b[85] = { color:'black', role:'general', faceDown:false };
    return { board:b, turn:'red', captures:[], noCap:0, ply:0, over:null, lastMove:null };
  }
  function clone(s){
    var b=new Array(90);
    for(var i=0;i<90;i++) b[i] = s.board[i] ? { color:s.board[i].color, role:s.board[i].role, faceDown:s.board[i].faceDown } : null;
    return { board:b, turn:s.turn, captures:s.captures.map(function(c){return {owner:c.owner,role:c.role,wasFaceDown:c.wasFaceDown};}),
             noCap:s.noCap, ply:s.ply, over:s.over, lastMove:s.lastMove };
  }
  function effRole(p, idx){ return p.faceDown ? HOME[idx] : p.role; }
  function inPalace(r,c,color){ if(c<3||c>5) return false; return color==='red' ? (r>=0&&r<=2) : (r>=7&&r<=9); }
  function other(c){ return c==='red' ? 'black' : 'red'; }

  function genRaw(s, from, out){
    var p = s.board[from]; if(!p) return out;
    var r0=(from/9)|0, c0=from%9;
    var role = effRole(p, from);
    var red = p.color==='red';
    var B = s.board;
    function push(r,c){
      if(r<0||r>9||c<0||c>8) return;
      var j=r*9+c, q=B[j];
      if(q && q.color===p.color) return;
      out.push(j);
    }
    function walk(dirs, cannon){
      for(var k=0;k<dirs.length;k++){
        var dr=dirs[k][0], dc=dirs[k][1];
        var r=r0+dr, c=c0+dc, screen=false;
        while(r>=0&&r<=9&&c>=0&&c<=8){
          var j=r*9+c, q=B[j];
          if(cannon){
            if(!screen){
              if(!q){ out.push(j); }
              else { screen=true; }
            } else {
              if(q){ if(q.color!==p.color) out.push(j); break; }
            }
          } else {
            if(!q){ out.push(j); }
            else { if(q.color!==p.color) out.push(j); break; }
          }
          r+=dr; c+=dc;
        }
      }
    }
    var D4=[[1,0],[-1,0],[0,1],[0,-1]];
    if(role==='chariot'){ walk(D4,false); }
    else if(role==='cannon'){ walk(D4,true); }
    else if(role==='general'){
      
      var cand=[[r0+1,c0],[r0-1,c0],[r0,c0+1],[r0,c0-1]];
      for(var i=0;i<cand.length;i++){
        var r=cand[i][0],c=cand[i][1];
        if(!inPalace(r,c,p.color)) continue;
        var j=r*9+c, q=B[j];
        if(q && q.color===p.color) continue;
        out.push(j);
      }
    }
    else if(role==='advisor'){
      var av=[[r0+1,c0+1],[r0+1,c0-1],[r0-1,c0+1],[r0-1,c0-1]];
      for(var i2=0;i2<av.length;i2++){
        var r2=av[i2][0], c2=av[i2][1];
        if(r2<0||r2>9||c2<0||c2>8) continue;
        if(p.faceDown && !inPalace(r2,c2,p.color)) continue; 
        var j2=r2*9+c2, q2=B[j2];
        if(q2 && q2.color===p.color) continue;
        out.push(j2);
      }
    }
    else if(role==='elephant'){
      var ev=[[r0+2,c0+2],[r0+2,c0-2],[r0-2,c0+2],[r0-2,c0-2]];
      for(var i3=0;i3<ev.length;i3++){
        var r3=ev[i3][0], c3=ev[i3][1];
        if(r3<0||r3>9||c3<0||c3>8) continue;
        if(B[((r0+r3)/2|0)*9 + ((c0+c3)/2|0)]) continue;      
        if(p.faceDown && !(p.color==='red' ? r3<=4 : r3>=5)) continue; 
        var j3=r3*9+c3, q3=B[j3];
        if(q3 && q3.color===p.color) continue;
        out.push(j3);
      }
    }
    else if(role==='horse'){
      var hv=[[r0+2,c0+1],[r0+2,c0-1],[r0-2,c0+1],[r0-2,c0-1],[r0+1,c0+2],[r0+1,c0-2],[r0-1,c0+2],[r0-1,c0-2]];
      for(var i4=0;i4<hv.length;i4++){
        var r4=hv[i4][0], c4=hv[i4][1];
        if(r4<0||r4>9||c4<0||c4>8) continue;
        var legR = (Math.abs(r4-r0)===2) ? r0 + (r4>r0?1:-1) : r0;
        var legC = (Math.abs(r4-r0)===2) ? c0 : c0 + (c4>c0?1:-1);
        if(B[legR*9+legC]) continue; 
        var j4=r4*9+c4, q4=B[j4];
        if(q4 && q4.color===p.color) continue;
        out.push(j4);
      }
    }
    else if(role==='soldier'){
      var fwd = red ? r0+1 : r0-1;
      push(fwd, c0);
      var crossed = red ? (r0>=5) : (r0<=4);
      if(crossed){ push(r0, c0+1); push(r0, c0-1); }
    }
    return out;
  }

  function findGeneral(s, color){
    for(var i=0;i<90;i++){ var p=s.board[i]; if(p && p.color===color && p.role==='general') return i; }
    return -1;
  }
  function kingsFace(s){
    var kr=findGeneral(s,'red'), kb=findGeneral(s,'black');
    if(kr<0||kb<0) return false;
    var cr=kr%9, cb=kb%9;
    if(cr!==cb) return false;
    var r1=Math.min((kr/9|0),(kb/9|0))+1, r2=Math.max((kr/9|0),(kb/9|0));
    for(var r=r1;r<r2;r++){ if(s.board[r*9+cr]) return false; }
    return true;
  }
  function attacked(s, idx, byColor){
    var r=(idx/9)|0, c=idx%9, B=s.board;
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var k=0;k<4;k++){
      var dr=dirs[k][0], dc=dirs[k][1];
      var rr=r+dr, cc=c+dc, first=false, dist=1;
      while(rr>=0&&rr<=9&&cc>=0&&cc<=8){
        var j=rr*9+cc, q=B[j];
        if(q){
          if(!first){
            first=true;
            if(q.color===byColor){
              var er=effRole(q,j);
              if(er==='chariot') return true;
              if(er==='general' && dist===1) return true;
            }
          } else {
            if(q.color===byColor && effRole(q,j)==='cannon') return true;
            break;
          }
        }
        rr+=dr; cc+=dc; dist++;
      }
    }
    
    var hv=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for(var i=0;i<8;i++){
      var mr=r+hv[i][0], mc=c+hv[i][1];
      if(mr<0||mr>9||mc<0||mc>8) continue;
      var mj=mr*9+mc, mq=B[mj];
      if(!mq||mq.color!==byColor||effRole(mq,mj)!=='horse') continue;
      var ddr=r-mr, ddc=c-mc;
      var legR = Math.abs(ddr)===2 ? mr + (ddr>0?1:-1) : mr;
      var legC = Math.abs(ddr)===2 ? mc : mc + (ddc>0?1:-1);
      if(!B[legR*9+legC]) return true;
    }
    
    if(byColor==='red'){
      if(r-1>=0){ var j1=(r-1)*9+c, q1=B[j1]; if(q1&&q1.color==='red'&&effRole(q1,j1)==='soldier') return true; }
      if(r>=5){ for(var d=-1;d<=1;d+=2){ var cc2=c+d; if(cc2<0||cc2>8) continue; var j2=r*9+cc2,q2=B[j2];
        if(q2&&q2.color==='red'&&effRole(q2,j2)==='soldier') return true; } }
    } else {
      if(r+1<=9){ var j3=(r+1)*9+c, q3=B[j3]; if(q3&&q3.color==='black'&&effRole(q3,j3)==='soldier') return true; }
      if(r<=4){ for(var d2=-1;d2<=1;d2+=2){ var cc3=c+d2; if(cc3<0||cc3>8) continue; var j4=r*9+cc3,q4=B[j4];
        if(q4&&q4.color==='black'&&effRole(q4,j4)==='soldier') return true; } }
    }
    
    var av=[[-1,-1],[-1,1],[1,-1],[1,1]];
    for(var a=0;a<4;a++){
      var ar=r+av[a][0], ac=c+av[a][1];
      if(ar<0||ar>9||ac<0||ac>8) continue;
      var aj=ar*9+ac, aq=B[aj];
      if(!aq||aq.color!==byColor||effRole(aq,aj)!=='advisor') continue;
      if(!aq.faceDown) return true;               
      if(inPalace(r,c,aq.color)) return true;     
    }
    
    var ev=[[-2,-2],[-2,2],[2,-2],[2,2]];
    for(var b2=0;b2<4;b2++){
      var er2=r+ev[b2][0], ec=c+ev[b2][1];
      if(er2<0||er2>9||ec<0||ec>8) continue;
      var ej=er2*9+ec, eq=B[ej];
      if(!eq||eq.color!==byColor||effRole(eq,ej)!=='elephant') continue;
      if(B[(r+ev[b2][0]/2|0)*9 + (c+ev[b2][1]/2|0)]) continue;   
      if(!eq.faceDown) return true;               
      if(eq.color==='red' ? r<=4 : r>=5) return true;
    }
    return false;
  }
  function inCheck(s, color){ var g=findGeneral(s,color); if(g<0) return false; return attacked(s,g,other(color)); }

  function legalMoves(s, from){
    var raw=[]; genRaw(s,from,raw);
    var out=[], p=s.board[from]; if(!p) return out;
    for(var i=0;i<raw.length;i++){
      var to=raw[i];
      var t=clone(s);
      t.board[to]=t.board[from]; t.board[from]=null;
      if(t.board[to]) t.board[to].faceDown=false;
      if(kingsFace(t)) continue;
      if(inCheck(t,p.color)) continue;
      out.push(to);
    }
    return out;
  }
  function allLegal(s, color){
    var res=[];
    for(var i=0;i<90;i++){ var p=s.board[i]; if(p&&p.color===color){ var mv=legalMoves(s,i); for(var k=0;k<mv.length;k++) res.push({from:i,to:mv[k]}); } }
    return res;
  }

  
  function applyMove(s, from, to){
    var n = clone(s);
    var p = n.board[from], cap = n.board[to];
    if(!p){ return null; }                 /* 防御：起点已空（同一步被应用两次） */
    var wasFaceDown = p.faceDown;
    n.board[to] = { color:p.color, role:p.role, faceDown:false };
    n.board[from] = null;
    var evt = { from:from, to:to, mover:p.color, revealed: wasFaceDown ? p.role : null, captured:null };
    if(cap){
      evt.captured = { owner:cap.color, role:cap.role, wasFaceDown:cap.faceDown };
      n.captures.push(evt.captured);
      n.noCap = 0;
    } else if(wasFaceDown){
      n.noCap = 0;                 
    } else {
      n.noCap = s.noCap + 1;
    }
    n.turn = other(p.color);
    n.ply = s.ply + 1;
    n.lastMove = { from:from, to:to };
    
    var opp = n.turn;
    var moves = allLegal(n, opp);
    var chk = inCheck(n, opp);
    if(moves.length === 0){
      
      n.over = { result: chk ? 'checkmate' : 'stalemate', winner: p.color };
    } else if(n.noCap >= 80){
      n.over = { result:'draw80', winner:null };
    } else if(n.ply >= 400){
      n.over = { result:'drawMax', winner:null };   
    } else {
      n.over = { result: chk ? 'check' : null, winner:null };
    }
    return { state:n, evt:evt };
  }

  
  function pieceFenCh(p){
    if(p.faceDown) return p.color==='red' ? 'X' : 'x';
    var ch = ROLE_CH[p.role];
    return p.color==='red' ? ch : ch.toLowerCase();
  }
  function boardField(s){
    var rows=[];
    for(var r=9;r>=0;r--){
      var row='', empty=0;
      for(var c=0;c<9;c++){
        var p=s.board[r*9+c];
        if(!p){ empty++; continue; }
        if(empty){ row+=empty; empty=0; }
        row += pieceFenCh(p);
      }
      if(empty) row+=empty;
      rows.push(row);
    }
    return rows.join('/');
  }
  
  var POOL_INIT = { chariot:2, advisor:2, cannon:2, soldier:5, horse:2, elephant:2 };
  
  function poolField(s, viewer){
    var known = { red:{}, black:{} };
    for(var i=0;i<90;i++){
      var p=s.board[i];
      if(p && !p.faceDown && p.role && p.role!=='general'){
        known[p.color][p.role] = (known[p.color][p.role]||0)+1;
      }
    }
    for(var k=0;k<s.captures.length;k++){
      var cp=s.captures[k];
      if(!cp) continue;
      if(!cp.wasFaceDown && cp.role && cp.role!=='general'){
        known[cp.owner][cp.role] = (known[cp.owner][cp.role]||0)+1;
      }
    }
    var out='';
    ['red','black'].forEach(function(col){
      POOL_ORDER.forEach(function(role){
        var n = (POOL_INIT[role]||0) - (known[col][role]||0);
        if(n<0) n=0;
        out += (col==='red'?ROLE_CH[role]:ROLE_CH[role].toLowerCase()) + n;
      });
    });
    return out;
  }
  function toFen(s, viewer){
    return [ boardField(s), s.turn==='red'?'w':'b', poolField(s, viewer), s.noCap, Math.floor(s.ply/2)+1 ].join(' ');
  }

  
  function idxToUci(i){ return String.fromCharCode(97+(i%9)) + ((i/9)|0); }
  function uciToIdx(u){ return (parseInt(u.slice(1),10))*9 + (u.charCodeAt(0)-97); }

  
  function viewFor(s, viewer){
    var b=new Array(90);
    for(var i=0;i<90;i++){
      var p=s.board[i];
      if(!p){ b[i]=null; continue; }
      if(p.faceDown){ b[i]={ color:p.color, role:null, faceDown:true }; }
      else b[i]={ color:p.color, role:p.role, faceDown:false };
    }
    var caps = s.captures.map(function(cp){
      
      if(cp.owner===viewer && cp.wasFaceDown) return { owner:cp.owner, role:null, wasFaceDown:true };
      return { owner:cp.owner, role:cp.role, wasFaceDown:cp.wasFaceDown };
    });
    return { board:b, turn:s.turn, captures:caps, noCap:s.noCap, ply:s.ply, over:s.over, lastMove:s.lastMove };
  }

  return { ROLE_CH:ROLE_CH, CH_ROLE:CH_ROLE, ROLE_CN:ROLE_CN, HOME:HOME,
    newGame:newGame, clone:clone, effRole:effRole, inPalace:inPalace, other:other,
    genRaw:genRaw, legalMoves:legalMoves, allLegal:allLegal, applyMove:applyMove,
    inCheck:inCheck, kingsFace:kingsFace, attacked:attacked, findGeneral:findGeneral,
    toFen:toFen, idxToUci:idxToUci, uciToIdx:uciToIdx, viewFor:viewFor };

  },
  pick(px,py){
    var sc = Math.round((px - this.pad)/this.cell);
    var sr = Math.round((py - this.pad)/this.cell);
    if(sc<0||sc>8||sr<0||sr>9) return -1;
    var c = G.flip ? (8-sc) : sc;

  draw(){
    var ctx=this.ctx, cell=this.cell, pad=this.pad;

    ctx.lineWidth=Math.max(1,cell*0.022);
    marks.forEach(function(m){
      var p=this.xy(m[0],m[1]); var off=cell*0.10, L=cell*0.16;
      for(var k=0;k<4;k++){
        var sx=(k===0||k===3)?-1:1, sy=(k<2)?-1:1;
        var hx=p[0]+sx*off, hy=p[1]+sy*off;
        if(hx-cell*0.5 < this.xy(m[0],0)[0]-cell*0.45 && false) continue;
        ctx.beginPath();

  }

async function fetchStream(url, ctl, onChunk){
  var opt = { cache:'no-store' };
  if(ctl) opt.signal = ctl.signal;
  var r = await fetch(url, opt);
  if(!r.ok) throw new Error('HTTP'+r.status);
  var len = parseInt(r.headers.get('content-length')||'0', 10);
  if(r.body && r.body.getReader){
    var rd = r.body.getReader(), parts=[], got=0;
    for(;;){
      var d = await rd.read();
      if(d.done) break;
      parts.push(d.value); got += d.value.length;
      if(onChunk) onChunk(got, len);
    }
    return await (new Blob(parts)).arrayBuffer();
  }
  var b = await r.arrayBuffer();
  if(onChunk) onChunk(b.byteLength, len || b.byteLength);
  return b;
}


function raceFile(file, sources, onProg){
  return new Promise(function(resolve, reject){
    var settled=false, ctls=[], failed=0, progState=[];
    sources.forEach(function(src, i){
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      ctls.push(ctl);
      progState[i] = { got:0, len:0 };
      (async function(){
        var buf;
        try{
          buf = await fetchStream(src.url + file, ctl, function(got, len){
            progState[i].got = got; progState[i].len = len;
          });
          if(!buf || buf.byteLength===0) throw new Error('空响应');
        }catch(e){
          failed++;
          if(!settled) log('D','下载源失败', { file:file, source:src.label, msg:String(e&&e.message||e).slice(0,70) });
          if(failed>=sources.length && !settled){
            settled=true;
            reject(new Error('全部 '+sources.length+' 个源均下载失败'));
          }
          return;
        }
        if(settled) return;              
        settled = true;
        
        for(var j=0;j<ctls.length;j++){ if(j!==i && ctls[j]){ try{ ctls[j].abort(); }catch(e){} } }
        log('I','赛马获胜', { file:file, source:src.label, bytes:buf.byteLength });
        resolve({ buf:buf, source:src });
      })();
    });
    
    if(onProg){
      var t = setInterval(function(){
        if(settled){ clearInterval(t); return; }
        var best=null, bi=-1;
        for(var k=0;k<progState.length;k++){
          var p=progState[k];
          if(p.got>0 && (!best || p.got>best.got)){ best=p; bi=k; }
        }
        if(best) onProg(best.got, best.len, sources[bi]);
      }, 200);
      setTimeout(function(){ clearInterval(t); }, 120000);
    }
  });
}

var ENGINE = {
  worker:null, ready:null, sourceLabel:'-', fromCache:false,
  searching:false, token:0, queue:Promise.resolve(), lines:[],
  variant:'st', threads:1, hash:32, hashSet:false,
  handshakeDone:false, lastError:null,
  info:{ depth:0, score:null, nodes:0, hashfull:0, nps:0 },

  /* 线程数策略（v3.0 起）：
     ① 用户手动指定 → 直接用
     ② 上次成功跑通过的值 → 直接用（避免每次都去撞注定失败的高档位）
     ③ 否则 = CPU 核心数（设备多少核就用多少核，不再砍半封顶 4）
     上限 32，下限 1。 */

  /* 线程数策略（v3.4.0 起，已简化）：
     实测两台设备（E3-1230v3 4核8线程 / K90 真8核）各档对比，
     「用满核心数」在两台机器上都是 nps 最高档，因此不再做任何探测，
     直接 = CPU 核心数。设置页「记住线程数」开关打开时才用用户设的值。 */

  cores(){
    var c = navigator.hardwareConcurrency || 1;
    return Math.max(1, Math.min(64, c|0));
  },
  threadsRemember(){
    try{ return localStorage.getItem('jieqi-threads-remember') === '1'; }catch(e){ return false; }
  },
  pickThreads(){
    
    if(typeof SESSION_THREADS === 'number' && SESSION_THREADS >= 1 && SESSION_THREADS <= this.cores())
      return SESSION_THREADS;
    if(this.threadsRemember()){
      var v = null;
      try{ v = parseInt(localStorage.getItem('jieqi-threads'), 10); }catch(e){}
      if(v && v >= 1 && v <= this.cores()) return v;
    }
    return this.cores();
  },
  /* 握手成功后不再写任何线程记录（v3.4 起无「上次成功」概念） */

  parseInfo(line){

       仍保留降档兜底：万一该档起不来（极端内核 / 内存不足），
